<!doctype html>
<html lang="en">
<head>

<title>Pedal Post</title>

<style>

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a14; --surface:#1b251d; --surface2:#233026; --text:#ecebd9; --muted:#a4ad9b; --line:#334235;
    --map:#1d2820; --road:#4f5f53; --hill:#9a7440; --block:#2c3a30; --park:#2a4a33; --works:#e08a3e; --accent:#e9a64a; --bad:#ef6b77; --good:#6cd398; --sky:#7fb1e6;
    --shadow:0 6px 18px rgba(0,0,0,.35);

  }
}
:root[data-theme="dark"]{
  --bg:#121a14; --surface:#1b251d; --surface2:#233026; --text:#ecebd9; --muted:#a4ad9b; --line:#334235;
  --map:#1d2820; --road:#4f5f53; --hill:#9a7440; --block:#2c3a30; --park:#2a4a33; --works:#e08a3e; --accent:#e9a64a; --bad:#ef6b77; --good:#6cd398; --sky:#7fb1e6;
  --shadow:0 6px 18px rgba(0,0,0,.35);

}
body[data-season="autumn"]{--accent:#c2562b}
body[data-season="winter"]{--accent:#4f7fbf}
body[data-season="spring"]{--accent:#b04f8f}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;min-height:100%;-webkit-tap-highlight-color:transparent}

h2{font-size:20px}
h3{font-size:15px;margin:12px 0 4px;color:var(--accent)}
p{margin:6px 0}
button{font:inherit;color:inherit}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

.small{font-size:12.5px}

.town .route{fill:none;stroke:var(--sky);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.town .best{stroke:var(--good)}
.town .em{font-size:22px;text-anchor:middle;dominant-baseline:central}
.town .sm{font-size:13px}
.town .hs{font-size:17px}
.town .po{fill:var(--accent)}
.town .po-e{font-size:19px}
.town .house{fill:var(--surface);stroke:var(--line);stroke-width:2.5}
.town .h-express{stroke:#e0b020} .town .h-meal{stroke:#d9542b} .town .h-box{stroke:#b04f8f} .town .h-parcel{stroke:#a07a4a} .town .h-letter{stroke:#d0607a}
.town .hdone{stroke:var(--good);fill:color-mix(in srgb,var(--good) 20%,var(--surface))}
.town .bike{fill:var(--sky)}
.town .bk{font-size:14px}
.town .cost{font-size:10.5px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#fff}

.town .lbl{font-size:10.5px;font-weight:700;text-anchor:middle;dominant-baseline:central}

.hint{font-size:13.5px;color:var(--muted);text-align:center;margin:8px 0 6px}
.fold summary{cursor:pointer;font-family:Marcellus,Georgia,serif;font-size:15px;color:var(--accent);list-style-position:inside}

.pc{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--accent);background:var(--surface);border-radius:12px;padding:4px 6px;min-height:60px;min-width:50px;cursor:pointer;line-height:1.15}

.pc b{font-size:14px;font-variant-numeric:tabular-nums}

.pc.s2{grid-column:span 2}

.stops{margin:2px 0;padding-left:20px;font-size:13px}

.ex .slots .pc,.ex .loose .pc{cursor:default;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600}

.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{padding:11px 22px;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.rules{display:grid;gap:3px;font-size:13px}
.rules div{display:flex;gap:8px}
.rules .e{width:22px;text-align:center;flex:none}
.tag{font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 4px}
.ilist{display:grid;gap:6px}

.irow .it{flex:1;display:flex;flex-direction:column;min-width:0}
.irow .iv{flex:none;text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums}

.offer.empty{align-items:center;justify-content:center;color:var(--muted);border-style:dashed}
.rar{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rar-C{color:var(--muted)} .rar-U{color:var(--good)} .rar-R{color:var(--sky)} .rar-M{color:var(--accent)} .rar-X{color:var(--bad)}

.log:last-child{border-bottom:none}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.big-num{font-size:34px;font-family:Marcellus,Georgia,serif;font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)}
.titles{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:13.5px}
.tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13.5px;max-width:min(92vw,480px);z-index:30;box-shadow:var(--shadow)}
input[type=text]{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:7px 10px;width:150px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:40}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:480px;box-shadow:var(--shadow)}
.sheet p{margin:0 0 12px;font-size:15px}
.sheet .btn{min-width:120px}
footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

<body>
<div class="app" id="app"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* ---------------- seeded randomness ---------------- */
function seedOf(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
  return (h ^ h >>> 16) >>> 0;
}
function rngFor(...parts) {
  let a = seedOf(parts.join(':'));
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
function wpick(r, entries) {
  let tot = 0; for (const [, w] of entries) tot += w;
  let x = r() * tot;
  for (const [v, w] of entries) { if ((x -= w) < 0) return v; }
  return entries[entries.length - 1][0];
}
function shuffle(r, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------- deliveries and rules ---------------- */
const PT = {
  parcel:  {e: '📦', name: 'Parcel', from: 1, w: 3},
  letter:  {e: '💌', name: 'Letter', from: 1, w: 2},
  express: {e: '⚡', name: 'Express', from: 3, w: 1.6},
  meal:    {e: '🍕', name: 'Hot meal', from: 6, w: 1.5},
  box:     {e: '🎁', name: 'Big box', from: 11, w: 1.1}
};
const unlocked = d => Object.keys(PT).filter(t => PT[t].from <= d);
function baseRules() {
  return {
    moves: 0, cap: 4, hill: 2, works: 0, boxSize: 2,
    add: {parcel: 0, letter: 0, express: 0, meal: 0, box: 0},
    mult: {parcel: 1, letter: 1, express: 1, meal: 1, box: 1},
    late: 2, dl: 0, cool: 1, bell: 0, stars: 0, home: 0, rain: false
  };
}
const sizeOf = (p, R) => p.type === 'letter' ? 0 : p.type === 'box' ? R.boxSize : 1;
/* points for delivering p at move t as the k-th delivery of the day */
function parcelValue(p, t, k, R) {
  let v;
  if (p.type === 'express') v = t <= p.dl + R.dl ? p.pts + R.add.express : R.late;
  else if (p.type === 'meal') v = Math.max(2, p.pts + R.add.meal - Math.floor(t / (2 * R.cool)));
  else v = p.pts + R.add[p.type];
  v *= R.mult[p.type];
  if (R.bell && k === 1) v += R.bell;
  if (R.stars && k % 3 === 0) v += R.stars;
  return v;
}

/* ---------------- the town: a grid of corners joined by streets ---------------- */
const ek = (a, b) => a < b ? a + '-' + b : b + '-' + a;
const NBR = {};
function nbrs(W, H) {
  const key = W + 'x' + H; if (NBR[key]) return NBR[key];
  const a = [];
  for (let i = 0; i < W * H; i++) {
    const x = i % W, y = (i - x) / W, l = [];
    if (x > 0) l.push(i - 1); if (x < W - 1) l.push(i + 1); if (y > 0) l.push(i - W); if (y < H - 1) l.push(i + W);
    a.push(l);
  }
  return NBR[key] = a;
}
function cost(day, a, b, R) { const t = day.E[ek(a, b)]; return t === 's' ? 1 : t === 'h' ? R.hill : R.works || Infinity; }
function connected(W, H, E) {
  const seen = new Set([0]), q = [0], nb = nbrs(W, H);
  while (q.length) { const u = q.pop(); for (const v of nb[u]) if (!seen.has(v) && E[ek(u, v)] !== 'w') { seen.add(v); q.push(v); } }
  return seen.size === W * H;
}
function allDist(day, R) {
  const N = day.W * day.H, nb = nbrs(day.W, day.H), out = [];
  for (let s = 0; s < N; s++) {
    const d = new Array(N).fill(Infinity), done = new Array(N).fill(false); d[s] = 0;
    for (;;) {
      let u = -1; for (let i = 0; i < N; i++) if (!done[i] && d[i] < Infinity && (u < 0 || d[i] < d[u])) u = i;
      if (u < 0) break; done[u] = true;
      for (const v of nb[u]) { const c = d[u] + cost(day, u, v, R); if (c < d[v]) d[v] = c; }
    }
    out.push(d);
  }
  return out;
}
/* shortest ride between two corners; among equal ones, the one that passes the most houses in `want` */
function ridePath(day, R, from, to, want) {
  const N = day.W * day.H, nb = nbrs(day.W, day.H);
  const dist = new Array(N).fill(Infinity), gain = new Array(N).fill(0), prev = new Array(N).fill(-1), done = new Array(N).fill(false);
  dist[from] = 0;
  for (;;) {
    let u = -1;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < Infinity && (u < 0 || dist[i] < dist[u] || dist[i] === dist[u] && gain[i] > gain[u])) u = i;
    if (u < 0) break; done[u] = true; if (u === to) break;
    for (const v of nb[u]) {
      if (done[v]) continue;
      const d2 = dist[u] + cost(day, u, v, R), g2 = gain[u] + (want.has(v) ? 1 : 0);
      if (d2 < dist[v] || d2 === dist[v] && g2 > gain[v]) { dist[v] = d2; gain[v] = g2; prev[v] = u; }
    }
  }
  if (dist[to] === Infinity) return null;
  const path = [to]; while (path[0] !== from) path.unshift(prev[path[0]]);
  return {path, cost: dist[to]};
}

function dayShape(d) {
  if (d <= 4) return {W: 5, H: 5, n: 5};
  if (d <= 12) return {W: 5, H: 6, n: 7};
  if (d <= 22) return {W: 6, H: 6, n: 8};
  if (d <= 30) return {W: 6, H: 7, n: 9};
  if (d <= 60) return {W: 6, H: 7, n: 10};
  return {W: 7, H: 7, n: 11};
}
function makeTown(d, r, fair) {
  const S = dayShape(d), W = S.W, H = S.H, N = W * H, E = {}, pairs = [];
  for (let i = 0; i < N; i++) for (const j of nbrs(W, H)[i]) if (j > i) { pairs.push(ek(i, j)); E[ek(i, j)] = 's'; }
  shuffle(r, pairs);
  let works = Math.min(9, 1 + Math.floor(d / 6) + (d > 30 ? Math.floor((d - 30) / 15) : 0)) + (fair === 'marathon' ? 4 : 0);
  const hills = d < 3 ? 0 : Math.round(pairs.length * Math.min(0.25, 0.08 + d * 0.005));
  let k = 0;
  for (; k < pairs.length && works > 0; k++) { E[pairs[k]] = 'w'; if (connected(W, H, E)) works--; else E[pairs[k]] = 's'; }
  for (let h = 0; k < pairs.length && h < hills; k++, h++) E[pairs[k]] = 'h';
  const nodes = shuffle(r, [...Array(N).keys()]);
  const types = unlocked(d).map(t => [t, PT[t].w]), parcels = [];
  for (let q = 1; q <= S.n; q++) {
    const type = wpick(r, types);
    const pts = type === 'parcel' ? 2 + Math.floor(r() * 3) : type === 'letter' ? 1 : type === 'express' ? 5 : type === 'meal' ? 8 : 6 + Math.floor(r() * 3);
    parcels.push({type, at: nodes[q], pts});
  }
  return {W, H, E, depot: nodes[0], parcels};
}

/* fewest moves to visit every house: sets how many moves a day has */
function tourAll(day, D) {
  const P = day.parcels, n = P.length, M = 1 << n, dp = new Float64Array(M * n).fill(Infinity);
  for (let j = 0; j < n; j++) dp[(1 << j) * n + j] = D[day.depot][P[j].at];
  for (let m = 1; m < M; m++) for (let l = 0; l < n; l++) {
    const v = dp[m * n + l]; if (v === Infinity) continue;
    for (let j = 0; j < n; j++) if (!(m >> j & 1)) { const i = (m | 1 << j) * n + j, c = v + D[P[l].at][P[j].at]; if (c < dp[i]) dp[i] = c; }
  }
  let best = Infinity; for (let l = 0; l < n; l++) best = Math.min(best, dp[(M - 1) * n + l]);
  return best;
}

/* The best plan from a position: dynamic programming over which deliveries are done, the last stop and the time.
   It is exact, so the "best route" really is the best. */
function plan(day, R, D, from, t0, cand, k0, bagFixed) {
  const P = day.parcels, n = cand.length, T = budgetOf(day, R) - t0;
  if (T < 0) return {score: 0, order: [], home: false};
  const L = n + 1, nodeOf = j => j === n ? from : P[cand[j]].at;
  const dd = [], toHome = [];
  for (let a = 0; a < L; a++) { dd.push([]); for (let b = 0; b < L; b++) dd[a].push(D[nodeOf(a)][nodeOf(b)]); toHome.push(D[nodeOf(a)][day.depot]); }
  const size = cand.map(i => sizeOf(P[i], R)), M = 1 << n, T1 = T + 1;

  const best = plan(day, R, allDist(day, R), day.depot, 0, all, 0, false);
  day.best = best.score; day.bestRoute = planRoute(day, R, best, day.depot);
  day.bestBag = all.filter(i => best.order.includes(i) || day.parcels[i].type === 'letter');
  // the target comes from the best route with no items, so whatever your items add helps you reach it
  day.base = plan(day, R0, D0, day.depot, 0, all, 0, false).score;
  day.target0 = Math.max(4, Math.ceil(day.base * quota(d)));

/* ---------------- riding ---------------- */
function bagSpace(day, R) { return day.bag.reduce((a, i) => a + sizeOf(day.parcels[i], R), 0); }
function toggleBag(i) {
  const day = st.dayState, R = rulesFor(st, day, true), p = day.parcels[i];
  if (day.route.length > 1) { toast('Your bag is packed once you set off. Press Restart to repack.'); return; }
  if (p.type === 'letter') { toast('Letters take no space, so they always come along.'); return; }
  const k = day.bag.indexOf(i);
  if (k >= 0) day.bag.splice(k, 1);
  else if (bagSpace(day, R) + sizeOf(p, R) > R.cap) { toast('Your bag is full (' + R.cap + ' spaces). Take something out first.'); return; }
  else day.bag.push(i);
  save(); render();
}
function tapNode(n) {
  const day = st.dayState, R = rulesFor(st, day, true), sim = simulate(day, R, day.route);
  if (n === sim.at) return;
  const want = new Set(day.bag.filter(i => !sim.done.has(i)).map(i => day.parcels[i].at));
  const r = ridePath(day, R, sim.at, n, want);
  if (!r) { toast('There’s no way through to there.'); return; }
  const left = budgetOf(day, R) - sim.t;
  if (r.cost > left) { toast('That ride takes ' + r.cost + ' moves and you have ' + left + ' left.'); return; }
  day.taps.push(day.route.length); day.route.push(...r.path.slice(1));
  save(); render();
}
function undo() { const day = st.dayState; if (!day.taps.length) return; day.route.length = day.taps.pop(); save(); render(); }
function restartRoute() { const day = st.dayState; day.route = [day.depot]; day.taps = []; save(); render(); }
function castPeek() {
  const day = st.dayState, R = rulesFor(st, day, true);
  if (!st.charges.peek) return;
  const sim = simulate(day, R, day.route), fixed = day.route.length > 1;
  const cand = fixed ? day.bag.filter(i => !sim.done.has(i)) : day.parcels.map((p, i) => i);
  const pl = plan(day, R, allDist(day, R), sim.at, sim.t, cand, sim.del.length, fixed);
  if (!pl.order.length && !(pl.home && sim.at !== day.depot)) { toast('There’s nothing more to gain from here. End the shift.'); return; }
  if (!fixed) day.bag = day.parcels.map((p, i) => i).filter(i => pl.order.includes(i) || day.parcels[i].type === 'letter');
  const route = planRoute(day, R, pl, sim.at);
  // ride as far as the next delivery (or home)
  const stops = new Set(pl.order.map(i => day.parcels[i].at));
  let end = route.length - 1;
  for (let k = 1; k < route.length; k++) if (stops.has(route[k])) { end = k; break; }
  day.taps.push(day.route.length); day.route.push(...route.slice(1, end + 1));

}
function castMeasure() { const day = st.dayState; if (!st.charges.measure || day.measured) return; st.charges.measure--; day.measured = true; save(); render(); }

/* What a route takes in today and where each part comes from. `live` is the preview while you ride. */
function takingsCalc(day, route, live) {
  const R = rulesFor(st, day, true), sim = simulate(day, R, route), count = {};
  for (const x of sim.del) { const t = day.parcels[x.i].type; count[t] = (count[t] || 0) + 1; }
  const res = {points: sim.points, sim, count, perfect: sim.points >= day.best, parts: []}, c = {st, day};
  for (const it of st.items) {
    const def = ITEM[it.id]; if (!def.rules || def.route) continue;
    const v = sim.points - simulate(day, rulesFor(st, day, true, it), route).points;
    if (v) res.parts.push({it, pts: v});
  }
  let v = sim.points; const muls = [];
  for (const it of st.items) {
    const def = ITEM[it.id]; if (!def.bonus) continue;
    const b = def.bonus(c, res, it);
    if (b.add) { v += b.add; res.parts.push({it, add: b.add}); }
    if (b.mul && b.mul !== 1 && !(live && b.secret)) muls.push({it, mul: b.mul});
  }
  if (st.permMul > 1) muls.push({name: '🧪 Training Plan', mul: st.permMul});
  if (day.fair && st.temp.sweets) muls.push({name: '🍬 Lucky Sweets', mul: st.temp.sweets});
  for (const m of muls) { const gain = v > 0 ? v * (m.mul - 1) : 0; v += gain; res.parts.push({it: m.it, name: m.name, mul: m.mul, add: Math.round(gain)}); }
  res.takings = Math.max(0, Math.round(v));

}
const partName = p => p.it ? ITEM[p.it.id].e + ' ' + ITEM[p.it.id].name : p.name;
const partText = p => p.pts != null ? (p.pts > 0 ? '+' : '') + p.pts + ' points' : p.mul ? '×' + Math.round(p.mul * 100) / 100 + ' (+' + p.add + ')' : '+' + p.add;
function missCost(day, now) {
  const s = stats(st);

  return Math.round((5 + 80 * (1 - now / day.target)) * dmgScale(st.day) * (day.fair ? 1.6 * s.fairDmgMul : 1) * s.dmgMul);
}

function endShift() {
  const day = st.dayState, d = st.day, s = stats(st);
  const res = takingsCalc(day, day.route);
  res.best = day.best; res.target = day.target; res.target0 = day.target0; res.bestRoute = day.bestRoute;
  if (res.points > day.best) { day.best = res.points; res.beat = true; }
  res.reached = res.takings >= day.target;
  res.won = !!day.fair && res.reached;
  const log = [], c = ctx(rngFor(st.seed, 'end', d), log);
  for (const p of res.parts) if (p.it) p.it.h = (p.it.h || 0) + (p.pts || p.add || 0);
  each('after', c, res);
  if (day.fair) delete st.temp.sweets;

  const gp = [['the day', 1]];
  if (res.reached) gp.push(['reaching the target', 2]);
  const over = res.reached ? Math.min(2, Math.floor((res.takings / day.target - 1) / 0.25 + 1e-9)) : 0;
  if (over) gp.push(['beating the target by ' + over * 25 + '% or more', over]);
  if (res.perfect) gp.push(['matching the best route', 2]);
  if (res.won) gp.push(['winning the big day', 4]);
  res.goldParts = gp; res.gold = gp.reduce((a, x) => a + x[1], 0);

  res.dmg = 0;
  if (!res.reached) {
    const raw = (5 + 80 * (1 - res.takings / day.target)) * dmgScale(d) * (day.fair ? 1.6 : 1);
    res.dmg = Math.round(raw * s.dmgMul * (day.fair ? s.fairDmgMul : 1));
    const savers = st.items.filter(it => ITEM[it.id].stat && (ITEM[it.id].stat.dmgMul || (day.fair && ITEM[it.id].stat.fairDmgMul)));
    if (Math.round(raw) > res.dmg) log.push(savers.map(it => ITEM[it.id].e + ' ' + ITEM[it.id].name).join(' and ') + ' saved you ' + (Math.round(raw) - res.dmg) + ' energy');
  }
  st.gold += res.gold; st.total += res.takings;
  st.energy -= res.dmg;
  if (res.won) { st.fairsWon++; each('fairWin', c); }
  if (st.energy <= 0) {
    for (const it of st.items.slice()) { const def = ITEM[it.id]; if (def.save && def.save(c, it)) break; }
  }
  res.log = log;
  st.result = res;
  st.phase = st.energy <= 0 ? 'over' : 'result';
  if (st.phase === 'over') endRun();

  save(); render(); window.scrollTo(0, 0);
}
function endRun() {
  const days = st.day - 1;
  rec.best = Math.max(rec.best, days);
  for (const [n, name] of TITLES) if (days >= n) rec.titles[name] = (rec.titles[name] || 0) + 1;
}
function nextAfterResult() {
  const d = st.day, log = [];
  ui.show = null;
  st.milestone = false;
  const c = ctx(rngFor(st.seed, 'night', d), log);
  c.who = 'A night’s rest'; c.heal(3); c.who = '';
  each('night', c);
  st.nightLog = log;

}
function afterReward() {

/* ---------------- market ---------------- */
function odds(v) {
  const R = Math.min(30, Math.max(0, (v - 2) * 4)), M = Math.min(4, Math.max(0, (v - 5) * 0.5)), U = Math.min(55, 15 + v * 6);
  return [['C', 100 - U - R - M], ['U', U], ['R', R], ['M', M]];
}
function toolPool(rar, s) {
  const own = new Set(s.items.map(i => i.id));
  return ITEMS.filter(i => i.r === rar && !i.food && !own.has(i.id) && (!i.need || PT[i.need].from <= s.day + 5) && !(i.upgrade && stats(s).slots >= 8)).map(i => i.id);
}
function foodPool(rar) { return ITEMS.filter(i => i.r === rar && i.food).map(i => i.id); }
function rollOffer(r, v) {
  for (let k = 0; k < 20; k++) {
    const rar = wpick(r, odds(v));
    const pool = r() < 0.35 ? foodPool(rar) : toolPool(rar, st);
    const id = pool.length ? pick(r, pool) : null;
    if (id && !(st.shop && st.shop.offers.includes(id))) return id;
  }
  return 'apple';
}
function priceOf(id) {
  const def = ITEM[id]; let p = PRICE[def.r];
  if (def.food) p = Math.max(1, Math.ceil(p * 0.6) - stats(st).foodDisc);
  return p;
}
const sellValue = it => { const def = ITEM[it.id]; if (def.r === 'X') return -3; return Math.floor(PRICE[def.r] / 2) + (def.sellBonus ? def.sellBonus(it) : 0); };
function openMarket() {
  st.visits++;
  const r = rngFor(st.seed, 'market', st.visits);
  st.shop = {offers: [], reroll: stats(st).freeReroll ? 0 : 1, rolls: 0};
  for (let k = 0; k < 4; k++) st.shop.offers.push(rollOffer(r, st.visits));
  st.phase = 'market';
}
function reroll() {
  const sh = st.shop; if (st.gold < sh.reroll) return;
  st.gold -= sh.reroll; sh.rolls++;
  sh.reroll = sh.rolls === 1 && stats(st).freeReroll ? 1 : sh.reroll + 1;
  const r = rngFor(st.seed, 'market', st.visits, 'roll', sh.rolls);
  sh.offers = [];
  for (let k = 0; k < 4; k++) sh.offers.push(rollOffer(r, st.visits));
  save(); render();
}
function buy(k) {
  const id = st.shop.offers[k]; if (!id) return;
  const def = ITEM[id], p = priceOf(id);
  if (st.gold < p) return;
  if (!def.food && !def.ticket && !def.upgrade && st.items.length >= stats(st).slots) { toast('All your slots are full. Sell an item first.'); return; }
  st.gold -= p; st.shop.offers[k] = null;
  const log = [], c = ctx(rngFor(st.seed, 'buy', st.visits, k, st.shop.rolls), log);
  if (def.food) { def.eat(c); toast(def.e + ' ' + def.name + ': ' + (log.join(', ') || 'done')); }
  else if (def.ticket) {
    const r = c.r, rar = wpick(r, [['C', 30], ['U', 30], ['R', 20], ['M', 5], ['X', 15]]);
    const pool = rar === 'X' ? ['puncture', 'fine'].filter(x => !st.items.some(i => i.id === x)) : toolPool(rar, st);
    const got = pool.length ? pick(r, pool) : 'fine';
    gainItem(got); toast('🎟️ The raffle gave you ' + ITEM[got].e + ' ' + ITEM[got].name);
  } else { gainItem(id); if (def.upgrade) toast(def.e + ' ' + def.name + ': you now have ' + stats(st).slots + ' item slots'); }

}
function gainItem(id, log) {

  if (st.items.length >= stats(st).slots) { st.pending = id; return; }
  st.items.push({id, n: 0});

}
function sell(i) {

  st.items.splice(i, 1); st.gold += v;
  if (st.pending && st.items.length < stats(st).slots) { st.items.push({id: st.pending, n: 0}); st.pending = null; }
  if (st.phase === 'full' && !st.pending) { afterReward(); return; }
  save(); render();
}

/* ---------------- big-day prize ---------------- */
function openReward() {
  const r = rngFor(st.seed, 'reward', st.day), picks = [];
  for (let k = 0; k < 20 && picks.length < 3; k++) {
    const rar = wpick(r, odds(st.visits + 3));
    const pool = toolPool(rar, st).filter(x => !picks.includes(x));
    if (pool.length) picks.push(pick(r, pool));

}
function takeReward(id) {

/* what a delivery is worth if it arrives at move t (k = 2 leaves out the first-delivery and third-delivery bonuses) */
const worthAt = (p, R, t) => parcelValue(p, t, 2, R);

function parcelNote(p, R, short) {

function pill(x, y, text, cls) {

}
/* The map. o.labels adds, for each delivery still to do, how many moves away it is (blue, above) and what it is

function townSvg(day, R, route, o) {
  o = o || {};
  const sp = 64, pad = 38, W = day.W, H = day.H;
  const X = i => pad + (i % W) * sp, Y = i => pad + Math.floor(i / W) * sp;
  const w = pad * 2 + (W - 1) * sp, h = pad * 2 + (H - 1) * sp, out = [];
  // city blocks between the streets; a few of them are parks
  for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
    const park = seedOf(day.depot + ':' + day.W + ':' + x + ':' + y) % 6 === 0, c = y * W + x;
    out.push(`<rect x="${X(c) + 10}" y="${Y(c) + 10}" width="${sp - 20}" height="${sp - 20}" rx="7" class="${park ? 'park' : 'block'}"/>`);
  }
  const marks = [];
  for (const k in day.E) {
    const [a, b] = k.split('-').map(Number), t = day.E[k], mx = (X(a) + X(b)) / 2, my = (Y(a) + Y(b)) / 2;
    const line = cls => `<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" class="${cls}"/>`;
    if (t === 'w') { out.push(line(R.works ? 'st hill' : 'st closed')); marks.push(line('works')); if (R.works) marks.push(costMark(mx, my, R.works)); continue; }

  const px = X(day.depot), py = Y(day.depot);

  day.parcels.forEach((p, i) => {
    const x = X(p.at), y = Y(p.at), packed = bag.has(i), dn = done[i];
    out.push(`<g class="${!packed && !dn ? 'off' : ''}"><circle cx="${x}" cy="${y}" r="15" class="house h-${p.type}${dn ? ' hdone' : ''}"/><text x="${x}" y="${y + 1}" class="em hs">${PT[p.type].e}</text></g>`);
    if (dn) { out.push(`<circle cx="${x + 14}" cy="${y - 14}" r="8.5" class="ok"/><text x="${x + 14}" y="${y - 14}" class="okt">${dn.k}</text>`, pill(x, y + 25, '+' + dn.v, 'got')); return; }

  if (o.tap) for (let i = 0; i < W * H; i++) out.push(`<circle cx="${X(i)}" cy="${Y(i)}" r="29" class="hit" data-n="${i}"/>`);

}
const ARROWS = '<defs><marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.7" markerHeight="2.7" orient="auto"><path d="M2,1.5 L7.5,5 L2,8.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';

  L.meal = '8 points' + plus('meal') + ', minus 1 for every ' + 2 * R.cool + ' moves since you set off (never below 2). Takes 1 space.';
  L.box = 'the number on it (6 to 8)' + plus('box') + '. Takes ' + R.boxSize + ' space' + (R.boxSize > 1 ? 's' : '') + '.';
  L.streets = 'A street costs 1 move, a hill costs ' + R.hill + '. Roadworks 🚧 ' + (R.works ? 'cost ' + R.works + '.' : 'are closed.');

  else if (!st || ui.title) app.innerHTML = titleView();
  else app.innerHTML = ({day: dayView, result: resultView, market: marketView, reward: rewardView, full: fullView, over: overView}[st.phase] || dayView)();
  if (ui.ask) app.insertAdjacentHTML('beforeend', `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true"><p>${esc(ui.ask.text)}</p><div class="row c"><button class="btn" id="askno">Cancel</button><button class="btn pri" id="askyes">${esc(ui.ask.yes)}</button></div></div></div>`);
  if (ui.tip) app.insertAdjacentHTML('beforeend', `<div class="tip">${esc(ui.tip)}</div>`);
  bind();
}
function bind() {
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  on('#askno', () => { ui.ask = null; render(); });
  on('#askyes', () => { const f = ui.ask.fn; ui.ask = null; render(); f(); });
  on('#cont', () => { ui.title = false; render(); });
  const fresh = (fn) => { if (!st || st.phase === 'over') fn(); else ask('Start a new run? The current one will be lost.', 'Start a new run', fn); };
  on('#new', () => fresh(() => { ui.title = false; newRun(); render(); }));
  on('#seeded', () => { const s = $('#seed').value.trim(); if (s) fresh(() => { ui.title = false; newRun(s); render(); }); });
  on('#menu', () => { ui.title = true; render(); });
  on('#help', () => { ui.help = true; render(); window.scrollTo(0, 0); });
  const closeHelp = () => { ui.help = false; rec.seenHelp = true; save(); render(); window.scrollTo(0, 0); };
  on('#helpback', closeHelp); on('#helpdone', closeHelp);
  $$('details[data-k]').forEach(el => el.ontoggle = () => { ui[el.dataset.k] = el.open; });
  $$('[data-show]').forEach(b => b.onclick = () => { ui.show = b.dataset.show; render(); });
  on('#again', () => { newRun(); render(); });
  on('#same', () => { newRun(st.seed); render(); });
  on('#undo', undo);
  on('#restart', restartRoute);
  on('#end', () => {
    // only ask when something in the bag can still be reached with the moves left
    const day = st.dayState, R = rulesFor(st, day, true), sim = simulate(day, R, day.route), left = budgetOf(day, R) - sim.t;
    const dist = allDist(day, R)[sim.at], reachable = day.bag.filter(i => !sim.done.has(i) && dist[day.parcels[i].at] <= left).length;
    if (reachable) ask('You still have ' + left + ' move' + (left > 1 ? 's' : '') + ', enough to reach ' + reachable + ' more deliver' + (reachable > 1 ? 'ies' : 'y') + ' in your bag. End the shift anyway?', 'End shift', endShift);
    else endShift();
  });
  on('#next', nextAfterResult);
  on('#reroll', reroll);
  on('#leave', () => { if (st.pending) st.pending = null; st.shop = null; st.nightLog = null; st.day++; startDay(); render(); window.scrollTo(0, 0); });
  on('#letgo', () => { st.pending = null; afterReward(); });
  $$('[data-n]').forEach(b => b.onclick = () => tapNode(+b.dataset.n));
  $$('[data-p]').forEach(b => b.onclick = () => toggleBag(+b.dataset.p));
  $$('[data-spell]').forEach(b => b.onclick = () => ({peek: castPeek, measure: castMeasure}[b.dataset.spell])());
  $$('[data-buy]').forEach(b => b.onclick = () => buy(+b.dataset.buy));
  $$('[data-take]').forEach(b => b.onclick = () => takeReward(b.dataset.take));
  if (st && (st.phase === 'market' || st.phase === 'full')) bindItems();
}
ui.title = true;
render();
</script>
</body>
</html>
