<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reef Keeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dcebee; --surface:#f8fbfa; --surface2:#e9f2f2; --text:#14262c; --muted:#56696f; --line:#c3d7da;
  --sea1:#2f8098; --sea2:#1b5a70; --cell:#eef5f1; --accent:#d26a2a; --good:#23805a; --bad:#c0392b; --sky:#2563a8; --gold:#a8790a;
  --shadow:0 6px 18px rgba(20,38,44,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b171b; --surface:#13242a; --surface2:#1a2f36; --text:#e6f0ee; --muted:#9db1b3; --line:#2a434b;
    --sea1:#17506a; --sea2:#0d3343; --cell:#234852; --accent:#f0954f; --good:#5fd09a; --bad:#f07a6c; --sky:#7fb6f0; --gold:#e8c35a;
    --shadow:0 6px 18px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b171b; --surface:#13242a; --surface2:#1a2f36; --text:#e6f0ee; --muted:#9db1b3; --line:#2a434b;
  --sea1:#17506a; --sea2:#0d3343; --cell:#234852; --accent:#f0954f; --good:#5fd09a; --bad:#f07a6c; --sky:#7fb6f0; --gold:#e8c35a;
  --shadow:0 6px 18px rgba(0,0,0,.4);
  color-scheme:dark;
}
body[data-season="autumn"]{--accent:#c2562b}
body[data-season="winter"]{--accent:#4f7fbf}
body[data-season="spring"]{--accent:#b04f8f}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0}
h1{font-size:26px}
h2{font-size:20px}
h3{font-size:15px;margin:12px 0 4px;color:var(--accent)}
p{margin:6px 0}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.good{color:var(--good)} .bad{color:var(--bad)}

/* the playing screen: header, goal, board that takes the free space, and the dock with every control */
.game{min-height:100vh;min-height:100dvh;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:8px 10px max(8px,env(safe-area-inset-bottom))}
.hud{display:flex;align-items:center;gap:6px}
.ib{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.dn{font-family:Marcellus,Georgia,serif;font-size:19px;white-space:nowrap;line-height:1.1}
.dn small{display:block;font-family:system-ui,sans-serif;font-size:11px;color:var(--muted)}
.air{flex:1;min-width:70px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.air b{color:var(--text)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky);transition:width .3s}
.air.low .bar i{background:var(--bad)}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;line-height:1.2}
.pill b{display:block;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 10px 2px;position:sticky;top:4px;z-index:6}
.gl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.gl b{font-size:17px;font-variant-numeric:tabular-nums}
.gl .gm{font-size:12.5px;font-weight:600;text-align:center}
.gbar{position:relative;height:8px;background:var(--line);border-radius:4px;margin:3px 0 14px}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent);transition:width .25s}
.gbar.ok i{background:var(--good)}
.gbar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--surface);text-decoration:none}
.gbar s span{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.gs{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:3px 10px;font-size:12.5px;cursor:pointer;text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner b{color:var(--accent)}
.play{display:flex;flex-direction:column;gap:6px;flex:1 0 auto}
.boardwrap{flex:1 0 auto;display:grid;place-items:center}
@media (min-width:900px){
  .game{max-width:1180px}
  .play{flex-direction:row;align-items:flex-start;gap:12px}
  .play .boardwrap{flex:1;min-width:0}
  .play .dock{width:340px;flex:none;top:8px;bottom:auto;box-shadow:var(--shadow)}
  .play .info{min-height:4em}
}
.board{display:grid;gap:4px;padding:6px;border-radius:16px;background:linear-gradient(160deg,var(--sea1),var(--sea2));box-shadow:var(--shadow);
  width:100%;grid-template-columns:repeat(var(--w),1fr);touch-action:manipulation}
.cell{position:relative;aspect-ratio:1;border:none;border-radius:9px;background:var(--cell);display:grid;place-items:center;cursor:pointer;padding:0;line-height:1;
  font-size:calc(var(--cs,60px) * .5);transition:transform .08s}
.cell:active{transform:scale(.95)}
.cell.fixed{cursor:default;background:color-mix(in srgb,var(--cell) 25%,transparent)}
.cell.open{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.cell.pin{box-shadow:inset 0 0 0 3px var(--sky)}
.cell .pt{position:absolute;right:4px;bottom:3px;font-size:max(10px,min(calc(var(--cs,60px) * .17), 14px));font-weight:700;font-variant-numeric:tabular-nums;color:var(--good);font-family:system-ui,sans-serif}
.cell .pt.neg{color:var(--bad)}
.cell .pt.zero{color:var(--muted)}
.cell .hot{position:absolute;inset:0;border-radius:9px;display:grid;place-items:center;font-size:max(12px,min(calc(var(--cs,60px) * .22), 18px));font-weight:700;color:var(--text);font-family:system-ui,sans-serif}
.dock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 6px;display:flex;flex-direction:column;gap:5px;position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.info{font-size:12px;color:var(--muted);line-height:1.3;height:2.6em;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info b{color:var(--text)}
.hand{display:flex;gap:5px;justify-content:safe center;overflow-x:auto;scrollbar-width:none;padding:2px 1px}
.htile{display:flex;align-items:center;gap:3px;border:1.5px solid var(--line);background:var(--surface2);border-radius:11px;padding:2px 7px;font-size:21px;cursor:pointer;line-height:1.2;flex:none}
.htile span{font-size:12.5px;font-weight:700;color:var(--muted)}
.htile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--surface)}
.htile.none{opacity:.35;cursor:default}
.tools{display:flex;gap:4px;justify-content:center}
.tb{border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 6px;min-width:34px;justify-content:center;cursor:pointer;font-size:13px;flex:none;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:3px}
.tb:disabled{opacity:.4;cursor:default}
.tb.pouch{border-style:dashed;padding:6px 5px}
.tb.fin{background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px;padding:6px 10px;flex:1 1 auto;justify-content:center;max-width:220px}
.tb.fin.ok{background:var(--good);border-color:var(--good)}

/* scrolling pages (results, market, prizes, title) keep their main buttons in a bar fixed to the bottom */
.page{max-width:620px;margin:0 auto;padding:12px 16px 120px}
.page .hud{margin-bottom:8px}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom));z-index:20}
.actions .in{max-width:620px;margin:0 auto;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{padding:11px 22px;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.rules{display:grid;gap:4px;font-size:13px}
.rules div{display:flex;gap:8px}
.rules .e{width:24px;text-align:center;flex:none;font-size:16px}
.rules .n{color:var(--muted);font-size:12px;white-space:nowrap}
.ilist{display:grid;gap:6px}
.irow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:13.5px;text-align:left;width:100%}
button.irow{cursor:pointer}
.irow .ie{font-size:22px;flex:none}
.irow .it{flex:1;display:flex;flex-direction:column;min-width:0}
.irow .iv{flex:none;text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums}
.irow .iv small{display:block;font-size:11px;color:var(--muted)}
.irow.empty{border-style:dashed;background:transparent;color:var(--muted);justify-content:center}
.tag{font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:0 4px}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:560px){.offers{grid-template-columns:1fr 1fr 1fr}}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;min-height:150px}
.offer .oe{font-size:28px}
.offer .on{font-weight:700}
.offer .od{font-size:12.5px;color:var(--muted);flex:1}
.offer.empty{align-items:center;justify-content:center;color:var(--muted);border-style:dashed}
.offer.pack{background:var(--surface2)}
.rar{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rar-C{color:var(--muted)} .rar-U{color:var(--good)} .rar-R{color:var(--sky)} .rar-M{color:var(--accent)} .rar-X{color:var(--bad)} .rar-K{color:#8e44ad}
.log{font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.log:last-child{border-bottom:none}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.mini{display:grid;gap:2px;padding:4px;border-radius:10px;background:var(--sea2)}
.mini i{aspect-ratio:1;border-radius:4px;background:var(--cell);display:grid;place-items:center;font-style:normal;font-size:clamp(10px,3vw,17px)}
.mini i.f{background:transparent}
.big-num{font-size:34px;font-family:Marcellus,Georgia,serif;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;background:var(--gold);color:#fff;margin:2px}
.titles{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:13.5px}
.bagrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.bagrow:last-child{border-bottom:none}
.bagrow .e{font-size:22px;width:28px;text-align:center}
.bagrow .t{flex:1;min-width:0}
.tip.top{top:38%;bottom:auto}
.tip{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13.5px;max-width:min(92vw,480px);z-index:60;box-shadow:var(--shadow);text-align:center}
input[type=text]{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:7px 10px;width:150px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:40}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:100%;max-width:560px;max-height:84vh;overflow:auto;box-shadow:var(--shadow)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sheet p{font-size:14px}
.help ol{margin:4px 0 6px;padding-left:20px}
.help li{margin:3px 0}
.ex{display:grid;gap:3px;padding:5px;border-radius:10px;background:linear-gradient(160deg,var(--sea1),var(--sea2));max-width:100%;flex:none}
.ex i{position:relative;aspect-ratio:1;border-radius:6px;background:var(--cell);display:grid;place-items:center;font-style:normal;font-size:calc(var(--ec) * .5);line-height:1}
.ex i.hl{background:color-mix(in srgb,var(--accent) 30%,var(--cell))}
.ex i.fo{box-shadow:inset 0 0 0 3px var(--accent)}
.ex i.f{background:transparent}
.ex i b{position:absolute;right:2px;bottom:1px;font-size:max(9px,calc(var(--ec) * .24));color:var(--good);font-family:system-ui,sans-serif}
.ex i b.neg{color:var(--bad)} .ex i b.zero{color:var(--muted)}
.guide .gpic{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.guide .arrow{font-size:26px;color:var(--accent)}
.guide .demo{flex-direction:column}
.guide .gtitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.guide .dots{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.guide .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.guide .dots i.on{background:var(--accent)}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.tiers div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted)}
.tiers b{display:block;font-size:15px;color:var(--text)}
.tiers .miss b{color:var(--bad)} .tiers .top{border-color:var(--gold)} .tiers .top b{color:var(--gold)}
.gi{display:flex;gap:12px;align-items:flex-start;margin:10px 0;font-size:14px}
.gi .ge{font-size:30px;line-height:1;flex:none;width:40px;text-align:center}
.spc{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.spc:last-child{border-bottom:none}
.spc p{margin:2px 0 0;font-size:13px}
footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.cell,.bar i,.gbar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* ---------------- seeded randomness ---------------- */
function seedOf(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
  return (h ^ h >>> 16) >>> 0;
}
function rngFor(...parts) {
  let a = seedOf(parts.join(':'));
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
function wpick(r, entries) {
  let tot = 0; for (const e of entries) tot += e[1];
  let x = r() * tot;
  for (const e of entries) { if ((x -= e[1]) < 0) return e[0]; }
  return entries[entries.length - 1][0];
}
function shuffle(r, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------- creatures, decorations and the sea floor ---------------- */
const KINDS = {
  coral:   {e: '🪸', name: 'Coral'},
  clown:   {e: '🐠', name: 'Clownfish'},
  kelp:    {e: '🌿', name: 'Kelp'},
  sardine: {e: '🐟', name: 'Sardines'},
  crab:    {e: '🦀', name: 'Crab'},
  octo:    {e: '🐙', name: 'Octopus'},
  puffer:  {e: '🐡', name: 'Pufferfish'},
  star:    {e: '⭐', name: 'Starfish'},
  squid:   {e: '🦑', name: 'Squid'},
  lobster: {e: '🦞', name: 'Lobster'},
  dolphin: {e: '🐬', name: 'Dolphin'},
  shrimp:  {e: '🦐', name: 'Shrimp'},
  jelly:   {e: '🪼', name: 'Jellyfish'},
  turtle:  {e: '🐢', name: 'Turtle'},
  shark:   {e: '🦈', name: 'Shark'}
};
const KIND_IDS = Object.keys(KINDS);
const BIT = Object.fromEntries(KIND_IDS.map((k, i) => [k, 1 << i]));
/* every run starts with coral, clownfish and two of these */
const STARTERS = ['kelp', 'sardine', 'crab', 'octo', 'puffer', 'star', 'squid', 'lobster', 'dolphin', 'shrimp'];
/* decorations come from items: you place them like creatures, they score nothing themselves and help what is around them */
const DECOR = {
  amphora: {e: '🏺', name: 'Amphora', desc: 'Counts as a rock. Creatures next to it score +1.'},
  statue:  {e: '🗿', name: 'Statue', desc: 'Creatures in its row and column score +1.'},
  lantern: {e: '🏮', name: 'Lantern', desc: 'Creatures in the eight cells around it score +1.'},
  clam:    {e: '🦪', name: 'Pearl Clam', desc: 'When you finish, +1 shell for each creature next to it.'}
};
const FEAT = {
  rock:   {e: '🪨', name: 'Rock'},
  litter: {e: '🛢️', name: 'Litter'},
  vent:   {e: '🫧', name: 'Bubble vent'}
};
const tileOf = t => KINDS[t] || DECOR[t] || FEAT[t];
const ORDER = KIND_IDS.concat(Object.keys(DECOR));
const ROCKY = {rock: 1, amphora: 1};

function baseRules() {
  const R = {base: {}, adj: {}, row: {}, col: {}, diag: {}, edge: {}, corner: {}, inner: {}, alone: {}, div: {}, divDiag: {}, mult: {},
    near: {vent: 1, litter: -1}, dnear: {}, line: {},
    empty: 0, all: 0, edgeAll: 0, innerAll: 0, cornerAll: 0, cornerMul: 1, mix: 0, sameAll: 0};
  for (const k of KIND_IDS) {
    R.base[k] = 0; R.adj[k] = {}; R.row[k] = {}; R.col[k] = {}; R.diag[k] = {};
    R.edge[k] = 0; R.corner[k] = 0; R.inner[k] = 0; R.alone[k] = 0; R.div[k] = 0; R.mult[k] = 1;
  }
  const B = R.base, A = R.adj;
  B.coral = 1; A.coral.coral = 1;
  A.clown.coral = 2;
  B.kelp = 1; R.col.kelp.kelp = 1;
  R.row.sardine.sardine = 1;
  R.edge.crab = 3;
  B.octo = 1; A.octo.empty = 1;
  B.puffer = 1; R.alone.puffer = 4;
  B.star = 1; R.corner.star = 4;
  B.squid = 1; R.diag.squid.any = 1;
  B.lobster = 1; A.lobster.rock = 2;
  B.dolphin = 1; A.dolphin.any = 1;
  R.div.shrimp = 1;
  B.jelly = 4;
  B.turtle = 1; A.turtle.jelly = 3;
  B.shark = 1; R.row.shark = {clown: 1, sardine: 1}; R.col.shark = {clown: 1, sardine: 1};
  A.clown.shark = -2; A.sardine.shark = -2;
  for (const k of KIND_IDS) if (k !== 'turtle') A[k].jelly = (A[k].jelly || 0) - 1;
  return R;
}
/* which kinds need their row and column, or their diagonals, looked at */
function prep(R) {
  R.L = {}; R.Dg = {};
  const lineDec = Object.values(R.line).some(Boolean), dDec = Object.values(R.dnear).some(Boolean);
  for (const k of KIND_IDS) {
    R.L[k] = lineDec || Object.values(R.row[k]).some(Boolean) || Object.values(R.col[k]).some(Boolean);
    R.Dg[k] = dDec || Object.values(R.diag[k]).some(Boolean) || !!R.divDiag[k];
  }

/* Best layout for a hand: simulated annealing over swaps, with a bench for tiles left unplaced. */
function solve(D, hand, R, seed) {
  const N = nbFor(D), rng = rngFor(seed, 'solve'), C = compiled(R);
  const free = []; for (let i = 0; i < D.w * D.h; i++) if (!D.fixed[i]) free.push(i);
  const F = free.length, H = hand.map(t => CODE[t]), P = F + H.length;
  const g = toCodes(D.fixed);

  let bestTot = -1e9, bestG = null;

    mark++; let s = 0;

    if (b >= 0) { const L = AFF[b]; for (let q = 0; q < L.length; q++) { const j = L[q]; if (stamp[j] !== mark) s += scoreAt(g, j, C, N); } }
    return s;
  };
  const iters = Math.max(10000, P * 1100), restarts = 4, pos = new Uint8Array(P), cool = Math.pow(0.02, 1 / iters);
  for (let r = 0; r < restarts; r++) {
    const start = shuffle(rng, H.concat(new Array(F).fill(0)));
    for (let k = 0; k < P; k++) pos[k] = start[k];
    for (let k = 0; k < F; k++) g[free[k]] = pos[k];
    let cur = 0; for (let i = 0; i < g.length; i++) cur += scoreAt(g, i, C, N);
    if (cur > bestTot) { bestTot = cur; bestG = g.slice(); }
    let T = 3;
    for (let it = 0; it < iters; it++) {
      T *= cool;
      const a = Math.floor(rng() * P), b = Math.floor(rng() * P);
      if (a === b || pos[a] === pos[b] || (a >= F && b >= F)) continue;
      const ca = a < F ? free[a] : -1, cb = b < F ? free[b] : -1;
      const before = local(ca, cb);

      if (ca >= 0) g[ca] = pos[a]; if (cb >= 0) g[cb] = pos[b];
      const delta = local(ca, cb) - before;

      } else {
        x = pos[a]; pos[a] = pos[b]; pos[b] = x;
        if (ca >= 0) g[ca] = pos[a]; if (cb >= 0) g[cb] = pos[b];

  }

}

const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));

/* ---------------- run state ---------------- */
const KEY = 'reef-keeper-v1', REC = 'reef-keeper-records-v1';
let st = null, ui = {sel: null, tip: '', hist: [], sheet: null};
let rec = {best: 0, runs: 0, titles: {}};
try { rec = Object.assign(rec, JSON.parse(localStorage.getItem(REC) || '{}')); } catch (e) {}
try { st = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
if (st && st.v !== 1) st = null;
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); localStorage.setItem(REC, JSON.stringify(rec)); } catch (e) {} }

function stats(s) {
  const o = {targetMul: 1, dmgMul: 1, maxAir: 0, slots: 5 + (s.slotBonus || 0), pouch: 3 + (s.pouchBonus || 0), discount: 0, freeReroll: 0, fogProof: 0,
    festDmgMul: 1, litter: 0, interestCap: 0, overMul: 1, offers: 0};
  for (const it of s.items) {
    const def = ITEM[it.id];
    for (const src of [def.stat, def.statFn && def.statFn(it)]) {
      if (!src) continue;
      for (const k in src) { if (/Mul$/.test(k)) o[k] *= src[k]; else o[k] += src[k]; }
    }
  }
  return o;
}
const maxAir = s => 100 + stats(s).maxAir + s.maxBonus;
const has = id => st.items.some(i => i.id === id);
const bagSize = bag => Object.values(bag).reduce((a, b) => a + b, 0);
function bagPick(r) { return wpick(r, Object.entries(st.bag).filter(e => e[1] > 0)); }
function topBag() { let best = null; for (const k of KIND_IDS) if ((st.bag[k] || 0) > (st.bag[best] || 0)) best = k; return best || 'coral'; }
function topOf(list) {
  if (!list) return null;
  const n = {}; let best = null;
  for (const t of list) if (KINDS[t]) { n[t] = (n[t] || 0) + 1; if (!best || n[t] > n[best]) best = t; }
  return best;
}
/* A hand that follows the bag closely: each species gets its share, rounded down, and the leftover places are drawn at random.
   With no random source the leftovers go to the largest remainders, which is how the standard hand for the target is made. */
function drawHand(r, bag, n) {
  const ks = KIND_IDS.filter(k => bag[k] > 0), T = bagSize(bag), out = [], rem = [];
  if (!T) return out;
  for (const k of ks) { const x = n * bag[k] / T, b = Math.floor(x); for (let i = 0; i < b; i++) out.push(k); rem.push([k, x - b]); }
  while (out.length < n && rem.length) {
    let k;
    if (r) k = wpick(r, rem.map(e => [e[0], e[1] + 1e-6]));
    else k = rem.slice().sort((a, b) => b[1] - a[1])[0][0];
    out.push(k);
    const i = rem.findIndex(e => e[0] === k); rem.splice(i, 1);
  }
  return out;
}

/* today's scoring rules; `except` leaves one item out, to work out what that item adds */
function rulesFor(s, day, withItems, except) {
  const R = baseRules(), cur = day.current && CURRENTS[day.current];
  const calm = withItems && s.items.some(i => i.id === 'calm' && i !== except);
  if (cur && cur.apply && !(calm && cur.bad)) cur.apply(R);
  if (day.event) EVENTS[day.event.id].apply(R, day.event);
  if (withItems) for (const it of s.items) { const def = ITEM[it.id]; if (def.rules && it !== except) def.rules(R, day); }
  return prep(R);
}
function newRun(seed) {
  seed = seed || Math.random().toString(36).slice(2, 8);
  const r = rngFor(seed, 'bag'), two = shuffle(r, STARTERS.slice()).slice(0, 2);
  const bag = {coral: 4, clown: 3}; for (const k of two) bag[k] = 3;
  st = {v: 1, seed, day: 1, air: 100, maxBonus: 0, shells: 6, items: [], pouch: [], bag, startBag: Object.assign({}, bag),
    charges: {peek: 1, measure: 1, hot: 1}, festsWon: 0, visits: 0, permMul: 1, temp: {}, totalScore: 0, best2x: 0, uses: 0,
    phase: 'day', pending: null, shop: null, reward: null, result: null, milestone: false};
  rec.runs++;
  startDay();
}

/* effect context handed to item hooks; c.it is the item whose hook is running, so its name goes in the log and its totals grow */
function ctx(r, log) {
  const tag = text => (c.it ? ITEM[c.it.id].e + ' ' + ITEM[c.it.id].name + ': ' : c.who ? c.who + ': ' : '') + text;
  const c = {
    st, day: st.dayState, r, it: null, who: '',
    shells(n) { if (!n) return; st.shells = Math.max(0, st.shells + n); if (c.it) c.it.g = (c.it.g || 0) + n; log && log.push(tag((n > 0 ? '+' : '') + n + ' shell' + (Math.abs(n) === 1 ? '' : 's'))); },
    air(n) {
      const m = maxAir(st), was = st.air; st.air = Math.max(0, Math.min(m, st.air + n));
      if (c.it && n > 0) c.it.en = (c.it.en || 0) + st.air - was;
      log && log.push(tag((n > 0 ? '+' : '') + n + ' air'));
    },
    charge(k, n) { st.charges[k] = (st.charges[k] || 0) + n; c.note('+' + n + ' ' + SPELL[k].name.toLowerCase()); log && log.push(tag('+' + n + ' ' + SPELL[k].name.toLowerCase())); },
    addTile(t) { if (!t) return; st.dayState.hand.push(t); c.note('+1 ' + tileOf(t).e); log && log.push(tag('+1 ' + tileOf(t).e + ' in your hand')); },
    note(text) { if (c.it && st.dayState && st.phase === 'day') { const n = st.dayState.notes = st.dayState.notes || {}; n[c.it.id] = n[c.it.id] ? n[c.it.id] + ', ' + text : text; } },
    breakItem(it, why) {
      const i = st.items.indexOf(it); if (i < 0) return;
      st.items.splice(i, 1);
      (log || []).push(ITEM[it.id].e + ' ' + ITEM[it.id].name + ' ' + (why || 'broke'));
      const was = c.it;
      for (const o of st.items.slice()) { const d = ITEM[o.id]; if (d.onBreak) { c.it = o; d.onBreak(c, o); } }
      c.it = was;
    },
    gain(id) { gainItem(id, log); }
  };
  return c;
}
const SPELL = {
  peek: {e: '🔍', name: 'Peek', desc: 'Places one tile where the best layout has it.'},
  measure: {e: '📏', name: 'Measure', desc: 'Shows the best possible reef score for today.'},
  hot: {e: '🧭', name: 'Hotspot', desc: 'For the rest of the day, shows how many points the tile you hold would add on each empty cell.'}
};
function each(hook, c, ...args) {
  for (const it of st.items.slice()) { const d = ITEM[it.id]; if (d[hook] && st.items.includes(it)) { c.it = it; d[hook](c, ...args, it); c.it = null; } }
}

function startDay() {
  const d = st.day, r = rngFor(st.seed, 'day', d), S = dayShape(d), s = stats(st);
  const D = {w: S.w, h: S.h, fixed: new Array(S.w * S.h).fill(null)};
  const cells = shuffle(r, [...Array(S.w * S.h).keys()]);
  const litter = Math.min(7, Math.floor(d / 6) + (d > 30 ? Math.floor((d - 30) / 12) : 0) + s.litter);
  const rocks = d < 3 ? 1 : 1 + Math.floor(r() * 2.6);
  const vents = d < 2 ? 0 : (r() < 0.4 ? 1 : 0) + (r() < 0.12 ? 1 : 0);
  let k = 0;
  for (let n = 0; n < litter; n++) D.fixed[cells[k++]] = 'litter';
  for (let n = 0; n < rocks; n++) D.fixed[cells[k++]] = 'rock';
  for (let n = 0; n < vents; n++) D.fixed[cells[k++]] = 'vent';
  let event = null, current = null;
  if (isFest(d)) {
    const id = wpick(r, [['spot', 3], ['tidy', 1], ['tide', 1], ['treasure', 1], ['shoal', 1], ['heart', 1]]);
    event = {id};
    if (id === 'spot') event.k = pick(r, KIND_IDS.filter(x => st.bag[x] > 0));
  } else if (d >= 3 && r() < 0.32) current = pick(r, Object.keys(CURRENTS));
  const n = S.hand + (current === 'moon' ? 2 : 0);
  const hand = drawHand(r, st.bag, Math.min(n, bagSize(st.bag)));
  st.dayState = {D, hand0: hand.slice(), hand, g: D.fixed.slice(), pinned: {}, current, event, measured: false, hotOn: false, notes: {}, n};
  st.phase = 'day';
  const log = [];
  each('start', ctx(rngFor(st.seed, 'start', d), log));
  const day = st.dayState;
  day.startLog = log;
  resolveBest(day);
  // the target comes from the best layout of a standard hand from the bag you started with, with no items
  const ref = drawHand(null, st.startBag, n);
  const base = solve(D, ref, rulesFor(st, day, false), st.seed + ':' + d + ':base');
  day.base = base.score;
  day.target0 = Math.max(4, Math.ceil(base.score * quota(d)));
  day.target = Math.max(4, Math.ceil(day.target0 * s.targetMul));
  ui.sel = nextSel(day); ui.hist = [];
  save();
}
function resolveBest(day) {
  const best = solve(day.D, day.hand, rulesFor(st, day, true), st.seed + ':' + st.day + ':' + (st.uses || 0));
  day.best = best.score; day.bestGrid = best.grid;
}

/* ---------------- playing a day ---------------- */
function handLeft(day) {
  const left = {};
  for (const t of day.hand) left[t] = (left[t] || 0) + 1;
  for (const t of day.g) if (KINDS[t] || DECOR[t]) left[t] = (left[t] || 0) - 1;
  return left;
}
function nextSel(day, prefer) {
  const left = handLeft(day);
  if (prefer && left[prefer] > 0) return prefer;
  return ORDER.find(t => left[t] > 0) || null;
}
function remember() { ui.hist.push(st.dayState.g.slice()); if (ui.hist.length > 60) ui.hist.shift(); }
function tapCell(i) {
  const day = st.dayState, cur = day.g[i];
  if (day.D.fixed[i]) return;
  if (cur && (!ui.sel || ui.sel === cur)) { remember(); day.g[i] = null; delete day.pinned[i]; ui.sel = cur; }
  else if (ui.sel) {
    const left = handLeft(day);
    if (left[ui.sel] > 0) { remember(); day.g[i] = ui.sel; delete day.pinned[i]; if (left[ui.sel] === 1) ui.sel = cur || nextSel(day); }
  }
  save(); render();
}
function undo() { const g = ui.hist.pop(); if (!g) return; st.dayState.g = g; ui.sel = nextSel(st.dayState, ui.sel); save(); render(); }
function castPeek() {
  const day = st.dayState, R = rulesFor(st, day, true), N = nbFor(day.D);
  if (!st.charges.peek) return;
  let bestI = -1, bestV = -1e9;
  for (let i = 0; i < day.g.length; i++) {
    const t = day.bestGrid[i];
    if (!(KINDS[t] || DECOR[t]) || day.g[i] === t) continue;
    const v = KINDS[t] ? cellScore(day.bestGrid, i, day.D, R, N) : 3;
    if (v > bestV) { bestV = v; bestI = i; }
  }
  if (bestI < 0) { toast('Your reef already matches the best layout.'); return; }
  const t = day.bestGrid[bestI];
  remember();
  if (!(handLeft(day)[t] > 0)) {
    // take one from a cell where the best layout doesn't have it
    const j = day.g.findIndex((x, k) => x === t && day.bestGrid[k] !== t);
    if (j >= 0) day.g[j] = null;
  }
  day.g[bestI] = t; day.pinned[bestI] = true;
  st.charges.peek--; ui.sel = nextSel(day, ui.sel); save(); render();
}
function castMeasure() { const day = st.dayState; if (!st.charges.measure || day.measured) return; st.charges.measure--; day.measured = true; save(); render(); }
function castHot() { const day = st.dayState; if (!st.charges.hot || day.hotOn) return; st.charges.hot--; day.hotOn = true; save(); render(); }

/* pouch things that change today's reef or hand */
function clearFixed(kind) {
  const day = st.dayState;
  for (let i = 0; i < day.g.length; i++) if (day.D.fixed[i] === kind) { day.D.fixed[i] = null; day.g[i] = null; }
}
function redraw(c) {
  const day = st.dayState, keep = day.hand.filter(t => DECOR[t]), n = day.hand.length - keep.length;
  const fresh = drawHand(c.r, st.bag, Math.min(n, bagSize(st.bag)));
  while (fresh.length < n) fresh.push(bagPick(c.r));
  day.hand = fresh.concat(keep); day.g = day.D.fixed.slice(); day.pinned = {};
}

/* What a reef scores today and where each part comes from. `live` is the preview while you place tiles. */
function harvestCalc(day, g, live) {

    const p = packPrice(k), isNew = !(st.bag[k] > 0);
    return `<div class="offer pack"><span class="oe">${KINDS[k].e.repeat(3)}</span><span class="on">${PACK} × ${KINDS[k].name}</span><span class="rar rar-${isNew ? 'R' : 'C'}">${isNew ? 'New species' : 'For your bag'}</span>${exampleHtml(k, 30)}<span class="od">${esc(EX[k].say)}</span>
      <button class="btn sm pri" data-pack="${i}" ${st.shells < p ? 'disabled' : ''}>Add to bag · ${p} 🐚</button></div>`;
  }).join('');
  const nightLog = st.nightLog && st.nightLog.length ? `<div class="card small">Overnight: ${esc(st.nightLog.join(', '))}</div>` : '';
  const nextOpen = (() => { for (let x = st.day + 1; x < st.day + 12; x++) if (isMarket(x)) return x; return '?'; })();
  const sheet = ui.sheet === 'bag' ? bagSheet(true) : '';
  return `<div class="page">${hud()}<h1>Evening market</h1>${nightLog}
    <p class="small muted">Pouch things are kept until you use them. Everything else takes one of your ${s.slots} locker slots. The market opens next after day ${nextOpen}.</p>
    <div class="offers">${offers}</div>
    <h3>Species</h3><p class="small muted">Your bag has ${bagSize(st.bag)} tiles, and tomorrow you draw ${dayShape(st.day + 1).hand}. <button class="btn sm" data-sheet="bag">See your bag</button></p>
    <div class="offers">${packs}</div>
    <div class="card"><h3 style="margin-top:0">Pouch <span class="small muted">${st.pouch.length} / ${s.pouch}</span></h3>${pouchHtml(true)}
      <h3>Locker <span class="small muted">tap to sell</span></h3>${itemsHtml(true)}${st.pending ? `<p class="bad small">No room for ${ITEM[st.pending].e} ${esc(ITEM[st.pending].name)}. Sell something to make room, or it’s lost when you leave.</p>` : ''}</div>
  </div>${actions(`<button class="btn" id="reroll" ${st.shells < sh.reroll ? 'disabled' : ''}>Reroll · ${sh.reroll ? sh.reroll + ' 🐚' : 'free'}</button><button class="btn pri big" id="leave">Start day ${st.day + 1}</button>`)}
  ${sheet ? `<div class="sheet-bg" data-bg><div class="sheet" role="dialog" aria-modal="true">${sheet}</div></div>` : ''}`;
}
function rewardView() {
  return `<div class="page">${hud()}<h1>Festival prize</h1>
    <p>Choose one item, or take 10 shells.</p>
    <div class="offers">${st.reward.map(id => { const def = ITEM[id]; return `<div class="offer"><span class="oe">${def.e}</span><span class="on">${esc(def.name)}</span><span class="rar rar-${def.r}">${RARITY[def.r]}</span><span class="od">${esc(def.desc)}</span><button class="btn sm pri" data-take="${id}">Take</button></div>`; }).join('')}
    <div class="offer"><span class="oe">🐚</span><span class="on">10 shells</span><span class="od">Save them for the market.</span><button class="btn sm pri" data-take="">Take</button></div></div>
    <div class="card"><h3 style="margin-top:0">Your locker</h3>${itemsHtml(false)}</div></div>`;
}
function fullView() {
  return `<div class="page">${hud()}<h1>No room</h1>
    <p>Your locker is full, so there’s no room for ${ITEM[st.pending].e} <b>${esc(ITEM[st.pending].name)}</b> (${esc(ITEM[st.pending].desc)}). Sell an item to make room, or let it go.</p>
    <div class="card">${itemsHtml(true)}</div></div>${actions('<button class="btn" id="letgo">Let it go</button>')}`;
}
function overView() {
  const days = st.day - 1, title = titleFor(days);
  return `<div class="page"><h1>Out of air</h1>
    <div class="card" style="text-align:center"><div class="big-num">${days} day${days === 1 ? '' : 's'}</div><p>Title: <b>${title}</b></p>
    <p class="small muted">Festivals won ${st.festsWon} · days at double the target ${st.best2x} · total score ${st.totalScore} · seed ${esc(st.seed)}</p></div>
    ${st.result ? `<div class="card">${[`On day ${st.day} you scored ${st.result.total} against a target of ${st.result.target}, and lost ${st.result.dmg} air.`].concat(st.result.log).map(l => `<div class="log">${esc(l)}</div>`).join('')}</div>` : ''}
  </div>${actions('<button class="btn pri big" id="again">New run</button><button class="btn" id="same">Replay this seed</button>')}`;
}
function titleView() {
  const live = st && st.phase !== 'over';
  return `<div class="page"><div style="text-align:center;padding:24px 0 10px"><div style="font-size:50px">🪸🐠🐙</div><h1 style="font-size:34px">Reef Keeper</h1>
    <p class="muted">A reef puzzle with a run, a market and festivals. Arrange each day’s creatures as well as you can, grow your bag, collect items, and see how many days your air lasts.</p></div>
    <div class="row c">${live ? `<button class="btn pri big" id="cont">Continue day ${st.day}</button>` : ''}<button class="btn ${live ? '' : 'pri '}big" id="new">New run</button><button class="btn big" data-guide>How to play</button></div>
    <div class="row c" style="margin-top:10px"><input type="text" id="seed" placeholder="seed (optional)"><button class="btn sm" id="seeded">Start with seed</button></div>
    <div class="card"><h3 style="margin-top:0">How it works</h3>
      <p>Each day you get a reef and a hand of creatures drawn from your bag. Tap a creature in your hand, then tap a cell to place it. Each species scores in its own way: coral likes coral, kelp likes kelp in the same column, crabs want the edge, pufferfish want to be alone, sharks hunt along rows and columns.</p>
      <p>Every day has a target. Reaching it pays shells, and going past it pays more: double the target pays three times as much as just reaching it. Missing it costs air, and the run ends when your air runs out.</p>
      <p>At the market you buy items, things for your pouch, and new species for your bag. You start with coral, clownfish and two random species, so every run plays a little differently. Every fifth day is a festival with its own rule, a higher target and a prize.</p>
      <p>Day 30 completes the run. After that it keeps getting harder, and the titles go up to day 200.</p></div>
    <div class="card"><h3 style="margin-top:0">Your records</h3><p>Longest run: <b>${rec.best} days</b> · runs started: ${rec.runs}</p>
      <div class="titles">${TITLES.map(([n, name]) => `<span>${rec.titles[name] ? '✓' : '·'}</span><span>${name}</span><span class="muted">day ${n}</span>`).join('')}</div></div>
    <footer>A sister game to Summer Garden. No sign-in, progress is saved in this browser.</footer></div>`;
}
function render() {
  const app = $('#app');
  document.body.dataset.season = st && !ui.title ? season(st.day) : 'summer';
  if (!st || ui.title) app.innerHTML = titleView();
  else app.innerHTML = ({day: dayView, result: resultView, market: marketView, reward: rewardView, full: fullView, over: overView}[st.phase] || dayView)();
  if (st && st.phase === 'day' && st.day === 1 && !ui.title && !rec.seenHelp && !ui.helpClosed && ui.guide == null) ui.guide = 0;
  if (ui.guide != null) app.insertAdjacentHTML('beforeend', `<div class="sheet-bg" style="z-index:45"><div class="sheet" role="dialog" aria-modal="true">${guideHtml(ui.guide)}</div></div>`);
  if (ui.ask) app.insertAdjacentHTML('beforeend', `<div class="sheet-bg" style="z-index:50"><div class="sheet" role="dialog" aria-modal="true"><p>${esc(ui.ask.text)}</p><div class="row c"><button class="btn" id="askno">Cancel</button><button class="btn pri" id="askyes">${esc(ui.ask.yes)}</button></div></div></div>`);
  if (ui.tip) app.insertAdjacentHTML('beforeend', `<div class="tip${st && st.phase === 'day' && !ui.title ? ' top' : ''}">${esc(ui.tip)}</div>`);
  bind();
  fitBoard();
  if (st && st.phase === 'day' && !ui.title && !ui.seenMorning && ui.guide == null) {
    ui.seenMorning = true;
    const morning = (st.nightLog || []).concat(st.dayState.startLog || []);
    if (morning.length) setTimeout(() => toast('Since yesterday: ' + morning.join(' · '), 4500), 0);
  }
}
/* The board fills the free height on big screens, but never gets narrower than the screen on a phone (or 460px):
   if that doesn't fit, the page scrolls and the dock stays pinned to the bottom. */
function fitBoard() {
  const b = $('.board'), wrap = $('.boardwrap'), game = $('.game');
  if (!b || !wrap || !game) return;
  const w = +b.style.getPropertyValue('--w'), h = +b.style.getPropertyValue('--h');
  const padW = 12 + 4 * (w - 1), padH = 12 + 4 * (h - 1);
  // worked out once per day and screen size, so the board doesn't jump when the text around it changes
  const key = [st.day, w, h, window.innerWidth, window.innerHeight].join(':');
  if (ui.fit && ui.fit.key === key) { b.style.width = ui.fit.size + 'px'; b.style.setProperty('--cs', (ui.fit.size - padW) / w + 'px'); return; }
  const W = wrap.clientWidth;
  const side = getComputedStyle($('.play')).flexDirection === 'row', dock = $('.dock');
  const top = wrap.getBoundingClientRect().top + window.scrollY;
  const avail = window.innerHeight - top - (side ? 0 : dock.offsetHeight + 6) - 14;
  const byH = (avail - padH) / h * w + padW;
  const size = Math.min(W, Math.max(byH, Math.min(W * 0.85, 460)));
  ui.fit = {key, size};
  b.style.width = size + 'px';
  b.style.setProperty('--cs', (size - padW) / w + 'px');
}
window.addEventListener('resize', fitBoard);
function bind() {
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  on('#askno', () => { ui.ask = null; render(); });
  on('#askyes', () => { const f = ui.ask.fn; ui.ask = null; render(); f(); });
  on('#cont', () => { ui.title = false; render(); });
  const fresh = fn => { if (!st || st.phase === 'over') fn(); else ask('Start a new run? The current one will be lost.', 'Start a new run', fn); };
  on('#new', () => fresh(() => { ui.title = false; newRun(); render(); }));
  on('#seeded', () => { const s = $('#seed').value.trim(); if (s) fresh(() => { ui.title = false; newRun(s); render(); }); });
  on('#menu', () => { if (st && st.phase === 'day') ui.sheet = 'menu'; else { ui.title = true; ui.sheet = null; } render(); });
  on('#totitle', () => { ui.title = true; ui.sheet = null; render(); });
  on('#again', () => { newRun(); render(); });
  on('#same', () => { newRun(st.seed); render(); });
  on('#finish', () => {
    const left = handLeft(st.dayState), unused = Object.values(left).reduce((a, b) => a + Math.max(0, b), 0);
    if (unused) ask(unused + ' tile' + (unused > 1 ? 's are' : ' is') + ' still in your hand. Finish the day anyway?', 'Finish', finish);
    else finish();
  });
  on('#next', () => { ui.seenMorning = false; nextAfterResult(); });
  on('#reroll', reroll);
  on('#leave', () => { ui.seenMorning = false; if (st.pending) st.pending = null; st.shop = null; ui.sheet = null; st.day++; startDay(); st.nightLog = null; render(); window.scrollTo(0, 0); });
  on('#letgo', () => { st.pending = null; afterReward(); });
  on('#undo', undo);
  on('#clear', () => { const day = st.dayState; remember(); day.g = day.D.fixed.slice(); day.pinned = {}; ui.sel = nextSel(day); ui.sheet = null; save(); render(); });
  $$('[data-c]').forEach(b => b.onclick = () => tapCell(+b.dataset.c));
  $$('[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t; if (!(handLeft(st.dayState)[t] > 0)) return; ui.sel = ui.sel === t ? null : t; render(); });
  $$('[data-spell]').forEach(b => b.onclick = () => ({peek: castPeek, measure: castMeasure, hot: castHot}[b.dataset.spell])());
  $$('[data-buy]').forEach(b => b.onclick = () => buy(+b.dataset.buy));
  $$('[data-pack]').forEach(b => b.onclick = () => buyPack(+b.dataset.pack));
  $$('[data-rel]').forEach(b => b.onclick = () => release(b.dataset.rel));
  $$('[data-take]').forEach(b => b.onclick = () => takeReward(b.dataset.take));
  $$('[data-sheet]').forEach(b => b.onclick = () => { ui.sheet = b.dataset.sheet; render(); });
  $$('[data-close]').forEach(b => b.onclick = () => { ui.sheet = null; ui.helpClosed = true; if (!rec.seenHelp) { rec.seenHelp = true; save(); } render(); });
  $$('[data-bg]').forEach(b => b.onclick = e => { if (e.target === b) { ui.sheet = null; ui.helpClosed = true; render(); } });
  $$('[data-guide]').forEach(b => b.onclick = () => { ui.sheet = null; ui.guide = 0; render(); });
  $$('[data-gnav]').forEach(b => b.onclick = () => {
    const a = b.dataset.gnav;
    if (a === 'next') ui.guide++; else if (a === 'back') ui.guide--;
    else { ui.guide = null; ui.helpClosed = true; rec.seenHelp = true; save(); }
    render();
  });
  $$('[data-use]').forEach(b => b.onclick = () => usePouch(+b.dataset.use));
  $$('[data-ask-use]').forEach(b => b.onclick = () => {
    const k = +b.dataset.askUse, def = ITEM[st.pouch[k]];
    ask(def.e + ' ' + def.name + ': ' + def.desc + ' Use it now?', 'Use', () => usePouch(k));
  });
  if (st && (st.phase === 'market' || st.phase === 'full')) bindSell();
}
ui.title = true;
render();
</script>
</body>
