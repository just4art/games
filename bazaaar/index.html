.gi{font-size:24px;width:32px;text-align:center;flex:none}
.info{flex:1;min-width:0}
.price{font-weight:700;font-variant-numeric:tabular-nums}

p{margin:8px 0}

body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 88%,var(--lapis)))}

<body>
<div class="app">
  <main class="stage">
    <div class="top"><h1>Five Coins Bazaar</h1><div class="goal" id="goalTxt"></div></div>
    <div class="hud" id="hud"></div>
    <div class="next" id="nextTxt"></div><div class="goalbar"><i id="goalBar"></i></div>
    <div class="frame"><div class="map" id="map"></div><svg id="crowd" viewBox="0 0 12 12" aria-hidden="true"></svg><svg id="shopfx" viewBox="0 0 12 12" aria-hidden="true"></svg><div class="mapctl" id="mapctl"><button id="viewBtn" class="viewbtn" onclick="toggleView()"></button><button id="pauseBtn" class="viewbtn pausebtn" onclick="togglePause()"></button></div><div class="pill" id="pill"></div></div>
  </main>
  <aside class="side">

  </aside>
</div>
<div class="toast" id="toast"></div>

function trade(kind,t,g,n){
  let done=0,total=0,msg='';
  for(let i=0;i<n;i++){
    if(kind==='buy'){
      const p=ask(t,g);
      if(S.cash<p){msg='Not enough coins';break}
      if(weight()+G[g].w>S.cap){msg='Your bag is full';break}
      S.cash-=p;addLot(g);bump(t,g,IMPACT);
    }else{
      if(!count(g))break;
      const p=bid(t,g);S.cash+=p;removeOne(g);bump(t,g,1/IMPACT);
    }
    done++;S.trades++;S.mood[t]=Math.min(3,S.mood[t]+T[t].mg*.15);
  }
  if(done){
    toast(`${kind==='buy'?'Bought':'Sold'} ${done} ${G[g].i}${msg?'. '+msg+'.':''}`);
    if(Math.random()<.3)S.visit.line=pick(T[t].thx);
  }else if(msg)toast(msg+'.');
  note(t);save();renderHud();renderMap();renderStall(t);
  checkMs();
}

  if(Math.random()<T[t].haggle+.08*S.mood[t]){S.visit.haggled=true;S.visit.line=pick(T[t].hagOk)}
  else{S.mood[t]=Math.max(-3,S.mood[t]-1);S.visit.line=pick(T[t].hagNo)}
  note(t);save();renderHud();renderMap();renderStall(t);
}

  S.sea.cargo={oil:40};S.sea.basis={oil:0};

  setSheet(`<h2>Chapter three: The Sea</h2><div class="bubble">Anno 1490. Captain Idris hands you the key to a sturdy little cog. You name her the Pomegranate, after the donkey. In the hold you find 40 jars of olive oil. “For luck,” says Idris.</div>
  <p>Venice rules the sea trade. It has held Cyprus since 1489 and Crete for centuries. The Ottomans have ruled Constantinople since 1453, and the Mamluk sultans of Egypt control the pepper that comes from India through the Red Sea.</p>
  <p><b>How it works.</b> Tap a port to see the route and how many days it takes, then tap again to sail. Buy cheap where goods are made, sell where they're wanted, but every crate you sell pushes the price down, so spread big cargoes across ports. Prices you know get older every day you're at sea.</p>
  <p>Back home, your shop and runners keep working. To go ashore in Beirut, use the button in the port screen.</p>
  <button class="sbtn fill wide" onclick="portSheet()">To the market</button>`);
}
function showEnding3(){setSheet(`<h2>End of chapter three</h2>
  <div class="bubble">1498. A breathless messenger from the harbour: Vasco da Gama has reached Calicut, in India. By sea.</div>
  <p>For centuries, pepper reached Europe through Alexandria and Beirut, and Venice grew rich selling it on. Now the Portuguese can sail around Africa and buy it at the source. In a few years, Portuguese pepper will be sold in Lisbon, and the old Mediterranean routes will never be the same.</p>
  <p>You look at your ships, your ledgers, and Destiny chewing a sail rope. The Mediterranean suddenly feels small.</p>
  <p class="small">A century from now, merchants in London (1600) and Amsterdam (1602) will found the great East India companies. You decide not to wait a century. Chapter four: The Company.</p>
  <button class="sbtn fill wide" onclick="closeSheet()">Keep trading</button>`)}
const CODES={DESTINY:2,POMEGRANATE:3};
function useCode(){const el=document.getElementById('codeIn'),v=(el?el.value:'').trim().toUpperCase(),n=CODES[v];
  if(!n){toast('That code doesn\u2019t open anything.');return}
  setSheet(`<h2>Start chapter ${n===2?'two':'three'}?</h2><p>This replaces your current game with a fresh start at the beginning of chapter ${n===2?'two':'three'}.</p><button class="sbtn fill wide" onclick="jumpCh(${n})">Yes, let\u2019s go</button><button class="sbtn wide" onclick="closeSheet()">Keep my game</button>`)}
function jumpCh(n){
  S=newState();setDistrict('bazaar');
  Object.assign(S,{cash:500,donkey:true,cap:50,boys:1,store:true,storeInv:[],contractsDone:1,ms:6,won:true,inv:[]});
  startCh2();
  if(n===3){const sp=S.shop;sp.open=true;sp.lv.shelves=2;sp.lv.runners=2;sp.shelves=[{g:'spice',q:10,acc:0},{g:'cloth',q:10,acc:0},{g:'pottery',q:10,acc:0},{g:'olive',q:10,acc:0}];
    Object.assign(S,{cash:1500,ms2:8,won2:true,visitedHarbour:true,shipBought:true});startCh3();}
  save();
}
function buyShipAsk(){
  if(S.cash<5000){toast(`You need $5,000. You have ${fmt(S.cash)}.`);return}
  const left=S.cash-5000,day=shopRate()*12;
  setSheet(`${sh_head(portrait('idris'),'Captain Idris\u2019s ship','A sturdy little cog')}<div class="bubble">\u201cShe\u2019s old but honest, like me. Five thousand coins, and she\u2019s yours.\u201d</div><p>After buying her you\u2019ll have <b>${fmt(left)}</b> left for cargo. Idris will throw in a first cargo of olive oil.</p><p>Your shop keeps selling while you\u2019re at sea: ${day>0?`right now about <b>${fmt(day)}</b> a day`:'but right now its shelves are empty, so it earns nothing until they\u2019re stocked'}${S.shop.lv.runners?`, and your ${S.shop.lv.runners} runner${S.shop.lv.runners>1?'s':''} keep it supplied`:'. With no runners, nobody restocks it while you\u2019re away'}.</p><p class="small">There\u2019s no rush. Upgrading the shop first makes the sea easier.</p><button class="sbtn fill wide" onclick="buyShip()">Buy the ship for $5,000</button><button class="sbtn wide" onclick="closeSheet()">Not yet</button>`)}
function buyShip(){if(S.cash<5000)return;S.cash-=5000;S.shipBought=true;save();closeSheet();renderHud();checkMs()}
function confirmNew(){setSheet(`<h2>Start over?</h2><p>Your coins, goods and notebook will be gone.</p><button class="sbtn fill wide" onclick="newGame()">Start a new game</button><button class="sbtn wide" onclick="closeSheet()">Keep playing</button>`)}
function newGame(){S=newState();setDistrict('bazaar');save();render();intro()}

/* ---------- cloud save (per-person, private) ---------- */
let cloud=null,cloudT=null;
function pushCloud(){if(!cloud||!S)return;clearTimeout(cloudT);cloudT=setTimeout(()=>{try{cloud.set({json:JSON.stringify(S),at:S.savedAt||Date.now()}).catch(()=>{})}catch(e){}},3000)}
function trimShelves(){const sp=S.shop;if(!sp||!sp.shelves||sp.shelves.length<=6)return;
  const extra=sp.shelves.splice(6);S.storeInv=S.storeInv||[];let back=0;
  extra.forEach(x=>{if(x.g&&x.q)S.storeInv.push({g:x.g,q:x.q,d:S.day})});
  for(let l=4;l<sp.lv.shelves;l++)back+=Math.round(60*Math.pow(1.6,l));
  sp.lv.shelves=Math.min(sp.lv.shelves,4);S.cash+=back;
  setTimeout(()=>toast(`The shop now has room for 6 shelves. Extra goods went to your storeroom${back?`, and you got ${fmt(back)} back`:''}.`),1500)}
function afterLoad(){
  GK.forEach(g=>{if(S.gw[g]==null)S.gw[g]=1});
  TK.forEach(t=>{S.p[t]=S.p[t]||{};if(S.mood[t]==null)S.mood[t]=0;[...Object.keys(T[t].sells),...Object.keys(T[t].buys)].forEach(g=>{if(S.p[t][g]==null)S.p[t][g]=1})});
  S.dist=S.dist||'bazaar';setDistrict(S.dist);trimShelves();fixSea();preview=null;walking=false;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  closeSheet();render();checkMs(true);
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/save');
    const snap=await ref.get();
    cloud=ref;
    const d=snap.exists?snap.data():null;
    if(d&&typeof d.json==='string'&&(d.at||0)>((S&&S.savedAt)||0)){
      try{S=JSON.parse(d.json);afterLoad();toast('Progress restored from your account ☁️')}catch(e){}
    }else pushCloud();
  }catch(e){}
}
S=load();
for(const [n,v] of [['showNews','news'],['showNotebook','notebook'],['showBag','bag']]){const f=window[n];window[n]=function(){f();setNav(v)}}
{const f=window.renderStall;window.renderStall=function(t){f(t);setNav('here')}}
{const f=window.showPlace;window.showPlace=function(t){f(t);if(S.at===t)setNav('here')}}
if(!S){S=newState();setDistrict('bazaar');save();render();intro();initCloud()}else{GK.forEach(g=>{if(S.gw[g]==null)S.gw[g]=1});TK.forEach(t=>{S.p[t]=S.p[t]||{};if(S.mood[t]==null)S.mood[t]=0;[...Object.keys(T[t].sells),...Object.keys(T[t].buys)].forEach(g=>{if(S.p[t][g]==null)S.p[t][g]=1})});
  S.dist=S.dist||'bazaar';setDistrict(S.dist);trimShelves();fixSea();let redo=false;
  if(S.ch===2&&!(S.shop&&S.shop.v===3)){S.cash=500;S.inv=[];S.storeInv=[];S.dist='bazaar';setDistrict('bazaar');S.at=null;S.t=0;S.px=START[0];S.py=START[1];S.visitedHarbour=false;S.shop=newShop();S.ms2=0;S.won2=false;S.contract=null;S.offer=null;redo=true;save()}
  closeSheet();if(S.px==null){S.px=START[0];S.py=START[1];S.at=null}render();checkMs(true);initCloud();if(redo)setSheet(`<h2>Back to the start of chapter two</h2><div class="bubble">Fresh morning, $500 in your purse, Destiny at your side.</div><p>The boarded-up stall in the middle of the bazaar is for rent: $400. Open it, fill its shelves with goods you buy around the bazaar, and it sells them for you all day. Later, runners restock it and the Harbour Quarter opens.</p><button class="sbtn fill wide" onclick="closeSheet()">Let's go</button>`)}
</script>
