<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ore to Orbit</title>
<style>
:root{
  --bg:#e9ebe4; --surface:#fbfbf8; --surface2:#f0f2ec; --text:#22261f; --muted:#646b5e; --line:#d5d9cd;
  --accent:#c9741a; --accent2:#fbe7cf; --good:#2e7d4a; --bad:#c0392b; --warn:#b07800;
  --shadow:0 6px 24px rgba(20,24,16,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141714; --surface:#1e221e; --surface2:#272c27; --text:#ebe8df; --muted:#a3a99b; --line:#363c35;
    --accent:#f0a040; --accent2:#3d2e1a; --good:#6cc58a; --bad:#ef7a6c; --warn:#e8b84a;
    --shadow:0 6px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141714; --surface:#1e221e; --surface2:#272c27; --text:#ebe8df; --muted:#a3a99b; --line:#363c35;
  --accent:#f0a040; --accent2:#3d2e1a; --good:#6cc58a; --bad:#ef7a6c; --warn:#e8b84a;
  --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{-webkit-user-drag:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#2f3628}
.card{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#top{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;align-items:flex-start;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
#goal{flex:1;min-width:0;text-align:left;padding:6px 10px}
#gt{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
#gchips{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.gc{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.gc img{width:22px;height:22px}
.gc.ok{color:var(--good)}
.side{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#pow{padding:5px 9px;font-size:13px;font-variant-numeric:tabular-nums;text-align:left;min-width:128px}
#pow .bar{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
#pow .bar i{display:block;height:100%;width:0;background:var(--good)}
#pow.low .bar i{background:var(--bad)}
#pow.low{color:var(--bad)}
.side .row{display:flex;gap:6px}
.side .row .card{flex:1;padding:5px 0;font-size:14px;font-weight:600;text-align:center}
#hint{position:fixed;left:8px;right:8px;top:80px;z-index:4;padding:7px 34px 7px 11px;font-size:13.5px;max-width:560px}
#hint[hidden]{display:none}
#hint{cursor:pointer}
#hint.min #hintt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint .x{position:absolute;right:4px;top:3px;border:0;background:none;font-size:18px;color:var(--muted);width:28px;height:28px}
#zoom{position:fixed;right:8px;top:46%;display:flex;flex-direction:column;gap:6px;z-index:4}
#zoom button{width:40px;height:40px;font-size:20px;padding:0}
#strip{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:5;display:flex;gap:8px;align-items:center;padding:7px 8px 7px 11px;max-width:620px;margin:0 auto}
#strip[hidden]{display:none}
#strip .sinfo{flex:1;min-width:0;font-size:13px}
#strip .tip{color:var(--muted);font-size:12.5px}
.cost{display:inline-flex;gap:8px;flex-wrap:wrap;vertical-align:middle;margin-left:4px}
.cost span{display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums;font-weight:600}
.cost img{width:18px;height:18px}
.cost .no{color:var(--bad)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:5px;overflow-x:auto;padding:7px 8px calc(env(safe-area-inset-bottom,0px) + 7px);background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;width:64px;height:62px;border:1px solid transparent;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;padding:2px;color:var(--muted)}
.tool img{width:32px;height:32px}
.tool.on{background:var(--accent2);border-color:var(--accent);color:var(--text);font-weight:600}
.tool.sep{margin-right:6px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:8px 13px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-height:72vh;max-height:72dvh;overflow:auto;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-width:640px;margin:0 auto;-webkit-user-select:text;user-select:text}
#sheet.tall{max-height:92vh;max-height:92dvh}
#sheet[hidden]{display:none}
@media (min-width:900px){
  #sheet{left:auto;right:12px;top:12px;bottom:auto;width:400px;border-radius:16px;border:1px solid var(--line);max-height:calc(100vh - 110px)}
  #sheet.tall{width:560px;max-height:calc(100vh - 110px)}
  #top{right:424px}
  body.nosheet #top{right:8px}
  #zoom{right:auto;left:8px}
}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-h img{width:40px;height:40px}
.sh-h .t{flex:1;min-width:0}
.sh-h b{font-size:17px}
.x{border:0;background:var(--surface2);border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;color:var(--muted);flex:0 0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.mt{margin-top:12px}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.rec{display:flex;align-items:center;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 7px;font-size:13px}
.rec img{width:26px;height:26px}
.rec small{display:flex;gap:2px;align-items:center;color:var(--muted);font-size:11.5px}
.rec small img{width:15px;height:15px}
.rec.on{border-color:var(--accent);background:var(--accent2);font-weight:600}
.flt{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px}
.flt button{border:1px solid var(--line);background:var(--surface2);border-radius:9px;height:44px;padding:0;font-size:12px}
.flt button img{width:28px;height:28px;vertical-align:middle}
.flt button.on{border-color:var(--accent);background:var(--accent2)}
.inv{display:flex;flex-wrap:wrap;gap:6px 14px;font-variant-numeric:tabular-nums}
.inv span{display:inline-flex;align-items:center;gap:4px}
.inv img{width:24px;height:24px}
.ii{width:18px;height:18px;vertical-align:-4px}
.stat{font-weight:600}
.stat.work{color:var(--good)} .stat.bad{color:var(--bad)} .stat.warn{color:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:11px;padding:3px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:7px 0;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.need{display:flex;align-items:center;gap:8px;margin:6px 0}
.need img{width:30px;height:30px}
.need .nb{flex:1}
.pbar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;background:var(--accent)}
.pbar.ok i{background:var(--good)}
.unl{display:flex;flex-wrap:wrap;gap:6px}
.unl span{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:8px;padding:3px 8px 3px 4px;font-size:13px}
.unl img{width:24px;height:24px}
.rs{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.rs .t{flex:1;min-width:0}
.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.stock div{display:flex;align-items:center;gap:7px;background:var(--surface2);border-radius:10px;padding:5px 8px;font-variant-numeric:tabular-nums}
.stock img{width:28px;height:28px}
.stock small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.help h3{font-size:16px;margin:18px 0 4px}
.help p{margin:4px 0 8px}
.help canvas{width:100%;display:block;border-radius:12px;background:#2f3628}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend img{width:26px;height:26px;border-radius:5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 120px);z-index:30;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:14px;max-width:min(92vw,460px);text-align:center;box-shadow:var(--shadow);pointer-events:none;transition:opacity .25s}
#toast[hidden]{display:block;opacity:0}
#catch{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff;font-size:16px}
#catch[hidden]{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:40}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:440px;box-shadow:var(--shadow)}
.dlg p{margin:0 0 14px}
</style>
</head>
<body class="nosheet">
<canvas id="cv"></canvas>
<div id="top">
  <button id="goal" class="card" aria-label="Goals and hub"><div id="gt"></div><div id="gchips"></div></button>
  <div class="side">
    <button id="pow" class="card"><span id="pwt"></span><span class="bar"><i id="pwb"></i></span></button>
    <div class="row"><button id="spd" class="card" aria-label="Game speed">×1</button><button id="menu" class="card" aria-label="Menu">☰</button></div>
  </div>
</div>
<div id="hint" class="card" hidden><span id="hintt"></span><button class="x" id="hintx" aria-label="Hide hints">×</button></div>
<div id="zoom"><button class="card" id="zin" aria-label="Zoom in">+</button><button class="card" id="zout" aria-label="Zoom out">−</button><button class="card" id="zhome" aria-label="Back to the hub">⌂</button></div>
<div id="strip" class="card" hidden></div>
<div id="bar"></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<div id="catch" hidden></div>
<div id="ask" hidden></div>
<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(Math.floor(n));
const num = n => n >= 10 ? String(Math.round(n)) : n >= 1 ? n.toFixed(1).replace(/\.0$/, '') : n.toFixed(2).replace(/0$/, '');
function fmtT(s) { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} h ${m} min` : m ? `${m} min` : `${s} s`; }

/* ================= data ================= */
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];   // E S W N
const SP = 0.5;          // spacing of items on a belt, in tiles
const BELT = 1.25;       // belt speed, tiles per second
const INS = 1.2;         // inserter swings per second
const TICK = 1 / 30;
const WATER = 5, ORE = {1: 'iron-ore', 2: 'copper-ore', 3: 'coal', 4: 'stone'};
const ORE_N = {1: 'iron ore', 2: 'copper ore', 3: 'coal', 4: 'stone', 5: 'water'};
const SMELT = {'iron-ore': 'iron', 'copper-ore': 'copper', stone: 'brick', iron: 'steel'};
const POW = {miner: 90, asm: 75, efurnace: 150, ins: 15};
const GEN = 600, HUBPOW = 400, COAL_KJ = 3600, COAL_HEAT = 8;

const IT = {
  'iron-ore': 'Iron ore', 'copper-ore': 'Copper ore', coal: 'Coal', stone: 'Stone',
  iron: 'Iron plate', copper: 'Copper plate', brick: 'Stone brick', steel: 'Steel',
  gear: 'Gear', pipe: 'Pipe', wire: 'Copper wire', circuit: 'Circuit',
  red: 'Red science', green: 'Green science', engine: 'Engine', adv: 'Advanced circuit', blue: 'Blue science',
  frame: 'Rocket frame', part: 'Rocket part'
};
const IORDER = Object.keys(IT);

// m: f = furnace, a = assembler; n = how many one craft makes; t = seconds at speed 1
const RC = {
  iron: {m: 'f', in: {'iron-ore': 1}, out: 'iron', n: 1, t: 1.6},
  copper: {m: 'f', in: {'copper-ore': 1}, out: 'copper', n: 1, t: 1.6},
  brick: {m: 'f', in: {stone: 2}, out: 'brick', n: 1, t: 3.2},
  steel: {m: 'f', in: {iron: 5}, out: 'steel', n: 1, t: 8},
  gear: {m: 'a', in: {iron: 2}, out: 'gear', n: 1, t: 1},
  pipe: {m: 'a', in: {iron: 1}, out: 'pipe', n: 1, t: 0.5},
  wire: {m: 'a', in: {copper: 1}, out: 'wire', n: 2, t: 0.5},
  circuit: {m: 'a', in: {iron: 1, wire: 3}, out: 'circuit', n: 1, t: 1},
  red: {m: 'a', in: {copper: 1, gear: 1}, out: 'red', n: 1, t: 5},
  green: {m: 'a', in: {circuit: 1, gear: 1, iron: 1}, out: 'green', n: 1, t: 6},
  engine: {m: 'a', in: {steel: 1, gear: 1, pipe: 2}, out: 'engine', n: 1, t: 10},
  adv: {m: 'a', in: {circuit: 2, wire: 4, steel: 1}, out: 'adv', n: 1, t: 6},
  blue: {m: 'a', in: {adv: 1, engine: 1}, out: 'blue', n: 2, t: 12},
  frame: {m: 'a', in: {steel: 2, brick: 4, copper: 4}, out: 'frame', n: 1, t: 10},
  part: {m: 'a', in: {frame: 1, adv: 1, engine: 1}, out: 'part', n: 1, t: 15}
};

const BD = {
  belt: {n: 'Belt', cost: {iron: 1}, tip: 'Tap to place, drag to draw a line. Tap a belt again to turn it.'},
  miner: {n: 'Miner', cost: {iron: 8, gear: 3}, tip: 'Place it on ore. The ore comes out on the arrow side.'},
  furnace: {n: 'Furnace', cost: {stone: 5}, tip: 'Smelts ore into plates and burns coal. Plates come out on the arrow side.'},
  ins: {n: 'Inserter', cost: {iron: 3, gear: 2}, tip: 'Takes items from the tile behind it and puts them on the tile ahead.'},
  asm: {n: 'Assembler', cost: {iron: 9, gear: 5}, tip: 'Makes the recipe you choose. New ones use the last recipe you picked.'},
  splitter: {n: 'Splitter', cost: {iron: 5, gear: 3}, tip: 'Takes items from behind and hands them out left, ahead and right in turn.'},
  tunnel: {n: 'Tunnel', cost: {iron: 6, gear: 2}, tip: ''},
  sorter: {n: 'Sorter', cost: {iron: 4, circuit: 2}, tip: 'Sends the item you choose to one side and lets everything else through.'},
  gen: {n: 'Generator', cost: {iron: 12, gear: 6}, tip: 'Burns coal and gives 600 kW of power.'},
  efurnace: {n: 'Electric furnace', cost: {steel: 6, adv: 2, brick: 8}, tip: 'Smelts twice as fast, using power instead of coal.'},
  hub: {n: 'Hub', cost: {}}
};
const TOOLS = ['belt', 'miner', 'furnace', 'ins', 'asm', 'splitter', 'tunnel', 'sorter', 'gen', 'efurnace'];
const TN = {hand: 'Look', remove: 'Remove', belt: 'Belt', miner: 'Miner', furnace: 'Furnace', ins: 'Inserter', asm: 'Assembler', splitter: 'Splitter', tunnel: 'Tunnel', sorter: 'Sorter', gen: 'Generator', efurnace: 'E-furnace'};

// goals: deliver `need` to the hub; finishing one unlocks buildings `b` and recipes `r`
const MS = [
  {need: {iron: 30}, b: ['asm', 'ins', 'gen'], r: ['gear', 'pipe']},
  {need: {gear: 40, copper: 40}, b: ['splitter', 'tunnel'], r: ['wire', 'circuit'],
    hint: 'Assemblers make parts and use power. Set one to Gear and feed it iron plates, straight from a furnace or with an inserter from a belt. Copper plates come from copper ore, the orange stones.'},
  {need: {circuit: 50}, b: ['sorter'], r: ['red', 'brick'],
    hint: 'A circuit needs one iron plate and three copper wires. Wire comes from copper plates. An assembler can put its wire straight into a circuit assembler next to it, while iron plates come in from another side.'},
  {need: {red: 40, brick: 40}, r: ['steel', 'green'],
    hint: 'Red science needs a copper plate and a gear. A furnace turns two stone into a brick. Science you deliver can be spent on research: tap the goal card and open Research.'},
  {need: {steel: 40, green: 40}, b: ['efurnace'], r: ['engine', 'adv', 'blue'],
    hint: 'A furnace turns five iron plates into one steel. Green science needs a circuit, a gear and an iron plate; a machine can take its inputs from three sides.'},
  {need: {engine: 30, adv: 30, blue: 30}, r: ['frame', 'part'],
    hint: 'An engine needs steel, a gear and two pipes. An advanced circuit needs two circuits, four wires and steel. Blue science needs an advanced circuit and an engine.'},
  {need: {part: 100}, fin: true,
    hint: 'A rocket part needs a rocket frame, an advanced circuit and an engine. A frame needs steel, bricks and copper plates. Deliver 100 parts to launch the rocket.'}
];

const RS = {
  mine: {n: 'Mining', d: 'Miners work 25% faster per level.'},
  smelt: {n: 'Smelting', d: 'Furnaces work 25% faster per level.'},
  craft: {n: 'Assembling', d: 'Assemblers work 25% faster per level.'},
  belt: {n: 'Logistics', d: 'Belts, tunnels and inserters move 20% faster per level.'},
  power: {n: 'Power', d: 'Generators and the hub give 25% more power per level.'}
};
function rcost(L) {
  const n = Math.round(10 * Math.pow(1.6, L)), c = {red: n};
  if (L >= 2) c.green = Math.round(n * 0.7);
  if (L >= 4) c.blue = Math.round(n * 0.5);
  return c;
}

/* ================= the world and its simulation ================= */
function makeWorld(w, h) {
  return {W: w, H: h, ore: new Uint8Array(w * h), grid: new Array(w * h).fill(null), ents: [], nid: 1, dirty: true,
    pr: 1, dem: 0, demS: 0, cap: HUBPOW, hubPow: HUBPOW, mod: {mine: 1, smelt: 1, craft: 1, belt: 1, power: 1},
    unl: null, deliver: null, take: null, t: 0, order: [], others: [], gens: []};
}
function at(w, x, y) { return x < 0 || y < 0 || x >= w.W || y >= w.H ? null : w.grid[y * w.W + x]; }
function setCells(w, e, v) { const s = e.t === 'hub' ? 3 : 1; for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) w.grid[(e.y + j) * w.W + e.x + i] = v; }
function addEnt(w, e) { if (!e.id) e.id = w.nid++; else w.nid = Math.max(w.nid, e.id + 1); w.ents.push(e); setCells(w, e, e); w.dirty = true; return e; }
function delEnt(w, e) { setCells(w, e, null); const k = w.ents.indexOf(e); if (k >= 0) w.ents.splice(k, 1); w.dirty = true; }
function mk(t, x, y, d) {
  const e = {t, x, y, d: d || 0};
  if (t === 'belt') e.it = [];
  else if (t === 'miner') { e.prog = 0; e.on = 0; }
  else if (t === 'furnace' || t === 'efurnace') Object.assign(e, {ii: null, inN: 0, fuel: 0, heat: 0, busy: 0, prog: 0, cr: null, oi: null, on: 0});
  else if (t === 'asm') Object.assign(e, {r: null, inv: {}, busy: 0, prog: 0, on: 0});
  else if (t === 'ins') Object.assign(e, {hold: null, prog: 0, f: null});

const afford = c => Object.keys(c).every(k => (G.stock[k] || 0) >= c[k]);

function contents(e) {

const cv = $('#cv'), ctx = cv.getContext('2d');

const minZ = () => Math.max(10, Math.sqrt(VW * VH / 3000));

let acc = 0, last = performance.now(), catching = false;

      let n = 0;
      while (acc >= TICK && n < 16) { tick(world, TICK); G.t += TICK; rateSec(); acc -= TICK; n++; }
      if (n >= 16) acc = 0;

let catchSt = null;
function catchUp(sec, report) {

  const run = () => {
    const n = Math.min(steps, 500);

    steps -= n;
    if (total > 2000) { box.hidden = false; box.textContent = `Running the factory while you were away… ${Math.round(100 - steps / total * 100)}%`; }
    if (steps > 0) { setTimeout(run, 0); return; }
    box.hidden = true; catching = false; last = performance.now(); acc = 0;
    checkGoal();

/* ================= input ================= */
const P = new Map();
let gest = null;
function step(tx, ty) {
  // walk one tile at a time towards (tx, ty) so drawn belt lines have no gaps
  while (gest.lx !== tx || gest.ly !== ty) {
    const dx = tx - gest.lx, dy = ty - gest.ly;
    let d;
    if (Math.abs(dx) >= Math.abs(dy)) d = dx > 0 ? 0 : 2; else d = dy > 0 ? 1 : 3;
    const nx = gest.lx + DX[d], ny = gest.ly + DY[d];
    if (ui.tool === 'belt') {
      const pb = gest.prev;
      if (pb && pb.t === 'belt') { pb.d = d; world.dirty = true; }
      const e = at(world, nx, ny);
      if (e && e.t === 'belt') { e.d = d; world.dirty = true; gest.prev = e; }
      else if (!e) { gest.prev = build('belt', nx, ny, d, true); if (!gest.prev && !gest.warned) { gest.warned = 1; toast(canPlace('belt', nx, ny) || missing(BD.belt.cost)); } }
      else gest.prev = null;
      ui.rot = d;
    } else if (ui.tool === 'remove') {
      const e = at(world, nx, ny);
      if (e) removeEnt(e);
    }
    gest.lx = nx; gest.ly = ny;
  }
}
function startDraw() {
  const [x, y] = toTile(gest.sx, gest.sy);
  gest.m = 'draw'; gest.lx = x; gest.ly = y; gest.prev = null;
  if (ui.tool === 'belt') {
    const e = at(world, x, y);
    gest.prev = e && e.t === 'belt' ? e : !e ? build('belt', x, y, ui.rot, true) : null;
  } else { const e = at(world, x, y); if (e) removeEnt(e); }
}
cv.addEventListener('pointerdown', ev => {
  if (catching) return;
  cv.setPointerCapture(ev.pointerId);
  P.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  if (P.size === 1) gest = {m: 'wait', sx: ev.clientX, sy: ev.clientY, px: ev.clientX, py: ev.clientY, btn: ev.button, mouse: ev.pointerType === 'mouse'};
  else if (P.size === 2) {
    const [a, b] = [...P.values()];
    gest = {m: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: G.cam.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2};
  }
});
cv.addEventListener('pointermove', ev => {
  if (ev.pointerType === 'mouse') ui.hover = toTile(ev.clientX, ev.clientY);
  if (!P.has(ev.pointerId) || !gest) return;
  P.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  if (gest.m === 'pinch') {
    if (P.size < 2) return;
    const [a, b] = [...P.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const c = G.cam;
    c.x -= (mx - gest.mx) / c.z; c.y -= (my - gest.my) / c.z;
    zoomAt(mx, my, gest.z0 * Math.hypot(a.x - b.x, a.y - b.y) / gest.d0 / c.z);
    gest.mx = mx; gest.my = my;
    return;
  }
  if (gest.m === 'wait' && Math.hypot(ev.clientX - gest.sx, ev.clientY - gest.sy) > 8) {
    const drawTool = ui.tool === 'belt' || ui.tool === 'remove';
    if (drawTool && gest.btn === 0) startDraw(); else gest.m = 'pan';
  }
  if (gest.m === 'pan') {
    G.cam.x -= (ev.clientX - gest.px) / G.cam.z; G.cam.y -= (ev.clientY - gest.py) / G.cam.z; clampCam();

function endPointer(ev) {

    if (!(G.got.iron > 0)) return 'Draw a belt from the furnace’s arrow to the hub, the big building in the middle: choose Belt and drag your finger along the way.';

  <h3>Splitters</h3>${D('split')}
  <p>A splitter takes items from behind and hands them out in turn to the left, ahead and to the right. It can feed buildings on its sides directly, so a line of splitters can supply a whole column of furnaces.</p>
  <h3>Sorters</h3>${D('sort')}
  <p>A sorter lets everything through ahead, except the item you choose, which turns off to one side. Here it takes the coal off a mixed belt and onto a line of its own.</p>
  <h3>Tunnels</h3>${D('tunnel')}
  <p>A tunnel carries a belt underground for up to four tiles, so two lines can cross. Place the entrance first and then the exit ahead of it, facing the same way.</p>
  <h3>Research and controls</h3>
  <p>Once you make red science, the hub’s Research tab spends science packs on faster miners, furnaces, assemblers and belts, and on more power. Later levels also need green and blue science.</p>
  <p>Drag the map to move it and pinch to zoom. Tap a building with Look to see what it is doing, change its recipe, turn it or remove it. With a building tool, tapping one of the same kind turns it. A red badge on a building means it has no coal or not enough power; a yellow one means its output is blocked.</p>
  <div class="row end"><button class="btn pri" data-act="close">Start building</button></div></div>`;
}
function startDemos() {
  stopDemos();
  const list = [...document.querySelectorAll('canvas[data-demo]')].map(c => ({c, w: demoWorld(DEMOS[c.dataset.demo])}));
  let t0 = performance.now(), acc2 = 0;
  const loop = now => {
    if (!demoRun) return;
    acc2 += Math.min(0.1, (now - t0) / 1000); t0 = now;
    while (acc2 >= TICK) { for (const d of list) tick(d.w, TICK); acc2 -= TICK; }
    for (const d of list) {
      const r = d.c.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight || !r.width) continue;
      const px = Math.round(r.width * dpr), py = Math.round(r.height * dpr);
      if (d.c.width !== px || d.c.height !== py) { d.c.width = px; d.c.height = py; }
      const g = d.c.getContext('2d'), z = r.width / d.w.W;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawWorld(g, d.w, d.w.W / 2, d.w.H / 2, z, r.width, r.height, acc2);
    }
    demoRun = requestAnimationFrame(loop);
  };
  demoRun = requestAnimationFrame(loop);
}
function stopDemos() { if (demoRun) cancelAnimationFrame(demoRun); demoRun = null; }

function renderSheet() {
  const el = $('#sheet'), s = ui.sheet;
  document.body.classList.toggle('nosheet', !s);
  stopDemos();
  if (!s) { el.hidden = true; el.innerHTML = ''; hud(); return; }
  let h = '';
  if (s.k === 'ent') { const e = world.ents.find(x => x.id === s.id); if (!e) { closeSheet(); return; } h = entSheet(e); }
  else if (s.k === 'hub') h = hubSheet();
  else if (s.k === 'menu') h = menuSheet();
  else if (s.k === 'help') h = helpSheet();
  else if (s.k === 'ms') h = msSheet(s);
  else if (s.k === 'win') h = winSheet(s);
  else if (s.k === 'away') h = awaySheet(s);
  el.innerHTML = h; el.hidden = false;
  el.classList.toggle('tall', s.k === 'help');
  if (s.k === 'help') { el.scrollTop = 0; startDemos(); }
  hud();
}
function liveSheet() {
  const s = ui.sheet, l = $('#live');
  if (!s) return;
  if (s.k === 'ent' && l) { const e = world.ents.find(x => x.id === s.id); if (e) l.innerHTML = entLive(e); }
  if (s.k === 'hub') {
    if (l) l.innerHTML = ui.tab === 'goal' ? goalLive() : stockLive();
    document.querySelectorAll('[data-buy]').forEach(b => { const c = rcost(G.rs[b.dataset.buy]); b.disabled = !afford(c) || Object.keys(c).some(x => !unlocked(world, x)); });
  }
}
$('#sheet').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, k = b.dataset.k, s = ui.sheet;
  const e = s && s.k === 'ent' ? world.ents.find(x => x.id === s.id) : null;
  if (a === 'close') { closeSheet(); if (!rec.seenHelp) { rec.seenHelp = 1; save(); } }
  else if (a === 'tab') { ui.tab = k; renderSheet(); }
  else if (a === 'buy') buyResearch(k);
  else if (a === 'help') openSheet({k: 'help'});
  else if (a === 'hints') { G.hints = G.hints ? 0 : 1; renderSheet(); }
  else if (a === 'new') ask('Start again on a new map? This factory and its progress will be lost.', 'New map', () => { newGame(); ui.tool = 'hand'; renderBar(); closeSheet(); });
  else if (e && a === 'rec') {
    if (e.r === k) return;
    const c = contents(e);
    for (const x in c) G.stock[x] = (G.stock[x] || 0) + c[x];
    Object.assign(e, {r: k, inv: {}, busy: 0, prog: 0, on: 0});
    G.lastRec = k; save(); renderSheet();
  }
  else if (e && a === 'flt') { e.f = k || null; save(); renderSheet(); }
  else if (e && a === 'side') { e.side = +k; world.dirty = true; save(); renderSheet(); }
  else if (e && a === 'erot') rotateEnt(e);
  else if (e && a === 'erem') { removeEnt(e); save(); }
});

/* ================= start ================= */
resize();
const saved = loadGame();
if (saved) {
  startFrom(saved);
  const away = (Date.now() - (saved.saved || Date.now())) / 1000;
  if (away > 5) catchUp(away, away > 60);
} else {
  newGame();
  ui.sheet = {k: 'help'};
}
renderBar();
renderSheet();
setInterval(() => { if (!catching) { hud(); liveSheet(); } }, 400);
setInterval(() => { if (!catching) save(); }, 10000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);
requestAnimationFrame(t => { last = t; frame(t); });
</script>
