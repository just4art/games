<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shark Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14365a;--ink2:#4a6680;--teal:#0d8496;--teal-d:#0a6574;--teal-l:#dcf3f6;--coral:#ef6a4a;--coral-d:#c9502f;
  --sun:#ffcf5a;--sun-d:#d9a62c;--sand:#f6e4b8;--sand-d:#e2c47f;--card:#fff;--line:#cfe5eb;--good:#1f8f55;--good-l:#dcf5e6;
  --bad:#c4553a;--bad-l:#fde6df;--bg1:#e8f8fb;--bg2:#bfe6ef;--shadow:0 6px 20px rgba(20,54,90,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:'Fredoka',system-ui,-apple-system,sans-serif;font-size:20px;line-height:1.35;color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2));overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:4px solid #ffb703;outline-offset:3px}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:600;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal-d);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-d)}
.btn.big{font-size:22px;padding:12px 24px}
.btn.sq{width:52px;height:52px;padding:0;font-size:28px}
.btn:disabled{opacity:.45;cursor:default}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* top bar */
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 20px;background:rgba(255,255,255,.8);border-bottom:2px solid var(--line);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:6px;background:none;border:0;font-size:26px;font-weight:700;color:var(--teal-d);padding:2px 8px;border-radius:12px}
.logo svg{width:64px;height:42px}
.spacer{flex:1}
.teeth{font-weight:700;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-size:21px;min-width:90px;text-align:center}
.teeth.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.25)}}
.navb{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:600;color:var(--teal-d)}
.navb[aria-current="page"]{background:var(--teal);color:#fff;border-color:var(--teal)}
#app{height:calc(100vh - 64px);position:relative}

/* map */
.mapscreen{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:18px 22px;height:100%}
.side{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.side .shark-box{display:flex;justify-content:center}
.side .shark-box svg{width:210px;height:136px}
.stat{display:flex;justify-content:space-between;background:var(--teal-l);border-radius:14px;padding:8px 14px;font-weight:500}
.parentlink{margin-top:auto;background:none;border:0;color:var(--ink2);font-size:15px;text-decoration:underline;align-self:flex-start;padding:4px}
.ocean{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 30%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.2),transparent 35%),linear-gradient(160deg,#7fd6e8,#3aa3c4 70%,#2d8fb3)}
.ocean svg.route{position:absolute;inset:0;width:100%;height:100%}
.island{position:absolute;transform:translate(-50%,-50%);width:210px;background:none;border:0;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:20px;transition:transform .15s}
.island:hover:not(.locked){transform:translate(-50%,-50%) scale(1.05)}
.isl-blob{width:132px;height:86px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 35%,#fff6d8,#f2d892 58%,#dfb966);box-shadow:0 0 0 9px rgba(255,255,255,.35),0 8px 0 rgba(0,0,0,.08)}
.isl-emo{font-size:46px;line-height:1}
.isl-name{background:#fff;border-radius:12px;padding:3px 12px;font-weight:600;font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.isl-prog{width:120px;height:10px;border-radius:6px;background:rgba(255,255,255,.6);overflow:hidden}
.isl-prog i{display:block;height:100%;background:var(--sun)}
.isl-count{font-size:15px;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.island.locked .isl-blob{filter:grayscale(.85) brightness(.9)}
.island.locked .isl-emo{opacity:.35}
.island.locked{cursor:default}
.lockbadge{position:absolute;font-size:30px}
.island .star{position:absolute;top:-8px;right:-4px;font-size:30px}
.island.next .isl-blob{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 14px rgba(255,236,150,.7),0 8px 0 rgba(0,0,0,.08)}}

/* play screen */
.play{display:grid;grid-template-columns:290px 1fr;gap:18px;padding:16px 20px;height:100%}
@media (max-width:1150px){.bhead .note{display:none}.bhead .wname{font-size:19px}.task{font-size:20px}.dot{width:28px;height:28px;font-size:14px}.play,.mapscreen{grid-template-columns:250px 1fr}.side .shark-box svg,.guide .shark-box svg{width:180px;height:117px}}
.guide{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.shark-box{display:flex;justify-content:center;height:136px;flex:none}
.shark-box svg{width:210px;height:136px;animation:bob 3.2s ease-in-out infinite}
.shark-box.happy svg{animation:hop .9s ease-in-out 2}
.shark-box.think svg{animation:tilt .8s ease-in-out}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes hop{30%{transform:translateY(-22px) rotate(-8deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes tilt{30%{transform:rotate(-8deg)}70%{transform:rotate(5deg)}}
.bubble{position:relative;background:var(--teal-l);border-radius:18px;padding:14px 16px;font-size:19px;flex:1 1 auto;overflow:auto;min-height:80px}
.bubble:before{content:'';position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:var(--teal-l)}
.bubble.nudge{background:#fff1d6}.bubble.nudge:before{border-bottom-color:#fff1d6}
.bubble.yay{background:var(--good-l)}.bubble.yay:before{border-bottom-color:var(--good-l)}
.bubble .in{animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.bubble p{margin:0 0 8px}
.idea{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;border-left:6px solid var(--good)}
.idea small{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--good);font-weight:700}
.hintrow{display:flex;flex-direction:column;gap:8px;flex:none}
.hintmeter{font-size:15px;color:var(--ink2);text-align:center}
.board{background:#fff;border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.bhead{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--line);flex:none}
.bhead .wname{font-weight:600;font-size:21px;white-space:nowrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:600;padding:0;color:var(--ink2)}
.dot.done{background:var(--good);border-color:var(--good);color:#fff}
.dot.cur{border-color:var(--coral);box-shadow:0 0 0 3px #ffd9cf}
.dot:disabled{opacity:.4;cursor:default}
.task{padding:12px 22px 0;font-size:22px;font-weight:500;flex:none}
.stage{flex:1;min-height:0;overflow:auto;padding:12px 22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bfoot{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:2px solid var(--line);flex:none}
.bfoot .acts{display:flex;gap:12px;align-items:center}

/* drag and drop */
.dd{touch-action:none;cursor:grab}
.dd.sel{outline:4px solid #ffb703;outline-offset:2px;transform:scale(1.08)}
.dd.lifted{opacity:.3}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.92;margin:0}
body.dragging,body.dragging *{cursor:grabbing!important}
body.picking [data-drop],body.dragging [data-drop]{outline:3px dashed rgba(13,132,150,.45);outline-offset:3px}
[data-drop].over{outline:4px solid var(--coral)!important;outline-offset:3px}

/* shared widgets */
.ask{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--teal-l);border-radius:18px;padding:12px 18px}
.asklabel{font-weight:500;text-align:center}
.numrow{display:flex;gap:10px;align-items:center}
.numin{width:100px;height:56px;border-radius:14px;border:3px solid var(--line);text-align:center;font-size:30px;font-weight:600;background:#fff}
.numin.ok{border-color:var(--good);background:var(--good-l)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.choice{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 18px;font-weight:600;font-size:21px;box-shadow:0 4px 0 var(--line)}
.choice.ok{border-color:var(--good);background:var(--good-l)}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.note{font-size:17px;color:var(--ink2);text-align:center}
.pill{display:inline-block;background:var(--teal-l);border-radius:999px;padding:3px 12px;font-weight:600}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden}
.conf{position:absolute;font-size:30px}
.fly{position:absolute;font-size:28px;font-weight:700;color:var(--coral-d);background:#fff;border-radius:999px;padding:2px 12px;box-shadow:var(--shadow)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,40,60,.45);display:grid;place-items:center;z-index:950}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:26px;padding:24px 28px;max-width:860px;width:calc(100% - 40px);max-height:calc(100vh - 60px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h2{margin:0 0 10px;font-size:28px}
.ptable{width:100%;border-collapse:collapse;font-size:17px;margin:10px 0}
.ptable th,.ptable td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ptable th{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.wcomplete{text-align:center}
.wcomplete .big{font-size:96px;animation:hop 1s ease-in-out 3}

/* aquarium */
.aqscreen{display:grid;grid-template-columns:1fr 360px;gap:18px;padding:16px 20px;height:100%}
.tank{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--shadow),inset 0 0 0 8px rgba(255,255,255,.5);
  background:linear-gradient(180deg,#9be3f0,#45aacb 60%,#2f8fb5)}
.tank .sandbed{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(#f6e2b0,#e7c784);border-radius:50% 50% 0 0/30px 30px 0 0}
.tank .decor{position:absolute;bottom:22px;font-size:54px;line-height:1}
.tank .swim{position:absolute;left:0;font-size:38px;line-height:1;will-change:transform}
.tank .swim.me svg{width:150px;height:98px}
.tank .bub{position:absolute;bottom:60px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-700px);opacity:0}}
.tankinfo{position:absolute;top:14px;left:18px;background:rgba(255,255,255,.85);border-radius:14px;padding:6px 14px;font-size:17px;max-width:70%}
.shop{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.shop h2{margin:0;font-size:24px}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px;font-weight:600}
.tab[aria-selected="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto;padding:4px}
.item{border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;font-weight:600}
.item .ic{font-size:38px;line-height:1.1;height:44px;display:grid;place-items:center}
.item .sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.item.on{border-color:var(--good);background:var(--good-l)}
.item:disabled{opacity:.5;cursor:default}
.shop .mini svg{width:200px;height:130px}
.shop .mini{display:flex;justify-content:center}
</style>
</head>
<body>
<header class="top">
  <button class="logo" id="logo" aria-label="Shark Math, go to the map"></button>
  <div class="spacer"></div>
  <div class="teeth" id="teeth" aria-live="polite" title="Shark teeth you have earned"></div>
  <button class="navb" id="navMap">🗺️ Map</button>
  <button class="navb" id="navAq">🐠 Aquarium</button>
  <button class="navb" id="mute" aria-label="Sound on or off"></button>
</header>
<main id="app"></main>
<div id="fx" aria-hidden="true"></div>
<div id="modal" hidden></div>
<style>
/* scale */
.facts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.fact{background:var(--sand);border-radius:16px;padding:8px 16px 4px;min-width:200px}
.fpans{display:flex;justify-content:space-between;gap:20px;font-size:30px;line-height:1.1}
.fbar{height:6px;background:#8a6a3a;border-radius:3px;margin-top:4px}
.fpiv{width:0;height:0;margin:0 auto;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:16px solid #8a6a3a}
.flab{font-size:13px;text-align:center;color:#7a5b30;font-weight:600}
.trade{background:#fff4d6;border:3px dashed var(--sun-d);border-radius:16px;padding:6px 16px;text-align:center}
.trade .tt{font-size:32px}
.scale{position:relative;width:min(100%,720px);height:258px;flex:none;margin-top:10px}
.post{position:absolute;left:50%;top:52px;bottom:26px;width:16px;margin-left:-8px;background:linear-gradient(90deg,#9b7442,#c79a5d,#9b7442);border-radius:8px}
.sbase{position:absolute;left:50%;bottom:6px;width:180px;margin-left:-90px;height:24px;background:#9b7442;border-radius:14px 14px 6px 6px}
.beam{position:absolute;left:15%;width:70%;top:46px;height:12px;background:linear-gradient(#e0b66d,#a77b3d);border-radius:6px;transition:transform .8s cubic-bezier(.34,1.45,.64,1)}
.pivot{position:absolute;left:50%;top:39px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#f2c14e;border:4px solid #a77b3d}
.pan{position:absolute;top:52px;width:30%;height:150px;transition:transform .8s cubic-bezier(.34,1.45,.64,1);border-radius:16px}
.panL{left:0}.panR{right:0}
.strings{position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none}
.strings svg{width:100%;height:100%;overflow:visible}
.strings line{stroke:#7a5b30;stroke-width:2;vector-effect:non-scaling-stroke}
.dish{position:absolute;left:0;right:0;top:120px;height:26px;background:linear-gradient(#f7d27a,#d6a336);border-radius:4px 4px 50% 50%/4px 4px 100% 100%;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pitems{position:absolute;left:4%;right:4%;top:0;bottom:26px;display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-start}
.pitem{font-size:34px;line-height:1;background:none;border:0;padding:2px 1px;border-radius:10px}
.pitem.lock{cursor:default;display:inline-block}
.fog{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:20px;padding:6px 16px;font-weight:600;font-size:18px;box-shadow:var(--shadow);z-index:2;white-space:nowrap}
.tray{display:flex;gap:14px;align-items:center;justify-content:center;background:linear-gradient(#c7edf5,#93d4e6);border-radius:20px;padding:6px 18px;min-width:min(100%,560px);min-height:72px}
.titem{font-size:38px;background:#fff;border:3px solid #fff;border-radius:16px;width:60px;height:60px;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.tray .note{max-width:300px;text-align:left}

/* pattern */
.prow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.pslot{display:flex;flex-direction:column;align-items:center;gap:4px}
.pcell{min-width:70px;height:80px;padding:0 6px;border-radius:16px;background:var(--teal-l);display:grid;place-items:center;border:3px solid transparent;transition:background .3s}
.pcell.blank{background:#fff;border:3px dashed var(--teal)}
.pcell.tint1{background:#ffe2a6}.pcell.tint2{background:#c4ecfb}
.prow.long .pcell{min-width:58px;height:70px}
.prow.long .pemo{font-size:34px}
.pemo{font-size:40px;line-height:1;white-space:nowrap}
.pnum{font-size:34px;font-weight:600}
.q{font-size:36px;color:var(--teal);font-weight:700}
.plab{font-size:15px;color:var(--ink2);min-height:20px;font-weight:600}
.plab.dl{color:var(--coral-d);font-size:17px}
.pgap{font-size:28px;color:var(--ink2);align-self:center;padding:0 4px;margin-bottom:24px}
.ppal{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;background:var(--sand);border-radius:20px;padding:12px 18px}
.pchoice{min-width:78px;height:80px;border-radius:16px;background:#fff;border:3px solid #fff;box-shadow:0 4px 0 var(--sand-d);display:grid;place-items:center;padding:0 8px}
.pfill{background:none;border:0;padding:0;display:grid;place-items:center;width:100%;height:100%}

/* array */
.agrid{display:flex;flex-direction:column;gap:4px}
.arow{display:flex;align-items:center;gap:2px;border:3px solid transparent;background:none;border-radius:14px;padding:2px 8px}
.arow:hover{background:var(--teal-l)}
.arow.on{background:#ffe9b8;border-color:var(--sun)}
.acell{width:46px;height:44px;font-size:34px;line-height:44px;text-align:center}
.acell.hole{background:#e9d6a8;border-radius:6px}
.acell.ghostf{opacity:.25;background:#e9d6a8}
.acount{width:40px;font-weight:700;color:var(--coral-d);font-size:24px}
.tally{min-height:30px}

/* pairs and pools */
.pool{position:relative;width:min(100%,640px);height:230px;background:linear-gradient(#d4f1f7,#a9e0ec);border-radius:24px;flex:none}
.bub{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#bfe9f5 55%,#7fcde4);font-size:32px;font-weight:700;color:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.bub.glow{animation:pulse 1s infinite;border-color:var(--coral)}
.tens{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:10px}
.ten{background:var(--good-l);border:2px solid var(--good);border-radius:14px;padding:4px 12px;display:flex;gap:8px;align-items:center}
.ten b{background:var(--good);color:#fff;border-radius:999px;padding:0 10px}

/* outfits */
.dress{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.model{width:240px;height:170px;border-radius:24px;background:linear-gradient(#e8f8fb,#cdeef5);display:grid;place-items:center;border:3px dashed var(--teal)}
.model svg{width:220px;height:143px}
.wears{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.wear{display:flex;gap:10px;align-items:center}
.wlab{width:80px;font-weight:600}
.witem{width:66px;height:66px;font-size:40px;border-radius:16px;background:#fff;border:3px solid var(--line);padding:0;display:grid;place-items:center;box-shadow:0 4px 0 var(--line)}
.album{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:60px;max-width:760px}
.photo{width:86px;height:62px;background:#fff;border:3px solid var(--sand-d);border-radius:10px;display:grid;place-items:center;box-shadow:0 3px 0 var(--sand)}
.photo svg{width:80px;height:52px}
.otable{border-collapse:separate;border-spacing:6px}
.otable th{font-size:34px}

  draw();
  return { solve() { const s = sumSolutions(p, 1)[0]; s.forEach((x, i) => v[i] = x); draw(); setTimeout(() => api.win(), 600); } };

    explain: 'Each handshake uses 2 fins, so the number of fins used is always even. 5 × 3 = 15 is odd, so it is impossible. Odd and even can prove that something can never happen!' },
  { type: 'picksum', nums: [1, 3, 5, 7, 9, 11], k: 2, target: 12,
    task: 'Pick 2 shells that add up to 12.',
    hints: ['Try 1 and the biggest shell.', '1 + 11, 3 + 9 or 5 + 7.'],
    walk: 'Pick 5 and 7.',
    explain: 'There are 3 ways: 1 + 11, 3 + 9 and 5 + 7. Two odd numbers always make an even number.' },
  { type: 'picksum', nums: [1, 3, 5, 7, 9, 11], k: 3, target: 20,
    task: 'Pick 3 shells that add up to 20. If you think it can’t be done, press “It can’t be done!”',
    hints: ['Every shell has an odd number on it.', 'Odd + odd = even. Then even + odd = ?'],
    walk: 'Odd + odd + odd is always odd. 20 is even. So no 3 shells can make 20.',
    explain: 'Three odd numbers always add up to an odd number. So you can be sure it never works, without trying every way.' },
  ] },
{ id: 'logic', name: 'Detective Deep', emoji: '🕵️', creature: '🐬', prize: '🦞', prizeName: 'lobster', concept: 'Logic and clues',
  teaches: 'Logic: truth-tellers and liars (testing a case and finding a contradiction) and seating puzzles where clues rule options out.',
  puzzles: [
  { type: 'liars', chars: [{ n: 'Pip', known: 'D', say: 'Bo is an eel.', f: a => a.Bo === 'E' }, { n: 'Bo' }],
    task: 'Pip is a dolphin. Is Bo a dolphin or an eel?',
    hints: ['Dolphins always tell the truth.', 'Pip says Bo is an eel, and Pip tells the truth.'],
    walk: 'Pip is a dolphin, so what Pip says is true. Bo is an eel.',
    explain: 'If you know someone always tells the truth, you can believe what they say.' },
  { type: 'liars', chars: [{ n: 'Ella', known: 'E', say: 'Gus is an eel.', f: a => a.Gus === 'E' }, { n: 'Gus' }],
    task: 'Ella is an eel. Is Gus a dolphin or an eel?',
    hints: ['Eels always fib.', 'Ella says Gus is an eel. That must be false.'],
    walk: 'Ella is an eel, so her words are false. Gus is not an eel: Gus is a dolphin.',
    explain: 'What an eel says is always false, so the opposite is true.' },
  { type: 'liars', chars: [{ n: 'Coco', known: 'D', say: 'Dex is a dolphin.', f: a => a.Dex === 'D' }, { n: 'Dex', say: 'Eve is an eel.', f: a => a.Eve === 'E' }, { n: 'Eve' }],
    task: 'Coco is a dolphin. Who are Dex and Eve?',
    hints: ['Start with Coco. Coco tells the truth.', 'So Dex is a dolphin. Then what Dex says is true too.'],
    walk: 'Coco tells the truth, so Dex is a dolphin. Dex tells the truth, so Eve is an eel.',
    explain: 'One clue led to the next, like dominoes. Start with what you know for sure.' },
  { type: 'seats', n: 3, chars: [{ id: 'O', e: '🐙', name: 'Olly' }, { id: 'C', e: '🦀', name: 'Cora' }, { id: 'T', e: '🐢', name: 'Tito' }],
    clues: [{ t: 'Cora sits in the middle seat.', f: C_.at('C', 1) }, { t: 'Olly does not sit at the left end.', f: C_.notAt('O', 0) }],
    task: 'Three friends are going to the movies. Drag each friend into a seat so that all the clues are true.',
    hints: ['Put Cora in the middle first.', 'Olly cannot be on the left, so Olly goes on the right.'],
    walk: 'Tito, Cora, Olly.',
    explain: 'Each clue rules some seats out. When only one choice is left, it must be right.' },
  { type: 'liars', chars: [{ n: 'Kai', say: 'Lu is an eel.', f: a => a.Lu === 'E' }, { n: 'Lu', say: 'Kai and I are both dolphins.', f: a => a.Kai === 'D' && a.Lu === 'D' }],
    task: 'Nobody knows who Kai and Lu are. Read what they say and work it out.',
    hints: ['Imagine Lu is a dolphin. Then Kai and Lu are both dolphins. But then Kai says something false…', 'So Lu must be an eel. Is what Kai says true, then?'],
    walk: 'If Lu were a dolphin, Kai would be a dolphin who says something false. That can’t happen. So Lu is an eel, and Kai tells the truth: Kai is a dolphin.',
    explain: '“Imagine it, and see if it breaks” is a strong trick. If an idea leads to nonsense, it must be wrong.' },
  { type: 'seats', n: 4, chars: [{ id: 'O', e: '🐙', name: 'Olly' }, { id: 'C', e: '🦀', name: 'Cora' }, { id: 'T', e: '🐢', name: 'Tito' }, { id: 'F', e: '🐠', name: 'Fifi' }],
    clues: [{ t: 'Olly sits at the left end.', f: C_.at('O', 0) }, { t: 'Tito sits next to Cora.', f: C_.next('T', 'C') }, { t: 'Fifi does not sit next to Olly.', f: C_.notNext('F', 'O') }],
    task: 'Four friends now. Seat them so that all the clues are true.',
    hints: ['Olly goes at the left end. Fifi cannot be next to Olly.', 'Tito and Cora must sit together, so Fifi goes at the right end.'],
    walk: 'Olly, Cora, Tito, Fifi works. Olly, Tito, Cora, Fifi works too!',
    explain: 'Some puzzles have more than one answer. Olly, Cora, Tito, Fifi and Olly, Tito, Cora, Fifi both follow every clue.' },
  { type: 'liars', chars: [{ n: 'Mo', say: 'Nia and I are both eels.', f: a => a.Mo === 'E' && a.Nia === 'E' }, { n: 'Nia' }],
    task: 'Mo says something strange. Who are Mo and Nia?',
    hints: ['Could Mo be a dolphin? Then “we are both eels” would be true, so Mo would be an eel. That makes no sense!', 'So Mo is an eel, and the words are false. They are NOT both eels.'],
    walk: 'A dolphin would never say it is an eel. So Mo is an eel. Mo fibs, so they are not both eels: Nia is a dolphin.',
    explain: 'Nobody can truthfully say “I am an eel”, so Mo must be fibbing. Then the opposite of what Mo said is true.' },
  { type: 'seats', n: 5, chars: [{ id: 'O', e: '🐙', name: 'Olly' }, { id: 'C', e: '🦀', name: 'Cora' }, { id: 'T', e: '🐢', name: 'Tito' }, { id: 'F', e: '🐠', name: 'Fifi' }, { id: 'P', e: '🐡', name: 'Puff' }],
    clues: [{ t: 'Fifi sits in the middle seat.', f: C_.at('F', 2) }, { t: 'Olly and Cora sit at the two ends.', f: C_.ends('O', 'C', 5) }, { t: 'Tito sits next to Olly.', f: C_.next('T', 'O') }, { t: 'Puff sits somewhere to the right of Tito.', f: C_.rightOf('P', 'T') }],
    task: 'Five friends! Seat them so that all the clues are true.',
    hints: ['Put Fifi in the middle. Olly and Cora go at the ends, but which end is which?', 'If Olly is at the right end, Tito is next to him, and then Puff can’t be to the right of Tito.'],
    walk: 'Olly, Tito, Fifi, Puff, Cora.',
    explain: 'Trying one case and seeing it fail tells you the other case is right.' },
  { type: 'liars', chars: [{ n: 'Rex', say: 'Sky is an eel.', f: a => a.Sky === 'E' }, { n: 'Sky', say: 'Taz is an eel.', f: a => a.Taz === 'E' }, { n: 'Taz', say: 'Rex and Sky are both eels.', f: a => a.Rex === 'E' && a.Sky === 'E' }],
    task: 'The hardest one. Who is a dolphin and who is an eel?',
    hints: ['Imagine Taz tells the truth. Then Rex and Sky are both eels. Does Rex’s sentence work then?', 'If Sky is an eel, Rex’s words “Sky is an eel” are true, but Rex would be an eel too! So Taz must be fibbing.'],
    walk: 'Taz is an eel. So “Taz is an eel” is true, and Sky is a dolphin. Then “Sky is an eel” is false, so Rex is an eel.',
    explain: 'Try an idea, follow it, and throw it away if it breaks. That is how detectives think.' },
  ] },
{ id: 'back', name: 'Rewind Rocks', emoji: '⏪', creature: '🐢', prize: '🦐', prizeName: 'giant shrimp', concept: 'Working backwards',
  teaches: 'Working backwards: undoing steps with the opposite operation in reverse order, and planning a winning game strategy from the end.',
  puzzles: [
  { type: 'back', steps: [{ op: '-', n: 3, t: 'Finn eats 3' }], end: 5,
    task: 'Finn ate 3 fish. Now 5 fish are left. How many fish were there at the start? Undo the step to find out.',
    hints: ['Finn ate 3 fish. To go back, the 3 fish come back.', 'Undo it by adding 3.'],
    walk: 'Put the 3 fish back: 5 + 3 = 8.',
    explain: 'To go backwards, do the opposite. The opposite of eating 3 is adding 3.' },
  { type: 'back', steps: [{ op: '+', n: 4, t: '4 fish swim in' }, { op: '-', n: 2, t: 'Finn eats 2' }], end: 7,
    task: 'Some fish were playing. 4 more swam in. Then Finn ate 2. Now there are 7. How many were there at the start?',
    hints: ['Start at the end and undo the last step first.', 'Undo “eats 2” by adding 2. Undo “4 swim in” by taking away 4.'],
    walk: '7 + 2 = 9. Then 9 − 4 = 5.',
    explain: 'Undo the steps in the opposite order, last step first. It is like taking off your shoes before your socks!' },
  { type: 'back', steps: [{ op: '/', t: 'Finn eats half' }], end: 4,
    task: 'Finn ate half of the fish. Now 4 are left. How many were there at the start?',
    hints: ['Finn ate half. The half that is left is 4.', 'If half is 4, the whole is 4 + 4.'],
    walk: 'Double 4 to get 8.',
    explain: 'The opposite of halving is doubling.' },
  { type: 'back', steps: [{ op: '/', t: 'Finn eats half' }, { op: '-', n: 3, t: 'Finn eats 3 more' }], end: 2,
    task: 'Finn ate half of the fish, and then 3 more. Now 2 are left. How many fish were there at the start?',
    hints: ['Undo “eats 3 more” first.', '2 + 3 = 5. Then undo “eats half” by doubling.'],
    walk: '2 + 3 = 5, and 5 doubled is 10.',
    explain: 'Go back one step at a time: 2 → 5 → 10. Check it forwards: half of 10 is 5, and 5 − 3 = 2.' },
  { type: 'back', steps: [{ op: '*', t: 'the school doubles' }, { op: '-', n: 5, t: 'Finn eats 5' }], end: 9,
    task: 'A school of fish doubled in size. Then Finn ate 5. Now there are 9. How many were there at the start?',
    hints: ['Undo “eats 5” first.', '9 + 5 = 14. Then undo the doubling by halving.'],
    walk: '9 + 5 = 14. Half of 14 is 7.',
    explain: 'Going back: 9 → 14 → 7. Check forwards: 7 doubled is 14, and 14 − 5 = 9.' },
  { type: 'back', steps: [{ op: '/', t: 'Finn eats half' }, { op: '+', n: 3, t: '3 fish swim in' }, { op: '/', t: 'Finn eats half' }], end: 5,
    task: 'Three things happened: Finn ate half, then 3 fish swam in, then Finn ate half again. Now 5 are left. How many were there at the start?',
    hints: ['Undo the last step first: double the 5.', '10, then take away 3, then double again.'],
    walk: '5 doubled is 10. 10 − 3 = 7. 7 doubled is 14.',
    explain: 'Three steps, undone one at a time: 5 → 10 → 7 → 14. Long chains are easy backwards.' },
  { type: 'back', numbers: true, steps: [{ op: '+', n: 6, t: 'add 6' }, { op: '*', t: 'double it' }], end: 20,
    task: 'Finn thinks of a number. Finn adds 6, then doubles it, and gets 20. What was Finn’s number?',
    hints: ['Undo “double it” first.', 'Half of 20 is 10. Then undo “add 6”.'],
    walk: 'Half of 20 is 10, and 10 − 6 = 4.',
    explain: 'Number tricks can be undone too: 20 → 10 → 4.' },
  { type: 'nim', n: 4, k: 2, lose: 'Think about the end. What if Finn has 3 fish left on his turn?',
    task: 'A game! There are 4 fish. You and Finn take turns eating 1 or 2 fish. Whoever eats the last fish wins. You go first. Can you beat Finn?',
    hints: ['What happens if Finn has 3 fish left on his turn? Try it in your head.', 'With 3 left, whatever Finn eats, you can eat the rest. So leave Finn 3: eat 1 fish first.'],
    walk: 'Eat 1. Finn has 3 left. If Finn eats 1, you eat 2. If Finn eats 2, you eat 1. You win!',
    explain: 'Think backwards from the end. Having 3 fish on your turn is a losing spot, so give it to Finn.' },
  { type: 'nim', n: 7, k: 2, lose: 'Leaving Finn 3 fish wins. What number before that also wins?',
    task: 'Same game, more fish. There are 7 fish. Eat 1 or 2 each turn. Whoever eats the last fish wins. You go first.',
    hints: ['Leaving Finn 3 fish wins. Which bigger number works the same way?', 'Leave Finn 6, then 3. With 7, eat 1 first.'],
    walk: 'Eat 1 to leave 6. Whatever Finn eats, eat enough to leave 3. Then you get the last fish.',
    explain: 'The safe numbers to leave are 3, 6, 9… Leave Finn one of those every time and you always win.' },
  { type: 'nim', n: 10, k: 3, lose: 'With 1, 2 or 3 allowed, which number is bad to face? Try 4.',
    task: 'Harder! 10 fish, and now you can eat 1, 2 or 3 each turn. Last fish wins. You go first.',
    hints: ['With 1, 2 or 3 allowed, which number of fish is bad to face? Try 4.', 'Leave Finn 8, then 4. So eat 2 first.'],
    walk: 'Eat 2 to leave 8. Then each round, you and Finn eat 4 together. Leave 4, then take the last fish.',
    explain: 'When you can eat up to 3, the numbers to leave are 4, 8, 12… Working backwards finds them.' },
  ] },
{ id: 'shape', name: 'Shape Shoals', emoji: '🔺', creature: '🦑', prize: '🦦', prizeName: 'sea otter', concept: 'Shapes and space',
  teaches: 'Counting hidden shapes in an organised way, matchstick equations, mirror symmetry and paper folding.',
  puzzles: [
  { type: 'find', kind: 'tri', ...TRI1, more: 'Is the whole shape a triangle too?',
    task: 'How many triangles can you find? Click the 3 corners of a triangle to mark it. Press “I found them all!” when you are done.',
    hints: ['There are two small triangles. Is there a bigger one?', 'The whole shape is a triangle too!'],
    walk: 'ABD, ADC and the big one ABC. That is 3 triangles.',
    explain: 'Small shapes can join to make bigger shapes. Count the small ones, then look for bigger ones.' },
  { type: 'find', kind: 'tri', ...TRI2,
    task: 'Now there are two lines inside. How many triangles can you find?',
    hints: ['Every triangle has its top corner at A.', 'Its bottom side goes between two of the dots B, D, E and C.'],
    walk: 'Small: ABD, ADE, AEC. Medium: ABE, ADC. Big: ABC. That makes 3 + 2 + 1 = 6.',
    explain: 'Every triangle uses 2 of the 4 bottom dots. Counting the pairs in order gives 3 + 2 + 1 = 6, just like the handshakes!' },
  { type: 'match', eq: [1, '+', 2, 4], sol: [2, 'e', 2, 'c'], hintTok: 2,
    task: 'This sum is wrong! Move just one matchstick to make it true.',
    hints: ['The 1 and the 4 can stay. Look at the 2.', 'Can one stick of the 2 hop over to make a 3?'],
    walk: 'Move the bottom-left stick of the 2 to the bottom-right. Now it says 1 + 3 = 4.',
    explain: 'Numbers made of sticks can change into each other. Here 2 became 3, and 1 + 3 = 4.' },
  { type: 'mirror', W: 8, H: 6, axis: 'v', col: '#2fb3ac', cells: [[3, 0], [2, 1], [3, 1], [1, 2], [2, 2], [3, 2], [3, 3], [3, 4]],
    task: 'The dashed line is a mirror. Color squares on the right so they match the left side.',
    hints: ['A square right next to the mirror has a twin right next to it on the other side.', 'Count how far each square is from the mirror. Its twin is the same distance away on the other side.'],
    walk: 'Each colored square gets a twin at the same distance on the right.',
    explain: 'In a mirror picture, each square has a twin the same distance from the line. This is called symmetry.' },
  { type: 'find', kind: 'sq', ...SQ2,
    task: 'How many squares are hiding here? Click 2 opposite corners of a square to mark it.',
    hints: ['There are 4 small squares.', 'Is the whole thing a square too?'],
    walk: '4 small squares and 1 big one: 5 squares.',
    explain: '4 small + 1 big = 5 squares. Big shapes hide around small ones.' },
  { type: 'match', eq: [6, '+', 4, 4], sol: [0, 'g', 0, 'b'], hintTok: 0,
    task: 'Another wrong sum. Move one matchstick to make it true.',
    hints: ['Try changing the 6.', 'The middle stick of the 6 can move up to make a 0. (There is another answer too!)'],
    walk: 'Move the middle stick of the 6 to the top right. Now it says 0 + 4 = 4.',
    explain: '0 + 4 = 4 works. 8 − 4 = 4 works too! Puzzles can have more than one answer.' },
  { type: 'fold', folds: 'v', holes: [[3, 1]],
    task: 'Fold a paper in half and punch one hole. Where are the holes when you open it? Click the squares, then press “Unfold!”',
    hints: ['The punch goes through 2 layers of paper.', 'The fold line works like a mirror.'],
    walk: 'One hole where you punched, and its mirror twin on the left half.',
    explain: 'Folding makes layers. One punch through 2 layers makes 2 holes that are mirror twins.' },
  { type: 'mirror', W: 8, H: 6, axis: 'h', col: '#ef6a4a', cells: [[4, 0], [3, 1], [4, 1], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [6, 2]],
    task: 'A boat on calm water. Color its reflection below the dashed line.',
    hints: ['The bottom of the boat touches the water line. Its reflection touches it too.', 'The top of the mast is the farthest from the water, so its reflection is the farthest down.'],
    walk: 'Row 3 copies row 2 (the boat), row 4 copies row 1, and row 5 copies row 0.',
    explain: 'This mirror line goes across. Things near the line stay near it, and the top of the mast ends up at the bottom.' },
  { type: 'match', eq: [3, '+', 5, 4], sol: [1, 'v', 0, 'f'], hintTok: 1,
    task: 'One more. Move one matchstick to make it true. Every part can change!',
    hints: ['What if the + became a −?', 'Take the standing stick of the + and give it to the 3.'],
    walk: 'Move the standing stick of the + to the top-left of the 3. Now it says 9 − 5 = 4.',
    explain: 'Changing the sign is allowed too: 9 − 5 = 4. Good puzzlers look at every part.' },
  { type: 'fold', folds: 'vh', holes: [[3, 0]],
    task: 'Now fold the paper twice and punch one hole. Where are the holes when you open it?',
    hints: ['Folded twice, the paper has 4 layers.', 'Each fold line is a mirror. Mirror across one line, then the other.'],
    walk: 'There are 4 holes, one in each corner of the paper.',
    explain: '2 folds make 4 layers, so 1 punch makes 4 holes.' },
  ] },
{ id: 'sure', name: 'Sure-Thing Shore', emoji: '🧦', creature: '🐙', prize: '🐧', prizeName: 'penguin', concept: 'Being sure (the pigeonhole idea)',
  teaches: 'The pigeonhole principle and worst-case thinking: how many you must grab to be certain.',
  puzzles: [
  { type: 'grab', colors: [{ c: 'red', n: 'many' }, { c: 'blue', n: 'many' }], goal: 'pair', worst: ['red', 'blue', 'red', 'blue', 'red'],
    q: 'How many fish must you grab to be <b>sure</b> to get 2 of the same colour?', fail: 'No two are the same colour!',
    task: 'The dark cave is full of red and blue fish. You grab fish without looking. The sneaky octopus always hands you the unluckiest fish!',
    hints: ['Think about the worst luck. What if your first fish are all different?', 'With only 2 colours, the first 2 fish could be different. What about the next one?'],
    walk: 'Worst luck: red, then blue. The 3rd fish must match one of them. So 3.',
    explain: 'With 2 colours, 3 fish always make a pair. Thinking about the worst luck is how you become sure.' },
  { type: 'grab', colors: [{ c: 'red', n: 'many' }, { c: 'blue', n: 'many' }, { c: 'yellow', n: 'many' }], goal: 'pair', worst: ['red', 'blue', 'yellow', 'red', 'blue', 'yellow'],
    q: 'Now there are 3 colours. How many must you grab to be <b>sure</b> of 2 the same?', fail: 'No two are the same colour!',
    task: 'This cave has red, blue and yellow fish.',
    hints: ['Worst luck: one of each colour first.', 'After red, blue and yellow, the next fish must match one.'],
    walk: '3 different fish, then the 4th must match. So 4.',
    explain: 'One of each colour first, then one more: 3 + 1 = 4.' },
  { type: 'grab', colors: [{ c: 'red', n: 3 }, { c: 'blue', n: 3 }], goal: 'each', worst: ['red', 'red', 'red', 'blue', 'blue', 'blue'],
    q: 'How many must you grab to be <b>sure</b> to have at least one of <b>each</b> colour?', fail: 'You do not have both colours yet!',
    task: 'This cave has exactly 3 red fish and 3 blue fish.',
    hints: ['Worst luck: all the red fish come first.', 'After all 3 red fish, the next fish must be blue.'],
    walk: '3 red fish first, then the 4th must be blue. So 4.',
    explain: 'The worst luck is getting all 3 reds first. Then one more is sure to be blue: 3 + 1 = 4.' },
  { type: 'grab', colors: [{ c: 'red', n: 5 }, { c: 'blue', n: 4 }], goal: { color: 'red', k: 2 }, worst: ['blue', 'blue', 'blue', 'blue', 'red', 'red', 'red', 'red', 'red'],
    q: 'How many must you grab to be <b>sure</b> to have 2 <b>red</b> fish?', fail: 'Not 2 red fish yet!',
    task: 'This cave has 5 red fish and 4 blue fish.',
    hints: ['Worst luck: you get every blue fish first.', 'All 4 blue fish, then 2 red ones.'],
    walk: '4 blue fish, then 2 red: 4 + 2 = 6.',
    explain: 'All 4 blue fish could come first. Then you need 2 red ones: 4 + 2 = 6.' },
  { type: 'grab', colors: [{ c: 'red', n: 'many' }, { c: 'blue', n: 'many' }, { c: 'yellow', n: 'many' }, { c: 'green', n: 'many' }], goal: 'pair', worst: ['red', 'blue', 'yellow', 'green', 'red', 'blue', 'yellow'],
    q: '4 colours! How many must you grab to be <b>sure</b> of 2 the same?', fail: 'No two are the same colour!',
    task: 'This cave has red, blue, yellow and green fish.',
    hints: ['Worst luck: one of each colour first.', 'How many colours are there? Add one.'],
    walk: '4 different fish, then the 5th must match. So 5.',
    explain: 'One of each colour, then one more: 4 + 1 = 5. The rule is: number of colours + 1.' },
  { type: 'grab', colors: [{ c: 'red', n: 'many' }, { c: 'blue', n: 'many' }], goal: { same: 3 }, worst: ['red', 'blue', 'red', 'blue', 'red', 'blue'],
    q: 'How many must you grab to be <b>sure</b> of 3 fish of the same colour?', fail: 'No 3 of the same colour yet!',
    task: 'Back to red and blue fish. This time you want 3 the same.',
    hints: ['Worst luck: red, blue, red, blue…', 'After 2 red and 2 blue, the next fish makes 3 of one colour.'],
    walk: '2 red and 2 blue, then the 5th makes 3 of a colour. So 5.',
    explain: 'Worst luck gives 2 red and 2 blue. The 5th fish makes 3 of one colour.' },
  { type: 'caves', fish: 5, caves: 4, mode: 'spread',
    task: 'Put 5 fish into 4 caves so that no cave has 2 fish. If you think it can’t be done, press “It can’t be done!”',
    hints: ['Put one fish in each cave. How many fish are left?', 'The last fish has to go into a cave that already has a fish.'],
    walk: 'After 1 fish in each of the 4 caves, 1 fish is left over. It must share a cave.',
    explain: '5 fish and only 4 caves: some cave must get 2 fish. This is called the pigeonhole principle.' },
  { type: 'caves', fish: 8, caves: 3, mode: 'max', q: 'The fullest cave must have at least how many fish?',
    task: '8 fish swim into 3 caves. Spread them out as evenly as you can.',
    hints: ['Share the fish fairly, one cave at a time, round and round.', '3 + 3 + 2 = 8.'],
    walk: 'With 2 in each cave, only 6 fish fit. So some cave needs 3.',
    explain: '3 caves × 2 fish = 6, which is less than 8. So some cave must hold at least 3 fish.' },
  ] },
{ id: 'magic', name: 'Magic Pools', emoji: '✨', creature: '🪼', prize: '🐉', prizeName: 'sea dragon', concept: 'Magic squares and sums',
  teaches: 'Magic squares and sum puzzles: numbers in the middle or corners count in more than one line, and opposite pairs balance.',
  puzzles: [
  { type: 'sums', ...withVals(PLUS), tiles: [1, 2, 3, 4, 5], T: 10,
    task: 'Put the numbers 1 to 5 in the circles so that both lines add up to 10.',
    hints: ['The middle circle is in both lines. Try a big number there.', 'Put 5 in the middle. Then each line needs two numbers that make 5.'],
    walk: '5 in the middle. 1 and 4 on one line, 2 and 3 on the other.',
    explain: 'The middle number counts in both lines. That is why it had to be 5.' },
  { type: 'sums', ...withVals(TRI), tiles: [1, 2, 3, 4, 5, 6], T: 9,
    task: 'Put 1 to 6 in the circles so that each side of the triangle adds up to 9.',
    hints: ['The corner circles are on two sides each.', 'Try 1, 2 and 3 in the corners.'],
    walk: 'Corners 1, 2 and 3. Between 1 and 2 put 6, between 2 and 3 put 4, between 3 and 1 put 5.',
    explain: 'Small numbers in the corners keep the sides small, because each corner counts for two sides.' },
  { type: 'sums', ...withVals(MAGIC, [2, null, 6, null, 5, null, 4, null, 8]), tiles: [1, 3, 7, 9], T: 15,
    task: 'A magic square! Every row, every column and both diagonals must add up to 15.',
    hints: ['Look at the top row: 2 + ? + 6 = 15.', 'The top row needs 7. The left column, 2 + ? + 4, needs 9.'],
    walk: '7 on top, 9 on the left, 1 on the right, 3 at the bottom.',
    explain: 'Every line adds to 15. The middle is 5, and numbers opposite each other across the middle add up to 10.' },
  { type: 'sums', ...withVals(MAGIC, [4, null, null, null, 5, null, null, null, null]), tiles: [1, 2, 3, 6, 7, 8, 9], T: 15,
    task: 'A harder magic square. Every row, column and diagonal must add up to 15.',
    hints: ['Numbers opposite each other across the middle add up to 10. What goes opposite the 4?', 'The 6 goes in the bottom-right corner. The even numbers 2 and 8 go in the other corners.'],
    walk: 'One answer is: 4 9 2 on top, 3 5 7 in the middle, 8 1 6 at the bottom.',
    explain: 'Opposite pairs make 10, and the even numbers sit in the corners. Magic squares follow rules you can discover.' },
  { type: 'sums', ...withVals(TRI), tiles: [1, 2, 3, 4, 5, 6], T: 12,
    task: 'Put 1 to 6 in the circles so that each side adds up to 12.',
    hints: ['Now the sides must be big. Which numbers should go in the corners?', 'Try 4, 5 and 6 in the corners.'],
    walk: 'Corners 4, 5 and 6. Between 4 and 5 put 3, between 5 and 6 put 1, between 6 and 4 put 2.',
    explain: 'Big numbers in the corners make big sides, because each corner counts for two sides.' },
  ] },
];

/* ============ aquarium and wardrobe ============ */
const SHOP = {
  hats: [['none', '', 0], ['flower', '🌸', 3], ['cap', '🧢', 4], ['bow', '🎀', 4], ['top', '🎩', 6], ['grad', '🎓', 10], ['sun', '👒', 10], ['helmet', '⛑️', 12], ['crown', '👑', 20]],
  colors: [['blue', 0], ['grey', 0], ['teal', 5], ['green', 6], ['pink', 6], ['purple', 8], ['orange', 8], ['gold', 20]],
  decor: [['weed', '🌿', 2], ['coral', '🪸', 3], ['shell', '🐚', 3], ['rock', '🪨', 3], ['anchor', '⚓', 5], ['statue', '🗿', 8], ['castle', '🏰', 12], ['gem', '💎', 15], ['ship', '🚢', 15]],
};
let aqTab = 'hats';
function showAquarium() {
  cur = null; clearSel(); setNav('aq'); updateTop();
  const app = $('#app'); app.innerHTML = '';
  const tank = h('div', { class: 'tank', role: 'img', 'aria-label': `Your aquarium with ${S.creatures.length} sea friends` });
  tank.append(h('div', { class: 'sandbed' }));
  S.decor.forEach((d, i) => { const it = SHOP.decor.find(x => x[0] === d); if (it) tank.append(h('span', { class: 'decor', style: { left: (4 + (i * 11) % 88) + '%' } }, it[1])); });
  range(10).forEach(i => tank.append(h('span', { class: 'bub', style: { left: (5 + i * 9.5) + '%', animationDuration: (5 + (i % 4) * 2) + 's', animationDelay: (-i * 1.3) + 's' } })));
  const list = S.creatures.slice(-40);
  const swimmers = list.map((e, i) => { const s = h('span', { class: 'swim' }, e); s.style.top = (e === '🦀' ? 84 : 10 + ((i * 37) % 60)) + '%'; tank.append(s); return s; });
  const me = h('span', { class: 'swim me', html: sharkSVG() }); me.style.top = '38%'; tank.append(me);
  const counts = {}; S.creatures.forEach(c => counts[c] = (counts[c] || 0) + 1);
  tank.append(h('div', { class: 'tankinfo' }, S.creatures.length ? `Sea friends: ${Object.entries(counts).map(([e, n]) => `${e}×${n}`).join('  ')}` : 'Your aquarium is empty. Every puzzle you solve brings a new sea friend!'));
  const shop = h('div', { class: 'shop' });
  app.append(h('div', { class: 'aqscreen' }, tank, shop));
  const W = tank.clientWidth - 60;
  swimmers.forEach((s, i) => { const dur = 9000 + ((i * 2917) % 12000); s.animate([{ transform: 'translateX(0) scaleX(-1)' }, { transform: `translateX(${W}px) scaleX(-1)`, offset: .49 }, { transform: `translateX(${W}px) scaleX(1)`, offset: .5 }, { transform: 'translateX(0) scaleX(1)' }], { duration: dur, iterations: Infinity, delay: -((i * 1777) % dur) }); });
  me.animate([{ transform: 'translateX(0) scaleX(1)' }, { transform: `translateX(${W - 100}px) scaleX(1)`, offset: .49 }, { transform: `translateX(${W - 100}px) scaleX(-1)`, offset: .5 }, { transform: 'translateX(0) scaleX(-1)' }], { duration: 16000, iterations: Infinity });
  drawShop(shop);
}
function drawShop(shop) {
  shop.innerHTML = '';
  shop.append(h('h2', {}, 'Finn’s wardrobe'), h('div', { class: 'mini', html: sharkSVG() }), h('div', { class: 'note' }, `You have 🦷 ${S.teeth} teeth to spend.`));
  const tabs = h('div', { class: 'tabs', role: 'tablist' });
  [['hats', 'Hats'], ['colors', 'Colours'], ['decor', 'Decorations']].forEach(([k, l]) => tabs.append(h('button', { class: 'tab', role: 'tab', 'aria-selected': aqTab === k ? 'true' : 'false', onclick: () => { aqTab = k; snd.pop(); drawShop(shop); } }, l)));
  shop.append(tabs);
  const grid = h('div', { class: 'shopgrid' });
  const buy = (key, price, after) => {
    if (!S.owned.includes(key)) { if (S.teeth < price) { snd.soft(); return; } S.teeth -= price; S.owned.push(key); snd.good(); }
    else snd.pop();
    after(); save(); updateTop();
    if (aqTab === 'decor') showAquarium(); else drawShop(shop);
  };
  if (aqTab === 'hats') SHOP.hats.forEach(([id, em, pr]) => {
    const key = 'h-' + id, own = S.owned.includes(key) || pr === 0, on = S.hat === em;
    grid.append(h('button', { class: 'item' + (on ? ' on' : ''), disabled: !own && S.teeth < pr, onclick: () => buy(key, pr, () => { S.hat = em; }) }, h('span', { class: 'ic' }, em || '🚫'), h('span', {}, on ? 'Wearing' : own ? 'Wear' : `🦷 ${pr}`)));
  });
  if (aqTab === 'colors') SHOP.colors.forEach(([id, pr]) => {
    const key = 'c-' + id, own = S.owned.includes(key) || pr === 0, on = S.color === id;
    grid.append(h('button', { class: 'item' + (on ? ' on' : ''), disabled: !own && S.teeth < pr, 'aria-label': id + ' colour', onclick: () => buy(key, pr, () => { S.color = id; }) }, h('span', { class: 'ic' }, h('span', { class: 'sw', style: { background: COLORS[id][0] } })), h('span', {}, on ? 'Wearing' : own ? id : `🦷 ${pr}`)));
  });
  if (aqTab === 'decor') SHOP.decor.forEach(([id, em, pr]) => {
    const key = 'd-' + id, own = S.owned.includes(key), on = S.decor.includes(id);
    grid.append(h('button', { class: 'item' + (on ? ' on' : ''), disabled: !own && S.teeth < pr, onclick: () => buy(key, pr, () => { if (on) S.decor = S.decor.filter(x => x !== id); else S.decor.push(id); }) }, h('span', { class: 'ic' }, em), h('span', {}, on ? 'In the tank' : own ? 'Put in' : `🦷 ${pr}`)));
  });
  shop.append(grid, h('div', { class: 'note' }, 'Solve puzzles to earn teeth: 3 with no hints, 2 with hints, 1 if Finn shows you how.'));
}

/* ============ grown-ups corner ============ */
function showParent() {
  const m = $('#modal'); m.innerHTML = ''; m.hidden = false;
  const close = () => { m.hidden = true; showMap(); };
  const tb = h('table', { class: 'ptable' }, h('tr', {}, h('th', {}, 'Island'), h('th', {}, 'What it teaches'), h('th', {}, 'Solved'), h('th', {}, 'Used hints')));
  WORLDS.forEach((w, wi) => {
    const hinted = w.puzzles.filter((_, i) => (S.hints[pid(wi, i)] || 0) > 0).length;
    tb.append(h('tr', {}, h('td', {}, `${w.emoji} ${w.name}`), h('td', {}, w.teaches), h('td', {}, `${solvedIn(wi)} / ${w.puzzles.length}`), h('td', {}, String(hinted))));
  });
  const unlock = h('input', { type: 'checkbox', id: 'unl' }); unlock.checked = !!S.unlockAll;
  unlock.onchange = () => { S.unlockAll = unlock.checked; save(); };
  const reset = h('button', { class: 'btn coral' }, 'Reset all progress');
  reset.onclick = () => {
    if (reset.dataset.sure) { localStorage.removeItem(KEY); S = load(); save(); m.hidden = true; updateTop(); showMap(); return; }
    reset.dataset.sure = '1'; reset.textContent = 'Click again to erase everything';
  };
  m.append(h('div', { class: 'mbox', role: 'dialog', 'aria-label': 'Grown-ups corner' },
    h('h2', {}, 'Grown-ups corner'),
    h('p', {}, `Puzzles solved: ${totalSolved()} of ${totalPuzzles()}. Teeth earned in total: ${S.earned}. Progress is saved in this browser.`),
    h('p', { class: 'note', style: { textAlign: 'left' } }, 'Each island introduces one idea from early maths olympiads through a hands-on puzzle. After each solve, Finn names the idea in a sentence or two. Hints come in levels and never block progress. A new island opens for every 3 puzzles solved anywhere.'),
    tb,
    h('p', {}, h('label', { for: 'unl' }, unlock, ' Open all islands and puzzles (skip the unlock rule)')),
    h('div', { class: 'row', style: { justifyContent: 'space-between' } }, reset, h('button', { class: 'btn big', onclick: close }, 'Close'))));
}

/* ============ boot ============ */
updateTop();
showMap();
window.SM = { get S() { return S; }, WORLDS, openPuzzle, showMap, showAquarium, showParent, get cur() { return cur; }, liarSolutions, seatSolutions, sumSolutions, pid };
</script>
</body>
