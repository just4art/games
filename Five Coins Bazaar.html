<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Coins Bazaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dcebe8; --surface:#fbf8f1; --surface2:#eef4f2; --text:#1d2340; --muted:#5d6584;
  --saffron:#d9961a; --lapis:#2c4ba0; --pom:#b8323f; --good:#2c7a4b; --line:#c9dbd7;
  --sand1:#ecd39b; --sand2:#dfbd78; --path:#c9a463; --night:#0d1430; --tile:#2c4ba0;
  --alley:#e4dccb; --alley2:#f2ede3; --house:#cbbfab; --house2:#b8ab95; --water:#6fb7d6; --leaf:#5aa469; --plaza:#efe7d6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1529; --surface:#19213d; --surface2:#222c4f; --text:#f1e8d2; --muted:#a8afc8;
    --saffron:#f0b733; --lapis:#7f9cf0; --pom:#ef6b77; --good:#6cd398; --line:#2c3760;
    --sand1:#6e5a33; --sand2:#5a4828; --path:#8a7240; --night:#05081a; --tile:#3d5ec4;
    --alley:#232840; --alley2:#2c3250; --house:#434a68; --house2:#383e5a; --water:#2f6f93; --leaf:#3f7d52; --plaza:#30375a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1529; --surface:#19213d; --surface2:#222c4f; --text:#f1e8d2; --muted:#a8afc8;
  --saffron:#f0b733; --lapis:#7f9cf0; --pom:#ef6b77; --good:#6cd398; --line:#2c3760;
  --sand1:#6e5a33; --sand2:#5a4828; --path:#8a7240; --night:#05081a; --tile:#3d5ec4;
    --alley:#232840; --alley2:#2c3250; --house:#434a68; --house2:#383e5a; --water:#2f6f93; --leaf:#3f7d52; --plaza:#30375a;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;min-height:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0}
h1{font-size:24px;letter-spacing:.01em}
h2{font-size:21px}
h3{font-size:16px;margin:14px 0 2px;color:var(--lapis)}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:10px 12px calc(var(--barH) + 16px)}
:root{--barH:66px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.goal{font-size:12px;color:var(--muted)}
.hud{display:grid;grid-template-columns:1.1fr 1fr 1.2fr 1fr;gap:6px;margin:8px 0 6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 8px;text-align:center;font-size:12px;color:var(--muted)}
.chip b{display:block;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.sunbar{height:4px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.sunbar i{display:block;height:100%;background:var(--saffron)}
.next{font-size:13px;margin:0 0 4px;font-weight:600;color:var(--lapis)}
.stall.locked .tent{border-style:dashed;opacity:.75}
.goalbar{height:6px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:8px}
.goalbar i{display:block;height:100%;background:var(--lapis);transition:width .4s}
.frame{position:relative;width:100%;width:min(100%,calc(100vh - 300px));width:min(100%,calc(100dvh - 300px));min-width:280px;margin:0 auto;padding:10px;border-radius:18px;background:conic-gradient(var(--lapis) 25%,var(--saffron) 0 50%,var(--lapis) 0 75%,var(--saffron) 0) 0 0/20px 20px;box-shadow:0 8px 24px rgba(13,20,48,.18)}
.frame .map{outline:3px solid var(--surface)}
.qrow{display:flex;align-items:center;gap:6px;font-size:13px;margin:6px 0 0 38px;flex-wrap:wrap}
.qrow b{font-variant-numeric:tabular-nums}
.mini{border:1.5px solid var(--lapis);background:transparent;color:var(--lapis);border-radius:8px;min-width:30px;height:28px;font-weight:700;cursor:pointer}
.log{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.pill{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--saffron);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:14px}
.pill.on{display:flex}
.pill .info{flex:1}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mapsvg .hit{cursor:pointer}
#hero{transition:transform .11s linear}
@media (prefers-reduced-motion: reduce){#hero{transition:none}}
.map{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,var(--sand1),var(--sand2));touch-action:manipulation}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.stall{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
.tent{position:relative;width:50px;height:50px;border-radius:50% 50% 12px 12px;background:var(--surface);border:2px solid var(--lapis);display:grid;place-items:center;font-size:25px;box-shadow:0 3px 0 var(--path)}
.stall.here .tent{border-color:var(--saffron);border-width:3px}
.lbl{font-size:11px;font-weight:600;margin-top:3px;background:var(--surface);padding:0 7px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.mk{position:absolute;top:-10px;right:-10px;font-size:17px}
.eta{display:block;font-size:10px;font-weight:400;color:var(--muted);text-align:center;line-height:1.2}
.stall.far{opacity:.45}
.deco{position:absolute;transform:translate(-50%,-50%);font-size:22px;pointer-events:none;opacity:.85}
.well{position:absolute;transform:translate(-50%,-50%);font-size:24px;background:none;border:none;cursor:pointer;z-index:2;padding:4px}
.player{position:absolute;transform:translate(-50%,-50%);font-size:28px;transition:left .6s ease,top .6s ease;pointer-events:none;z-index:3;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.dusk{position:absolute;inset:0;background:var(--night);pointer-events:none;transition:opacity .6s;z-index:4}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px max(10px,calc(50% - 280px)) calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;font-size:12px;cursor:pointer}
.bbtn span{font-size:21px;line-height:1.2}
.bbtn.active{border-color:var(--saffron);box-shadow:inset 0 -3px 0 var(--saffron)}
.bbtn.rest{background:var(--lapis);color:#fff;border-color:var(--lapis)}
.sheet-wrap{position:fixed;left:0;right:0;top:0;bottom:calc(var(--barH) + env(safe-area-inset-bottom,0px));background:rgba(5,8,26,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-wrap.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--saffron)}
.sh-head{display:flex;gap:12px;align-items:center}
.big{font-size:38px}
.x{background:var(--surface2);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none}
.sub{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.bubble{background:var(--surface2);border-radius:16px 16px 16px 4px;padding:10px 13px;margin:12px 0 4px;font-family:Marcellus,Georgia,serif;font-size:16px;line-height:1.5}
.row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.gi{font-size:24px;width:32px;text-align:center;flex:none}
.info{flex:1;min-width:0}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.sbtn{border:1.5px solid var(--lapis);background:transparent;color:var(--lapis);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer;flex:none}
.sbtn.fill{background:var(--lapis);color:#fff}
.sbtn:disabled{opacity:.35;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.good{color:var(--good);font-weight:600}
.bad{color:var(--pom);font-weight:600}
.news{padding:8px 0;border-bottom:1px solid var(--line)}
.nbg{padding:8px 0;border-bottom:1px solid var(--line)}
.q{display:inline-block;margin:2px 6px 2px 0;font-size:13px;font-variant-numeric:tabular-nums}
.q.best{background:var(--surface2);border-radius:6px;padding:0 5px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(var(--barH) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;z-index:30;max-width:90%;text-align:center;pointer-events:none}
.toast.on{opacity:1}
.wide{width:100%;margin-top:14px;padding:11px}
p{margin:8px 0}
@media (min-width:820px) and (min-aspect-ratio:1/1){
  .app{max-width:none;display:grid;grid-template-columns:auto 380px;gap:22px;justify-content:center;align-items:start;padding:16px 20px}
  .stage{width:min(calc(100vh - 150px),calc(100vw - 460px));width:min(calc(100dvh - 150px),calc(100vw - 460px));min-width:420px}
  .frame{width:100%}
  .side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;height:calc(100vh - 32px);height:calc(100dvh - 32px)}
  .bar{position:static;padding:0;background:none;border:none}
  .sheet-wrap,.sheet-wrap.open{position:static;display:flex;background:none;flex:1;min-height:0;align-items:stretch}
  .sheet{max-height:none;height:100%;border-radius:18px;border:1px solid var(--line);border-top:4px solid var(--saffron)}
  .toast{bottom:24px}
}
@media (prefers-reduced-motion: reduce){.player,.dusk,.goalbar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="top"><h1>Five Coins Bazaar</h1><div class="goal" id="goalTxt"></div></div>
    <div class="hud" id="hud"></div>
    <div class="next" id="nextTxt"></div><div class="goalbar"><i id="goalBar"></i></div>
    <div class="frame"><div class="map" id="map"></div><div class="pill" id="pill"></div></div>
  </main>
  <aside class="side">
    <nav class="bar">
      <button class="bbtn" data-v="here" id="hereBtn" onclick="hereTap()"><span>🗺️</span>Map</button>
      <button class="bbtn" data-v="news" onclick="showNews()"><span>📰</span>News</button>
      <button class="bbtn" data-v="notebook" onclick="showNotebook()"><span>📒</span>Notes</button>
      <button class="bbtn" data-v="bag" onclick="showBag()"><span>🎒</span>Bag</button>
      <button class="bbtn rest" onclick="rest()"><span>🌙</span>Sleep</button>
    </nav>
    <div class="sheet-wrap" id="wrap" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
const DAY_LEN=720, GOAL=500, IMPACT=1.015, WALK=2, WAGE=1.5, KEY='five-coins-bazaar-v1';
const G={
  apple:{n:'Apples',i:'🍎',b:1,w:1,s:4},
  olive:{n:'Olives',i:'🫒',b:4,w:1,s:7},
  fish:{n:'Fish',i:'🐟',b:3,w:1,s:1},
  salt:{n:'Salt',i:'🧂',b:2,w:2,s:0},
  spice:{n:'Spice',i:'🌶️',b:12,w:1,s:0},
  cloth:{n:'Cloth',i:'🧵',b:8,w:2,s:0},
  pottery:{n:'Pottery',i:'🏺',b:6,w:4,s:0}
};
const GK=Object.keys(G);
const T={
  miriam:{n:'Old Miriam',short:'Miriam',role:'Fruit seller',i:'🍎',x:18,y:22,sells:{apple:.9,olive:1},buys:{fish:1.05},spread:.1,haggle:.65,mg:.6,
    hi:["Ah, a new face. Apples from my brother's orchard, crisp as morning.","Olives, apples, and advice. Only the advice is free."],
    happy:["There's my favourite customer! I kept the good ones for you.","You remind me of my late husband. He also counted every coin."],
    sad:["Hmph. Haggling with an old woman. Your mother would be ashamed."],
    thx:["Come back tomorrow, regulars get my best prices.","Eat one yourself, you're too thin."],
    hagOk:["Fine, fine. For that smile."],hagNo:["Child, I have been selling apples since before your grandfather was born."]},
  hassan:{n:'Hassan the Spice King',short:'Hassan',role:'Spice merchant',i:'🌶️',x:80,y:18,sells:{spice:1.12,salt:1.05},buys:{olive:1.12,apple:1.18},spread:.18,haggle:.3,mg:.25,
    hi:["Finest spice from beyond the mountains! Prices? Prices are a state of mind.","Smell that. That is the smell of profit, my friend."],
    happy:["My friend! For you, almost fair prices."],
    sad:["You again. Prices went up. Just now. Just for you."],
    thx:["A pleasure robbing... I mean, serving you.","Tell your friends. Not your clever friends."],
    hagOk:["Ugh. You drive a hard bargain. Fine. Don't tell anyone."],hagNo:["Ha! No. And now I like you less."]},
  yusuf:{n:'Yusuf the Fisherman',short:'Yusuf',role:'Fisherman',i:'🐟',x:14,y:74,sells:{fish:.72},buys:{salt:1.25,apple:1.08},spread:.1,haggle:.5,mg:.4,
    hi:["Fish this morning, stink by tomorrow. Sell fast, friend.","The sea was kind today. Mostly.","My cousin builds ships at the harbour. One day you'll want one, mark my words."],
    happy:["You again! Take the big one, it looked at me funny anyway."],
    sad:["Go buy your fish somewhere else. Oh wait. There is nowhere else."],
    thx:["Salt is gold to a fisherman. Bring me salt.","Don't keep it overnight. Trust me."],
    hagOk:["Eh, the fish won't care. Deal."],hagNo:["The sea doesn't haggle with me, I don't haggle with you."]},
  leyla:{n:'Leyla the Weaver',short:'Leyla',role:'Weaver',i:'🧵',x:47,y:15,sells:{cloth:.9},buys:{spice:1.15,salt:1.08},spread:.12,haggle:.45,mg:.35,
    hi:["Every thread counted. Every coin too.","I dye with spice, you know. Bring me some and we'll talk."],
    happy:["You have an eye for quality. Rare in this bazaar."],
    sad:["I'm busy. Make it quick."],
    thx:["The caravan folk love my cloth. Just saying.","Mind the colour, it runs if you're careless."],
    hagOk:["Very well. A small discount for a steady customer."],hagNo:["My prices are woven as tightly as my cloth."]},
  tarik:{n:'Tarik the Potter',short:'Tarik',role:'Potter',i:'🏺',x:84,y:56,sells:{pottery:.85},buys:{fish:1.18,olive:1.15},spread:.12,haggle:.5,mg:.4,
    hi:["Careful, heavy. Pots break, backs break.","Fired yesterday, still warm. Like my temper."],
    happy:["Ah, my strong-backed friend! Take two."],
    sad:["You break it, you buy it. You already annoyed me, so."],
    thx:["The coast traders pay well for good pots.","Lift with your legs!"],
    hagOk:["Fine. One crooked pot price for you."],hagNo:["Clay is cheap. My hands are not."]},
  caravan:{n:'The Caravan Master',short:'Caravan',role:'Trader to the coast',i:'🐫',x:52,y:90,sells:{salt:.8,spice:.97},buys:{cloth:1.3,pottery:1.35,olive:1.08},spread:.15,haggle:.35,mg:.3,
    hi:["We leave for the coast at dawn. Cloth and pots, that's what sells over there.","Salt from the desert, spice from the east. Buy now or wait a month."],
    happy:["Ah, my favourite supplier! The camels like you too."],
    sad:["Next. Next! Who's next?"],
    thx:["Bring more pots. The coast eats them.","A donkey would carry more, you know."],
    hagOk:["You talk like a caravan man. Fine."],hagNo:["I've crossed deserts. Your haggling doesn't scare me."]},
  tavern:{n:'The Thirsty Camel',short:'Tavern',role:'Tavern',i:'🍺',x:28,y:46,sells:{},buys:{fish:1.15,apple:1.25,olive:1.12},spread:.1,haggle:.45,mg:.4,
    hi:["Sit, drink, listen. Everyone talks here.","Food for the kitchen? I'll buy. Rumours? I'll sell.","Rich merchants hire street boys to run errands. Smart, if you can afford it."],
    happy:["Your usual corner is free, friend."],
    sad:["Pay first, then talk."],
    thx:["The cook will be pleased.","Hungry crowd tonight."],
    hagOk:["For a regular, sure."],hagNo:["This is a tavern, not a bazaar. Well. It's both. Still no."]}
};
const TK=Object.keys(T);
const WELL={x:58,y:60};
const MARKS=['','⭐','💰','❗','❌'];
const QUIET=["The crier yawns. Nothing new today.","A goat escaped and ate a merchant's hat. Prices unaffected.","The Sultan's cat had kittens. The city rejoices, the market shrugs.","Two merchants argued about the weather. Nobody won.","Clear skies. Ordinary day. Good day to count coins."];

const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=v=>'$'+v.toFixed(2);
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

const EV={
  astro:()=>{const g=pick(['spice','cloth','olive','pottery','salt','apple']);return{goods:[g],bid:1.6,ask:1.12,dur:5,
    news:`Astrologers have proclaimed the Week of ${G[g].n}! The number of ${G[g].n.toLowerCase()} lovers in the city has doubled.`,
    rumor:`A drunk astrologer is whispering about ${G[g].n.toLowerCase()}. Something big is coming.`}},
  caravan:()=>({goods:['cloth','spice'],bid:.85,ask:.62,dur:3,news:'A great caravan from the East has arrived. Cloth and spice flood the market.',rumor:'A camel driver swears a big eastern caravan is a few days out. Cloth and spice will get cheap.'}),
  storm:()=>({goods:['fish'],bid:1.9,ask:1.9,dur:2,news:'Storm at sea! The boats stayed in the harbour.',rumor:'The old sailors say they smell a storm coming.'}),
  festival:()=>({goods:['apple','olive','fish'],bid:1.5,ask:1.1,dur:1,news:'Festival day! The whole city is feasting.',rumor:'A festival is coming soon. People will eat like kings.'}),
  drought:()=>({goods:['pottery'],bid:1.35,ask:1.5,dur:4,news:'The clay pits dried up. No clay, no pots.',rumor:"The potters' village is short of water. Pots may get scarce."}),
  salt:()=>({goods:['salt'],bid:1.6,ask:1.35,dur:4,news:'The Sultan has taxed salt. Suddenly everyone wants it.',rumor:"The Sultan's men were asking questions about salt..."})
};
function maybeEvent(){return Math.random()>.45?null:EV[pick(Object.keys(EV))]()}

let S;
function newState(){
  const p={},mood={};
  TK.forEach(t=>{p[t]={};mood[t]=0;[...Object.keys(T[t].sells),...Object.keys(T[t].buys)].forEach(g=>p[t][g]=Math.exp(gauss()*.06))});
  const gw={};GK.forEach(g=>gw[g]=1);
  const s={cash:5,day:1,t:0,at:null,x:WELL.x,y:WELL.y,inv:[{g:'apple',q:1,d:1}],cap:20,donkey:false,cart:false,p,gw,mood,nb:{},marks:{},
    effects:[],schedule:{},news:[pick(QUIET)],rumors:[],visit:{t:null,haggled:false,tried:false,line:''},won:false,trades:0,px:6,py:6,boys:0,ms:0,store:false,storeInv:[],contract:null,offer:null,contractsDone:0};
  for(let d=2;d<=7;d++)s.schedule[d]=maybeEvent();
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}

const weight=()=>S.inv.reduce((a,l)=>a+l.q*G[l.g].w,0);
const count=g=>S.inv.filter(l=>l.g===g).reduce((a,l)=>a+l.q,0);
function addLot(g){const l=S.inv.find(l=>l.g===g&&l.d===S.day);if(l)l.q++;else S.inv.push({g,q:1,d:S.day})}
function removeOne(g){const l=S.inv.filter(l=>l.g===g).sort((a,b)=>a.d-b.d)[0];l.q--;if(!l.q)S.inv.splice(S.inv.indexOf(l),1)}
function effM(g,k){let m=1;S.effects.forEach(e=>{if(e.goods.includes(g))m*=e[k]});return m}
const mid=(t,g)=>G[g].b*S.gw[g]*S.p[t][g];
const hag=t=>S.visit.t===t&&S.visit.haggled;
function ask(t,g){const tr=T[t];return mid(t,g)*tr.sells[g]*(1+tr.spread)*(1-.02*S.mood[t])*(hag(t)?.92:1)*effM(g,'ask')}
function bid(t,g){const tr=T[t];return mid(t,g)*tr.buys[g]*(1-tr.spread)*(1+.02*S.mood[t])*(hag(t)?1.08:1)*effM(g,'bid')}
function clock(){const m=360+Math.min(S.t,DAY_LEN);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dur(m){m=Math.max(0,m);const h=Math.floor(m/60),mm=m%60;return h?`${h}h ${String(mm).padStart(2,'0')}m`:`${mm} min`}

function checkMs(silent){
  const L=S.ch===2?MS2:MS,k=S.ch===2?'ms2':'ms';
  let up=null;
  while((S[k]||0)<L.length&&L[S[k]||0].ok()){S[k]=(S[k]||0)+1;up=L[S[k]-1]}
  renderHud();
  if(!up)return;
  save();renderMap();
  if(S[k]>=L.length){
    if(S.ch===2){if(!S.won2){S.won2=true;save();if(!silent)setTimeout(showEnding2,500)}}
    else if(!S.won){S.won=true;save();if(!silent)setTimeout(showEnding,500)}
    return}
  if(silent)return;
  const nx=L[S[k]].txt;
  setTimeout(()=>setSheet(`<h2>🎉 You are now ${up.title}</h2><div class="bubble">${up.msg}</div><p><b>Next goal:</b> ${nx}</p><button class="sbtn fill wide" onclick="closeSheet();if(S.at)openAt(S.at)">Continue</button>`),450);

const bxy=b=>[1+3*b[0],1+3*b[1]];
const door=id=>{const [x,y]=bxy(BLK[id]);return [x,y-1]};
const BLOCKED=new Set();
[...Object.values(BLK),...Object.values(FILL)].forEach(b=>{const [x,y]=bxy(b);for(let i=0;i<2;i++)for(let j=0;j<2;j++)BLOCKED.add((x+i)+','+(y+j))});
BLOCKED.add('0,7');BLOCKED.add('0,8');
let bfsCache=null;
function bfs(){
  const key=S.px+','+S.py;if(bfsCache&&bfsCache.key===key)return bfsCache;
  const prev={},dist={[key]:0},q=[[S.px,S.py]];
  while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;
    if(nx<0||ny<0||nx>=GW||ny>=GW||BLOCKED.has(k)||k in dist)continue;dist[k]=dist[x+','+y]+1;prev[k]=[x,y];q.push([nx,ny])}}
  return bfsCache={key,prev,dist};
}
function pathTo(id){const [tx,ty]=door(id),{prev}=bfs();const out=[];let c=[tx,ty];while(c&&!(c[0]===S.px&&c[1]===S.py)){out.unshift(c);c=prev[c[0]+','+c[1]]}return out}
function minPerTile(){if(S.camel)return 4;if(S.cart)return 5;if(S.donkey)return 4;return weight()>S.cap/2?7:5}
function walkCost(t){return pathTo(t).length*minPerTile()}
function clockAt(t){const m=360+Math.min(t,DAY_LEN);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

function note(t){
  const q={};
  Object.keys(T[t].sells).forEach(g=>q[g]={k:'a',v:ask(t,g)});
  Object.keys(T[t].buys).forEach(g=>q[g]={k:'b',v:bid(t,g)});
  S.nb[t]={day:S.day,q};
}

let preview=null,walking=false;
function goTo(t){tapPlace(t)}
function tapPlace(id){
  if(walking)return;
  if(PL[id]&&!(id==='store'&&S.store)&&!(id==='stand'&&S.ch===2)){clearPreview();showPlace(id);return}
  if(S.at===id){clearPreview();openAt(id);return}
  if(preview&&preview.id===id){go();return}
  const path=pathTo(id),m=minPerTile(),c=path.length*m;
  preview={id,path,m,c};renderMap();
  const name=id==='stand'&&S.ch===2?'Your stand':(T[id]||PL[id]).n,ok=S.t+c<=DAY_LEN;
  const pill=document.getElementById('pill');
  pill.innerHTML=`<div class="info"><b>${name}</b><div class="small">${path.length} squares × ${m} min = ${c} min. ${ok?'Arrive '+clockAt(S.t+c):'You won\u2019t make it before sunset.'}</div></div>${ok?'<button class="sbtn fill" onclick="go()">Walk</button>':''}<button class="x" onclick="clearPreview()" aria-label="Cancel">✕</button>`;
  pill.classList.add('on');
}
function clearPreview(){preview=null;document.getElementById('pill').classList.remove('on');if(!walking)renderMap()}
function go(){
  if(!preview)return;const {id,path,m}=preview;
  if(S.t+path.length*m>DAY_LEN){toast('The stalls will be closed by then. Time to sleep 🌙');return}
  preview=null;document.getElementById('pill').classList.remove('on');closeSheet();
  walking=true;S.at=null;renderMap();
  let i=0;const hero=()=>document.getElementById('hero');
  const step=()=>{
    if(i>=path.length){walking=false;arrive(id);return}
    const [x,y]=path[i++];S.px=x;S.py=y;S.t+=m;

function trade(kind,t,g,n){
  let done=0,total=0,msg='';
  for(let i=0;i<n;i++){
    if(kind==='buy'){
      const p=ask(t,g);
      if(S.cash<p){msg='Not enough coins';break}
      if(weight()+G[g].w>S.cap){msg='Your bag is full';break}
      S.cash-=p;addLot(g);S.p[t][g]*=IMPACT;
    }else{
      if(!count(g))break;
      const p=bid(t,g);S.cash+=p;removeOne(g);S.p[t][g]/=IMPACT;
    }
    done++;S.trades++;S.mood[t]=Math.min(3,S.mood[t]+T[t].mg*.15);
  }
  if(done){
    toast(`${kind==='buy'?'Bought':'Sold'} ${done} ${G[g].i}${msg?'. '+msg+'.':''}`);
    if(Math.random()<.3)S.visit.line=pick(T[t].thx);
  }else if(msg)toast(msg+'.');
  note(t);save();renderHud();renderMap();renderStall(t);
  checkMs();
}

  S.day++;
  const sp={};
  const rot=l=>{const s=G[l.g].s;if(s&&S.day-l.d>=s){sp[l.g]=(sp[l.g]||0)+l.q;return false}return true};
  S.inv=S.inv.filter(rot);if(S.storeInv)S.storeInv=S.storeInv.filter(rot);

  TK.forEach(t=>S.mood[t]*=.92);
  if(S.contract&&S.day>S.contract.until){log.push(`Your contract for ${S.contract.q} ${G[S.contract.g].n.toLowerCase()} expired. The Caravan Master is not pleased.`);S.mood.caravan=Math.max(-3,S.mood.caravan-2);S.contract=null}
  S.effects=S.effects.filter(e=>e.until>=S.day);
  const ev=S.schedule[S.day];delete S.schedule[S.day];
  S.news=[];
  if(ev){S.effects.push({...ev,until:S.day+ev.dur-1});S.news.push(ev.news)}else S.news.push(pick(QUIET));
  for(let d=S.day+1;d<=S.day+6;d++)if(!(d in S.schedule))S.schedule[d]=maybeEvent();
  S.t=0;S.at=null;S.px=START[0];S.py=START[1];S.visit={t:null,haggled:false,tried:false,line:''};

    if(pay<boys){log.push(`You couldn't pay ${boys-pay} errand boy${boys-pay>1?'s':''}, so ${boys-pay>1?'they':'he'} quit.`);S.boys=boys=pay}

}

const PEOPLE=['A sailor','A housewife','A soldier','A pilgrim','A cook from the palace','A tired porter','A schoolteacher','A young couple'];
const HUNTERS=['A penny-pinching uncle','A bargain hunter','A haggling grandmother'];
function effOn(g,k,day){let m=1;S.effects.forEach(e=>{if(e.until>=day&&e.goods.includes(g))m*=e[k]});const ev=S.schedule[day];if(ev&&ev.goods.includes(g))m*=ev[k];return m}
const street=g=>G[g].b*S.gw[g]*Math.sqrt(effM(g,'bid')*effM(g,'ask'));
const futureStreet=g=>G[g].b*S.gw[g]*Math.sqrt(effOn(g,'bid',S.day+1)*effOn(g,'ask',S.day+1));
function skewM(g){const r=S.stand.rules[g];if(!S.stand.clerk||!r||!r.k)return 1;return Math.max(.7,Math.min(1.3,1-r.k/100*(scount(g)-r.target)))}
const qBuy=g=>street(g)*S.stand.bq[g]*skewM(g), qSell=g=>street(g)*S.stand.sq[g]*skewM(g);
function addStore(g){S.storeInv=S.storeInv||[];const l=S.storeInv.find(l=>l.g===g&&l.d===S.day);if(l)l.q++;else S.storeInv.push({g,q:1,d:S.day})}
function removeStoreOne(g){const l=S.storeInv.filter(l=>l.g===g).sort((a,b)=>a.d-b.d)[0];if(!l)return;l.q--;if(!l.q)S.storeInv.splice(S.storeInv.indexOf(l),1)}
function startCh2(){
  S.ch=2;S.ms2=0;S.camel=true;S.donkey=true;S.cap=Math.max(S.cap,150);S.store=true;S.storeInv=S.storeInv||[];S.won=true;
  S.stand={on:{},bq:{},sq:{},log:[],edge:0,dayEdge:0,dayTrades:0,sold:0,clerk:false,rules:{},minded:0,slots:3};
  save();render();
  setSheet(`<h2>Chapter two: The Stand</h2><div class="bubble">The lawyer clears his throat and reads the will again, slower this time.</div>
  <p>The palaces were mortgaged. The fleet sank eleven years ago. Your uncle's only real possession was a camel. Her name is Destiny.</p>
  <p>Well. You still have your coins, your storeroom, and now a stand of your own. Destiny carries 150 and walks like a queen.</p>
  <p><b>How the stand works.</b> Pick up to three goods and set the price you buy at and the price you sell at, compared to today's street price. Customers come while you mind the stand. Stock comes from your storeroom.</p>
  <p>Too greedy and nobody comes. Too generous and you give money away. And watch for sharp-eyed merchants 🕵️: they sometimes know tomorrow's prices.</p>
  <button class="sbtn fill wide" onclick="closeSheet()">Open for business</button>`);
}
function doStand(side,g,q,price,st,who){
  for(let i=0;i<q;i++){if(side==='buy'){removeStoreOne(g);S.cash+=price}else{addStore(g);S.cash-=price}}
  const e=(side==='buy'?price-st:st-price)*q;
  S.stand.edge+=e;S.stand.dayEdge+=e;S.stand.dayTrades++;if(side==='buy')S.stand.sold+=q;
  S.stand.log.unshift(`<span class="small">${clock()}</span> ${who} ${side==='buy'?'buys':'sells you'} ${q} ${G[g].i} at ${fmt(price)}.`);
  S.stand.log=S.stand.log.slice(0,12);
}
function simHour(eff){
  const goods=GK.filter(g=>S.stand.on[g]);if(!goods.length)return 0;
  const tm=S.schedule[S.day+1],lam=(2+goods.length)*eff;
  let n=-1,p=1;const L=Math.exp(-lam);do{n++;p*=Math.random()}while(p>L);
  let tr=0;
  for(let i=0;i<n;i++){
    const g=pick(goods),st=street(g),bp=qBuy(g),sp=qSell(g);
    if(Math.random()<.04+(tm&&tm.goods.includes(g)?.35:0)){
      const fs=futureStreet(g);
      if(fs>sp*1.03&&scount(g)>0){doStand('buy',g,Math.min(scount(g),3+Math.floor(Math.random()*8)),sp,st,'🕵️ A sharp-eyed merchant');tr++;continue}
      if(fs<bp*.97){const q=Math.min(Math.floor(S.cash/bp),3+Math.floor(Math.random()*8));if(q>0){doStand('sell',g,q,bp,st,'🕵️ A sharp-eyed merchant');tr++;continue}}
    }
    const hunter=Math.random()<.25,w=hunter?.08:.3,who=hunter?pick(HUNTERS):pick(PEOPLE);
    if(Math.random()<.5){const res=st*(1+Math.random()*w);if(sp<=res&&scount(g)>0){doStand('buy',g,Math.min(scount(g),1+Math.floor(Math.random()*3)),sp,st,who);tr++}}
    else{const res=st*(1-Math.random()*w);if(bp>=res){const q=Math.min(Math.floor(S.cash/bp),1+Math.floor(Math.random()*3));if(q>0){doStand('sell',g,q,bp,st,who);tr++}}}
  }
  return tr;
}
function mind(h){
  if(S.at!=='stand')return;
  const mins=Math.min(h*60,DAY_LEN-S.t);if(mins<=0){toast('The bazaar is closing for the night.');return}
  if(!GK.some(g=>S.stand.on[g])){toast('Pick at least one good to deal in first.');return}
  let t=0,tr=0;while(t<mins){const st=Math.min(60,mins-t);S.t+=st;S.stand.minded+=st;tr+=simHour(st/60);t+=st}
  toast(tr?`${tr} customer${tr>1?'s':''} traded with you.`:'Quiet. Nobody bought or sold.');
  save();renderHud();renderMap();showPlace('stand');checkMs();
}
function toggleDeal(g){const st=S.stand,n=GK.filter(x=>st.on[x]).length;
  if(st.on[g])st.on[g]=false;else{if(n>=st.slots){toast(`Your stand has room for ${st.slots} goods.`);return}st.on[g]=true;if(st.bq[g]==null){st.bq[g]=.9;st.sq[g]=1.1}}
  save();showPlace('stand')}
function adj(g,k,d){const st=S.stand;let v=Math.round((st[k][g]+d*.02)*100)/100;
  if(k==='bq')v=Math.max(.5,Math.min(st.sq[g]-.02,v));else v=Math.min(1.6,Math.max(st.bq[g]+.02,v));
  st[k][g]=v;save();showPlace('stand')}
function adjRule(g,f,d){const r=S.stand.rules[g]||(S.stand.rules[g]={target:10,k:0});
  if(f==='target')r.target=Math.max(0,Math.min(60,r.target+d*2));else r.k=Math.max(0,Math.min(5,r.k+d));
  save();showPlace('stand');checkMs()}
function unload(){let k=0;GK.forEach(g=>{k+=moveGoods(g,999,true)});toast(k?`Destiny carries ${k} goods into stock.`:'Your bag is empty.');save();renderHud();renderMap();showPlace('stand')}
function hireClerk(){S.stand.clerk=true;S.stand.slots=5;S.visit.line="The barman's nephew bows. He can count, he can smile, and he does exactly what you tell him. Nothing more.";save();renderStall('tavern');checkMs()}
function standNight(log){
  const st=S.stand;
  if(st.clerk){const h=Math.floor(Math.max(0,DAY_LEN-st.minded)/60),e0=st.dayEdge,t0=st.dayTrades;for(let i=0;i<h;i++)simHour(.6);
    log.push(`Your clerk minded the stand for ${h} hours: ${st.dayTrades-t0} trades, edge ${fmt(st.dayEdge-e0)}.`)}
  log.push(`Your stand today: ${st.dayTrades} trades, edge earned ${fmt(st.dayEdge)}.`);
  const cost=5+(st.clerk?4:0);S.cash-=cost;log.push(`Stand rent${st.clerk?' and clerk wage':''}: ${fmt(cost)}.`);
  st.minded=0;st.dayEdge=0;st.dayTrades=0;
}
function standSheet(head){
  const st=S.stand,here=S.at==='stand',n=GK.filter(g=>st.on[g]).length,pc=v=>Math.round(v*100)+'%';
  let h=head('🪧','Your stand',`Rent $5 a day. Deals ${n} of ${st.slots} goods.`);
  h+=`<div class="stat"><div class="chip">Today<b>${st.dayTrades}</b>trades</div><div class="chip">Edge today<b>${fmt(st.dayEdge)}</b></div><div class="chip">Total edge<b>${fmt(st.edge)}</b></div></div>`;
  h+=`<p class="small">Edge is how much better your prices were than the street price. Stock comes from your storeroom.${st.clerk?' Your clerk runs the stand when you are away.':''}</p>`;
  if(here){
    h+=`<div class="acts" style="margin-top:4px"><button class="sbtn fill" onclick="mind(1)">Mind 1 hour</button><button class="sbtn fill" onclick="mind(3)">Mind 3 hours</button><button class="sbtn" onclick="mind(99)">Until sunset</button><button class="sbtn" onclick="unload()">🐪 Unload bag into stock</button></div>`;
  }else h+=`<div class="bubble">Walk here to mind the stand yourself.</div>`;
  h+=`<h3>Your prices</h3>`;
  GK.forEach(g=>{
    const on=st.on[g],s=street(g),k=scount(g);
    h+=`<div class="nbg"><div style="display:flex;align-items:center;gap:6px"><span class="gi">${G[g].i}</span><div class="info"><b>${G[g].n}</b><div class="small">Street ${fmt(s)}, in stock ${k}</div></div><button class="sbtn${on?'':' fill'}" ${!on&&n>=st.slots?'disabled':''} onclick="toggleDeal('${g}')">${on?'Stop':'Deal'}</button></div>`;
    if(on){
      h+=`<div class="qrow">You buy at <b>${pc(st.bq[g])}</b> = ${fmt(qBuy(g))}<button class="mini" onclick="adj('${g}','bq',-1)">−</button><button class="mini" onclick="adj('${g}','bq',1)">+</button></div>`;
      h+=`<div class="qrow">You sell at <b>${pc(st.sq[g])}</b> = ${fmt(qSell(g))}<button class="mini" onclick="adj('${g}','sq',-1)">−</button><button class="mini" onclick="adj('${g}','sq',1)">+</button></div>`;
      if(st.clerk){const r=st.rules[g]||{target:10,k:0};
        h+=`<div class="qrow">Clerk keeps about <b>${r.target}</b> in stock<button class="mini" onclick="adjRule('${g}','target',-1)">−</button><button class="mini" onclick="adjRule('${g}','target',1)">+</button></div>`;
        h+=`<div class="qrow">and shifts both prices <b>${r.k}%</b> per unit above or below it<button class="mini" onclick="adjRule('${g}','k',-1)">−</button><button class="mini" onclick="adjRule('${g}','k',1)">+</button></div>`;}
    }
    h+=`</div>`;
  });
  h+=`<h3>Recent customers</h3>`+(st.log.length?st.log.map(l=>`<div class="log">${l}</div>`).join(''):'<p class="small">No customers yet.</p>');
  return h;
}
function showEnding2(){setSheet(`<h2>End of chapter two</h2>
  <div class="bubble">The harbour master counts your coins twice, then grins. “Passage for one merchant and one very proud camel.”</div>
  <p>At dawn the ship leaves the bay. The bazaar shrinks behind you: Miriam waving an apple, Hassan pretending not to care, your clerk already lowering prices.</p>
  <p>Destiny is seasick. You are not.</p>
  <p class="small">Chapter three: the sea. It took you ${S.day} days.</p>
  <button class="sbtn fill wide" onclick="closeSheet()">Keep trading</button>`)}
function confirmNew(){setSheet(`<h2>Start over?</h2><p>Your coins, goods and notebook will be gone.</p><button class="sbtn fill wide" onclick="newGame()">Start a new game</button><button class="sbtn wide" onclick="closeSheet()">Keep playing</button>`)}
function newGame(){S=newState();save();render();intro()}

S=load();
for(const [n,v] of [['showNews','news'],['showNotebook','notebook'],['showBag','bag']]){const f=window[n];window[n]=function(){f();setNav(v)}}
{const f=window.renderStall;window.renderStall=function(t){f(t);setNav('here')}}
{const f=window.showPlace;window.showPlace=function(t){f(t);if(S.at===t)setNav('here')}}
if(!S){S=newState();save();render();intro()}else{closeSheet();if(S.px==null){S.px=START[0];S.py=START[1];S.at=null}render();checkMs(true)}
</script>
